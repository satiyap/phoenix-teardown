  # --- H. Context and memory ---
  # H1: Which of these exist as *separate* concepts: prompt context, working state, session history, ...
  H1:
    verdict: first_class
    note: "Separated by RESIDENCY COST, not taxonomy: system/** always in the system prompt; other files metadata-only until read; memory_filesystem is a read-only projection block; skills and mods are separately installable."
    evidence: "src/tools/descriptions/Memory.md @ 852ca24; src/agent/memory-constants.ts"
  # H2: Who owns memory: agent, human, workspace, task, or tenant?
  H2:
    verdict: first_class
    note: "Memory is owned per agent, one git repo each at ~/.letta/agents/<id>/ (API) or <storage>/memfs/<id>/ (local)."
    evidence: "src/permissions/cross-agent-guard.ts:101-104 @ 852ca24"
  # H3: Can memory be shared between agents? At what granularity?
  H3:

    note: "No idempotency key on tool calls. Git makes memory writes idempotent in effect, but not tool side effects."
    evidence: "src/tools/impl/memory.ts @ 852ca24"
  # C7: Process crash recovery: what resumes, and from where?
  C7:
    verdict: first_class
    note: "Dedicated recovery paths and tests: headless-approval-recovery, headless-bootstrap-pending-approval, headless-interrupt-recovery, headless-interrupt-latch, headless-backend-lifecycle."
    evidence: "src/headless-*.test.ts @ 852ca24"
  # C8: Node loss: is work re-dispatched, and how is it detected?
  C8:
    verdict: first_class
    note: "SchedulerOwner uses pid + token + process_start_ticks + boot_id to detect a stale owner across PID reuse and host reboot. Best liveness detection in the study."
    evidence: "src/cron/cron-file.ts:45-52 @ 852ca24"
  # C9: Context-window overflow: truncation, summarisation, or failure?
  C9:
    verdict: first_class
    note: "Compaction with local/API parity tests plus explicit context-pressure handling; subagents have a context budget."
    evidence: "src/backend/local-compaction-parity.test.ts, src/agent/subagents/context-budget.ts @ 852ca24"
  # C10: Timers, scheduled execution, long sleeps — durable across restart?
  C10:
    verdict: first_class
    note: "Cron with IANA timezones, recurring and one-off tasks, lease-owned scheduler, and a run log. Reminders engine as well."
    evidence: "src/cron/cron-file.ts:70-76 @ 852ca24"
  # C11: Human-in-the-loop pause and resume: durable, or in-memory only?
  C11:
    verdict: first_class
    note: "PendingControlRequest events persist to disk so an approval survives restart; bootstrap path explicitly handles a pending approval blocking new messages."
    evidence: "src/channels/pending-control-requests.ts @ 852ca24; src/headless-bootstrap-pending-approval.test.ts"
  # C12: Can a definition be upgraded while runs are in flight? What happens to them?
  C12:

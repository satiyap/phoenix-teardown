    evidence: "src/permissions/memory-paths.ts:115 @ 852ca24"
  # A2: What is the root resource — the thing everything else hangs off?
  A2:
    verdict: first_class
    note: "Agent is genuinely the root: listable, searchable by name/tag, shareable, owning memory, blocks, conversations, subagents and cron tasks."
    evidence: "letta-code CLI 0.31.0 --help output, verified 2026-08-26"
  # A3: Is `Agent` persistent or ephemeral? Can it exist while not executing?
  A3:
    verdict: first_class
    note: "Persistent and exists while not executing. `letta agents list` enumerates agents independent of any running process."
    evidence: "letta-code CLI 0.31.0 --help output, verified 2026-08-26"

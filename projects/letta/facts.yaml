    evidence: "src/channels/pending-control-requests.ts @ 852ca24"
  # C2: *When* is state persisted — every step, every tool call, on checkpoint, never?
  C2:
    verdict: implicit
    note: "Memory commits per tool call and pushes after the turn. No declared persistence-timing contract for conversation state (no sync/async/exit equivalent)."
    evidence: "src/tools/descriptions/Memory.md @ 852ca24"
  # C3: Checkpointing or event sourcing? Can state be rebuilt from a log?
  C3:
    verdict: first_class
    note: "Git commit history IS the checkpoint chain for memory: diff, backup, restore, export and pull are first-class commands."
    evidence: "letta-code CLI 0.31.0 --help output, verified 2026-08-26"
  # C4: Retry semantics, and at what granularity: run, step, tool call?
  C4:

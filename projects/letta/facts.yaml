  # --- G. Human-agent collaboration ---
  # G1: Is a human modelled as a special kind of agent, a distinct principal type, or not modelled?
  G1:
    verdict: first_class
    note: "Humans are first-class in channels with allowed users, admin users, dm|group scope, and an access decision of allow|deny|PAIR (pending authorisation). Agents are separate principals with kernel-enforced memory boundaries. Two distinct principal types with different mechanisms."
    evidence: "src/channels/access-control.ts:23-95 @ 852ca24"
  # G2: Shared rooms, channels, or workspaces?
  G2:

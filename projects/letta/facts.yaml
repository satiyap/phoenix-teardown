    evidence: "src/agent/system-prompt-versioning.test.ts @ 852ca24"

  # --- D. Agent identity and lifecycle ---
  # D1: Is an agent globally addressable? By what identifier?
  D1:
    verdict: first_class
    note: "Globally addressable as agent-<id> via --agent, LETTA_AGENT_ID or AGENT_ID, with documented resolution precedence: explicit > session context > env."

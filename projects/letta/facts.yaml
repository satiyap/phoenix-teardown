object_model: |
  Agent                          (agent-<id>; durable, addressable, shareable)
   |-- AGENT_ID                  (identity; propagated into processes as env)
   |-- Memory                    (git repo per agent: ~/.letta/agents/<id>/
   |    |                         or <storage>/memfs/<id>/)
   |    |-- system/**            ALWAYS in system prompt (residency cost)
   |    `-- **                   metadata only until read; [[path]] cross-refs
   |-- Blocks                    (agent.blocks; memory_filesystem is read-only)
   |-- Tags                      (filterable, ANY or ALL matching)
   |-- Conversation[]            (target: default | new | specific id)
   |    |-- Turn queue
   |    `-- PendingControlRequest    (durable approvals, persisted to disk)
   |-- Subagent[]                (own process; scope = {self, parent})
   |-- CronTask[]                (scheduled prompts, lease-owned)
   |-- Skills / Mods             (installable packages)
   `-- Permissions               (rules x scope x mode, engine v1|v2)

  Channel                        (Slack | Discord | Telegram | public)
   |-- AccessControl             (allowed/admin users, scope dm|group,
   |                              decision allow|deny|pair)
   |-- ThreadContext
   `-- CommandGate               (with floor-only guarantee)

  Environment                    (remote; `letta teleport` moves conversations)
  Backend                        (local | api | dev)

strongest_ideas:
  - "Git-backed memory: provenance, audit, diff, revert and conflict detection come free from the storage substrate. letta memory status/diff/backup/restore/export are thin wrappers over git."
  - "system/ vs referenced memory as a CONTEXT-BUDGET mechanism rather than a taxonomy: always-resident versus metadata-only-until-read, with `letta memory tokens` measuring cost and explicitly leaving policy to the caller."
  - "The memory tool requires a `reason` argument on every mutation - provenance enforced by tool signature."
  - "Memory permissions enforced by kernel sandbox, FAIL-CLOSED: 'cannot read or write other agents memory. Throws when no supported kernel sandbox is available rather than silently running with a weaker policy.'"
  - "SandboxAvailability { backend: SandboxBackend|null, reason } detected by a REAL user-namespace mount probe. Best capability signalling in the study: distinguishes unavailable from unknown AND explains which."
  - "An unbypassable policy floor at decision step 0, beneath the configurable modes and rules."
  - "PermissionShadowComparison: run the v2 policy engine in shadow against v1 and compare decisions before cutover."
  - "SchedulerOwner with pid + token + process_start_ticks + boot_id - lease ownership that survives PID reuse and host reboot."
  - "Nine named cron run reasons including started_too_late, queue_full and runtime_unavailable - the failure modes everyone else swallows."
  - "ChannelSenderAccessDecision = allow | deny | PAIR: a pending-authorisation state for an unknown sender instead of a binary refusal."
  - "floorOnlyChannelCommandGate(): a guaranteed minimum command set that no configuration can remove."
  - "A DOCUMENTED ABANDONED DESIGN: the comment explaining why shell-command parsing was removed (bypassable by symlinks, command substitution, globbing, subprocesses) and why enforcement moved to the kernel."
  - "letta teleport: moving a live conversation between environments."
  - "JSON-only machine subcommands, making the CLI a scriptable API."

weakest_choices:
  - "DEFAULT_PERMISSION_MODE = 'unrestricted'. Defensible for a local developer tool, wrong for a platform, and a trap if the same code is later hosted."
  - "Shell confinement is OPT-IN (LETTA_FS_SANDBOX=1); by default agent shells run unconfined, so the stated enforcement boundary is not engaged for shells by default."
  - "No OpenTelemetry; telemetry is product analytics rather than tracing."
  - "No agent versioning or revocation despite strong agent identity."
  - "No resource quotas or cost ceilings - filesystem confinement only, so S9 is unanswered."
  - "No inter-agent messaging: delegation is process spawning, with no mailbox, ordering or correlation."
  - "Git as memory substrate cuts both ways: excellent provenance, but conflicts become the agent's problem and repository growth is unbounded."
  - "No tenancy in OSS; agent sharing exists without an org model to scope it."

reusable_components:
  - component: "Git-backed memory with provenance"
    decision: REUSE
    note: "Strongest answer to H4/H5 in the study."
  - component: "system/ vs referenced context budget"
    decision: ADOPT_AS_STANDARD
    note: "Cost model for prompt residency, not a taxonomy."
  - component: "Required `reason` on memory mutation"
    decision: REUSE
    note: "Provenance by signature."
  - component: "SandboxAvailability{backend|null, reason}"
    decision: ADOPT_AS_STANDARD
    note: "Reference implementation for ADR-0012."
  - component: "Fail-closed confinement"
    decision: ADOPT_AS_STANDARD
    note: "Refuse to run degraded rather than silently weaken policy."
  - component: "Unbypassable policy floor at step 0"
    decision: REUSE
    note: "Hard floor beneath configurable policy."
  - component: "PermissionShadowComparison"
    decision: REUSE
    note: "Safe policy-engine migration; basis for ADR-0013."
  - component: "SchedulerOwner lease fields"
    decision: REUSE
    note: "Liveness that survives reboot and PID reuse."
  - component: "Named cron run reasons"
    decision: ADOPT_AS_STANDARD
    note: "Failure taxonomy for our scheduler."
  - component: "allow|deny|pair access decision"
    decision: REUSE
    note: "Pending-authorisation state for unknown principals."
  - component: "allow|deny|ask|alwaysAsk decisions"
    decision: ADOPT_AS_STANDARD
    note: "Policy decision vocabulary."
  - component: "Kernel sandbox backends (bwrap/seatbelt)"
    decision: INTEGRATE
    note: "Provider options alongside containers."
  - component: "Default unrestricted permission mode"
    decision: BUILD
    note: "Reject; a platform must default to restrictive."
  - component: "Channels implementation"
    decision: INTEGRATE
    note: "Pattern for human surfaces; not our code."

lessons:
  - "THE affirmative ADR-0001 evidence the first two teardowns could not supply: agents are addressable, listable, tag-searchable, shareable, and identity is a SECURITY BOUNDARY - AGENT_ID decides which memory tree a process may touch, kernel-enforced. This is identity doing work a durable conversation cannot do, which is exactly the revised rationale (delegation, policy, audit) rather than durability. (confirms ADR-0001)"
  - "Cron's nine named run reasons and the active/paused/fired/missed/cancelled status set show the value of naming failure modes explicitly. (confirms ADR-0002)"
  - "Excellent HUMAN channels and zero inter-agent messaging suggests separating the two concerns: human collaboration surfaces and agent-to-agent transport are different problems, and one 'Channel' resource for both may be a modelling mistake. (amends ADR-0003)"
  - "Adapter tax appears even without adapters: canonicalToolName must map Codex/Gemini aliases into one vocabulary INSIDE the policy layer. Tool-name canonicalisation is a prerequisite for policy under adapter neutrality, not an afterthought. (amends ADR-0004)"
  - "Channels model humans as first-class participants with access control, admin roles and a `pair` authorisation state, while agents are separate principals with kernel-enforced boundaries. Two principal types, genuinely different mechanisms. (confirms ADR-0007)"
  - "Memory separated by RESIDENCY COST and by OWNERSHIP, with cross-agent access hard-denied. First first_class H4 in the study. Skills/mods as separately installable packages validates keeping agent memory distinct from shared knowledge. (confirms ADR-0008 strongly)"
  - "Sandbox providers should include KERNEL-LEVEL backends (bwrap, seatbelt), not only containers, and the interface should report availability with a reason rather than throwing on use. But filesystem confinement without CPU/memory quotas leaves S9 unanswered. (amends ADR-0009)"
  - "Three deep teardowns, zero OpenTelemetry. The gap is industry-wide rather than a per-project oversight, which strengthens adopting it as a differentiator. (confirms ADR-0010)"
  - "No version pin on suspended conversations here either, despite system-prompt-versioning tests existing. Three for three. (confirms ADR-0011)"
  - "SandboxAvailability plus the fail-closed rule is the reference implementation of declared capabilities. Three projects, three designs, and this one is best. (confirms ADR-0012 strongly)"
  - "NEW: policy engine changes must be verifiable before cutover. PermissionShadowComparison runs v2 against v1 on live traffic and compares decisions. Proposing ADR-0013."

adr_impact:
  - adr: ADR-0001
    effect: confirms
    note: "First affirmative evidence: agent identity is a kernel-enforced security boundary and agents are shareable, tag-searchable registry resources. Identity does work durability cannot."
  - adr: ADR-0002
    effect: confirms
    note: "Nine named cron run reasons and a five-state task machine show the value of enumerating failure modes."
  - adr: ADR-0003
    effect: amends
    note: "Strong human channels, zero agent-to-agent messaging. Separate the two concerns in the domain model."
  - adr: ADR-0004
    effect: amends
    note: "Tool-name canonicalisation across harness dialects is a prerequisite for policy, not an afterthought."
  - adr: ADR-0005
    effect: neutral
    note: "No MCP in the read tree; native tools with separate schema and description artifacts."
  - adr: ADR-0006
    effect: neutral
    note: "No A2A or ACP. Letta is a harness, not a host."
  - adr: ADR-0007
    effect: confirms
    note: "Humans are first-class in channels with access control and a `pair` state; agents are separate principals with kernel boundaries."
  - adr: ADR-0008
    effect: confirms
    note: "Memory separated by residency cost and ownership; cross-agent access hard-denied. First first_class H4."
  - adr: ADR-0009
    effect: amends
    note: "Include kernel-level sandbox backends, and report availability with a reason instead of throwing. But no CPU/memory quotas."
  - adr: ADR-0010
    effect: confirms
    note: "Third project with no OTel. Industry-wide gap."
  - adr: ADR-0011
    effect: confirms
    note: "No version pin on suspended conversations. Three for three."
  - adr: ADR-0012
    effect: confirms
    note: "SandboxAvailability{backend|null, reason} with a real mount probe plus fail-closed dependent code is the reference implementation."

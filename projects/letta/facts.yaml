    note: "No Task/Run split. Conversation plus turn queue is the unit; cron tasks schedule prompts into conversations."
    evidence: "src/cron/cron-file.ts:53 @ 852ca24"
  # A5: What is a `Session` attached to: user, agent, task, or execution?
  A5:
    verdict: first_class
    note: "Conversation is attached to an Agent; cron targets 'default' | 'new' | a specific conversation id."
    evidence: "src/cron/cron-file.ts:60-64 @ 852ca24"
  # A6: Are messages first-class durable resources, or transient function arguments?
  A6:
    verdict: implicit
    note: "Channel messages are durable in the channel platform and there is a `letta messages` subcommand, but messages are not a first-class internal resource with delivery guarantees."
    evidence: "letta-code CLI 0.31.0 --help output, verified 2026-08-26"
  # A7: Are artifacts (files, outputs, deliverables) first-class?
  A7:
    verdict: implicit
    note: "Memory files are durable artifacts in git; no separate Artifact resource."

object_model: |
  Session                      (hld/store/sqlite.go:95-130)
   |-- status                  draft | starting | running | completed | failed
   |                           | waiting_input | interrupting | interrupted
   |                           | discarded
   |-- cost_usd                per-session spend
   |-- dangerously_skip_permissions            bool
   |-- dangerously_skip_permissions_expires_at TIMESTAMP  <- bypass EXPIRES
   `-- ConversationEvent[]     (sequence-ordered)
        |-- tool_id, tool_name, tool_input_json
        |-- tool_result_for_id, tool_result_content
        |-- is_completed        TRUE when tool result received
        |-- approval_status     NULL | pending | approved | denied
        |-- approval_id         correlated approval
        `-- parent_tool_use_id  sub-task tracking (migration 6)

  Approval                     (hld/store/sqlite.go:201-220)
    id PRIMARY KEY
    run_id, session_id
    status       CHECK (status IN ('pending','approved','denied'))
    created_at, responded_at
    tool_name, tool_input       (JSON)
    comment                     denial reason OR approval note

strongest_ideas:
  - "An Approval TABLE with a status CHECK constraint - the only durable approval resource in the study."
  - "A partial index on pending approvals only (WHERE status = 'pending'), so 'what needs a human now' stays cheap regardless of history size."
  - "ErrAlreadyDecided carrying an AlreadyDecidedError{ID, Status}, so a retried decision reports what it already was instead of failing opaquely or overwriting."
  - "approval_id and approval_status denormalised onto the transcript event, so approval state reads inline with the tool call it governs rather than through a join."
  - "waiting_input as a first-class session status, making 'blocked on a human' an indexed query rather than an inference."
  - "interrupting distinct from interrupted - 'received interrupt signal and is shutting down' versus 'was interrupted but can be resumed'. A transitional cancel state; the only one in the study."
  - "draft and discarded states, so a session can be composed before it runs and abandoned without ever running."
  - "An EXPIRING permission bypass: dangerously_skip_permissions_expires_at, emitting session_settings_changed with reason='expired' and expired_at. Converts a permanent hole into a temporary one."
  - "Naming the dangerous flag dangerously_, the same instinct as ADK's unsafe_local_code_executor."
  - "Approve-with-comment and deny-with-reason, both durable in one comment column documented as 'for denial reasons or approval notes'."
  - "A typed event bus with filters on type, session and run, so many UI surfaces attach without the daemon knowing about them."
  - "ApprovalReconciler as an explicit abstraction for re-syncing approvals after session restart - keyed on run_id, triggered by restart, non-fatal on failure so a failed reconcile leaves the pending row for next time."
  - "The wire protocol documented in-repo, including socket path, 0600 permissions and line-delimited framing - enough to write a third-party client."
  - "Idempotent numbered migrations that check for column existence before ALTER TABLE."
  - "A 0600 Unix domain socket as the authentication model - correct and honest for a single-user daemon, and documented as such."
  - "MCP used as a SURFACE FOR APPROVALS, so another agent can answer a human-in-the-loop request. An inversion of the usual direction."

weakest_choices:
  - "NO RECORD OF WHICH HUMAN APPROVED. The comment captures a rationale but not an identity, so the audit trail cannot answer 'who decided this'."
  - "Single-user by construction; filesystem permissions do not generalise to multi-user."
  - "No OpenTelemetry, where four of nine deep projects have it. A typed event bus serves UIs, not tracing."
  - "No agent identity, versioning or revocation."
  - "No sandboxing - Claude Code runs with daemon privileges, with approval as the only control."
  - "Tightly coupled to one harness (Claude Code) via claudecode-go."
  - "A fresh clone fails go test ./approval/... until make mocks is run, which is discoverable only from the Makefile."
  - "No policy layer deciding WHICH calls need approval - that is delegated to the harness's permission mode."

reusable_components:
  - component: "Approval table schema + status CHECK constraint"
    decision: REUSE
    note: "The only durable approval resource found; port nearly verbatim."
  - component: "Partial index on pending approvals"
    decision: ADOPT_AS_STANDARD
    note: "The hot query stays cheap as history grows."
  - component: "ErrAlreadyDecided carrying the current status"
    decision: ADOPT_AS_STANDARD
    note: "Retried decisions must be idempotent AND informative."
  - component: "approval_id / approval_status on the transcript event"
    decision: ADOPT_AS_STANDARD
    note: "Approval state reads inline with what it governs."
  - component: "waiting_input session status"
    decision: ADOPT_AS_STANDARD
    note: "Blocked-on-human becomes an indexed query."
  - component: "interrupting -> interrupted transitional state"
    decision: ADOPT_AS_STANDARD
    note: "Confirms the CANCELLING state in our domain model; only precedent."
  - component: "draft / discarded states"
    decision: REUSE
    note: "Pre-run composition and abandonment without execution."
  - component: "Expiring permission bypass + expiry event"
    decision: ADOPT_AS_STANDARD
    note: "A safety bypass that cannot become permanent by neglect."
  - component: "dangerously_ naming"
    decision: ADOPT_AS_STANDARD
    note: "Make the unsafe path visible at the call site."
  - component: "Approve-with-comment / deny-with-reason"
    decision: ADOPT_AS_STANDARD
    note: "Rationale is as durable as the decision itself."
  - component: "ApprovalReconciler on restart, keyed by run, non-fatal"
    decision: REUSE
    note: "Correct shape for post-restart reconciliation."
  - component: "Typed event bus with filters"
    decision: REUSE
    note: "Many surfaces, one daemon, no coupling."
  - component: "Protocol documented in-repo"
    decision: REUSE
    note: "Enables third-party clients."
  - component: "Idempotent column-checked migrations"
    decision: REUSE
    note: "Re-runnable schema evolution."
  - component: "Filesystem-permission authentication"
    decision: BUILD
    note: "Reject; we are multi-user."
  - component: "Approval without an approver identity"
    decision: BUILD
    note: "Reject; audit requires the principal who decided."

lessons:
  - "APPROVAL MUST BE A RESOURCE, not a state on a Run. My strawman had it as a status; HumanLayer shows it needs its own table with id, run reference, correlated tool-call id, a constrained status, created_at/responded_at, the request payload, and a decision rationale. (amends the domain model)"
  - "The Run state machine needs four more states: DRAFT (composed, not started), WAITING_INPUT (blocked on a human, indexed), CANCELLING (interrupt received, still shutting down), DISCARDED. The interrupting/interrupted split is the important one - cancellation takes time, and a state machine that pretends otherwise reports a lie during the gap. This is the ONLY precedent for the CANCELLING state my revised domain model proposed. (confirms ADR-0002)"
  - "SHARPENS THE ADR-0007 SPLIT that ADK prompted. HumanLayer has an excellent approval RECORD and NO APPROVER IDENTITY - the comment says why, never who. So a system can have durable, idempotent, well-indexed human decisions and still fail an audit. Our Approval must reference a Principal, not just carry a note. (challenges ADR-0007)"
  - "DANGEROUS OVERRIDES SHOULD EXPIRE. dangerously_skip_permissions_expires_at plus a session_settings_changed event with reason='expired' converts a permanent hole into a temporary one and tells the operator when it closed. Every other project treats 'skip approvals' as a mode, and modes get switched on under pressure and never switched off. Adopt as a general rule: any control that disables a safety check carries a TTL and announces its lapse."
  - "Idempotency applied to the APPROVAL DECISION rather than the tool effect: ErrAlreadyDecided returns the existing status instead of re-deciding. Generalises ADR-0014 - anything a human or UI can retry needs the same guard, not only agent side effects. (confirms ADR-0014 in a new place)"
  - "An attached_harness where the DAEMON owns durability on the agent's behalf - the same split AX established (control plane owns the log, adapter streams events). (confirms ADR-0004)"
  - "The decision record is real traceability (which tool, what input, what status, when responded, why) but it does not record the RULE that required approval - so it traces the decision without the policy. That is exactly the half AG2 and Omnigent supply, and both halves are needed. (confirms ADR-0013)"
  - "No OTel at all, where four of nine deep projects have it. The typed event bus is good for UIs and useless for tracing, which confirms ADR-0010 by contrast: an event bus and a trace are not substitutes. (challenges ADR-0010 weakly)"
  - "PROCESS NOTE: GitHub's API reports this repo NOASSERTION; the LICENSE file says Apache-2.0 plainly. Phase 1 flagged and manually verified, which was correct. Licence metadata is not licence evidence - an automated scan would have excluded a project whose patterns we are now porting."

adr_impact:
  - adr: ADR-0001
    effect: neutral
    note: "No agent identity; sessions and runs only."
  - adr: ADR-0002
    effect: confirms
    note: "Nine-state session machine including draft, waiting_input, interrupting/interrupted and discarded. Only precedent for a transitional cancel state."
  - adr: ADR-0003
    effect: confirms
    note: "No agent-to-agent messaging; parent_tool_use_id gives a sub-task tree only."
  - adr: ADR-0004
    effect: confirms
    note: "attached_harness wrapping Claude Code, with the daemon owning durability - the same split as AX."
  - adr: ADR-0005
    effect: neutral
    note: "MCP exposed as a surface for answering approvals - an inversion of the usual direction."
  - adr: ADR-0006
    effect: neutral
    note: "No A2A."
  - adr: ADR-0007
    effect: challenges
    note: "Excellent approval record with NO approver identity. Durable human decisions that still fail an audit."
  - adr: ADR-0008
    effect: neutral
    note: "No memory or knowledge subsystem."
  - adr: ADR-0009
    effect: neutral
    note: "No sandbox; approval is the control instead of isolation."
  - adr: ADR-0010
    effect: challenges
    note: "No OTel at all. Confirms by contrast that an event bus and a trace are not substitutes."
  - adr: ADR-0011
    effect: neutral
    note: "No version pinning."
  - adr: ADR-0012
    effect: neutral
    note: "No capability model."
  - adr: ADR-0013
    effect: confirms
    note: "Traces the decision (tool, input, status, timing, rationale) but not the rule that required it."
  - adr: ADR-0014
    effect: confirms
    note: "Idempotency on the approval DECISION - ErrAlreadyDecided returns the existing status. Generalises the ADR to retryable human actions."

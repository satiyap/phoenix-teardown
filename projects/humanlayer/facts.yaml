    evidence: "hld/bus/types.go @ 99abe67"
  # F7: Is message ordering guaranteed? Per what scope?
  F7:
    verdict: first_class
    note: "Conversation events carry an explicit sequence, indexed on (claude_session_id, sequence) and (session_id, sequence)."
    evidence: "hld/store/sqlite.go:136,162-163 @ 99abe67"
  # F8: Acknowledgement or delivery receipts?
  F8:
    verdict: absent
    note: "No acknowledgement between agents."
    evidence: "hld/bus/types.go @ 99abe67"
  # F9: Correlation ids for request/response pairing?
  F9:
    verdict: first_class
    note: "STRONG CORRELATION: approval_id and approval_status denormalised onto the tool-call event, tool_result_for_id linking results to calls, run_id on approvals, and parent_tool_use_id for sub-task trees."
    evidence: "hld/store/sqlite.go:146-158 @ 99abe67"
  # F10: Conversation threading?
  F10:
    verdict: absent
    note: "No forking or branching of a session."
    evidence: "hld/store/sqlite.go @ 99abe67"
  # F11: Capability-based routing — address by what an agent *can do* rather than who it is?
  F11:
    verdict: absent
    note: "No capability routing."
    evidence: "hld/store/sqlite.go @ 99abe67"

  # --- G. Human-agent collaboration ---
  # G1: Is a human modelled as a special kind of agent, a distinct principal type, or not modelled?
  G1:
    verdict: implicit
    note: "The human is the daemon's owner, established by 0600 filesystem permissions on the socket - so there is an implied single principal but no principal RESOURCE, and crucially no record of WHICH human approved."
    evidence: "hld/PROTOCOL.md:7-13 @ 99abe67"
  # G2: Shared rooms, channels, or workspaces?
  G2:
    verdict: absent
    note: "No shared workspace or room; single-user by design."
    evidence: "hld/PROTOCOL.md @ 99abe67"
  # G3: Task threads humans can read and post into?
  G3:
    verdict: first_class
    note: "Multiple surfaces attach to one daemon over the socket - hlyr CLI, humanlayer-wui desktop app, MCP server - and receive filtered push events, so a human can drive and observe live from any of them."
    evidence: "hld/bus/types.go:41-60 @ 99abe67; humanlayer-wui/"
  # G4: Mentions or directed addressing?
  G4:
    verdict: absent
    note: "No addressing of participants."
    evidence: "hld/bus/types.go @ 99abe67"
  # G5: Approval gates. Blocking or advisory? Durable while pending?
  G5:
    verdict: first_class
    note: "BEST APPROVAL MECHANISM IN THE STUDY: approval.Manager with CreateApprovalWithToolUseID, GetPendingApprovals, ApproveToolCall(id, comment) and DenyToolCall(id, reason) over a durable approvals table, with new_approval and approval_resolved bus events."
    evidence: "hld/approval/types.go:10-25 @ 99abe67"
  # G6: Mid-run intervention: can a human redirect without restarting?
  G6:
    verdict: first_class
    note: "Approve with a comment, deny with a reason, interrupt a running session (with a transitional interrupting state), discard a draft, and set a time-limited permission bypass."
    evidence: "hld/approval/types.go:22-24 @ 99abe67; hld/store/store.go:282-284"
  # G7: Agent status and presence visible to humans?
  G7:
    verdict: first_class
    note: "waiting_input is a FIRST-CLASS SESSION STATUS, so 'blocked on a human' is an indexed query rather than an inference. Plus session_status_changed events and a partial index on pending approvals."
    evidence: "hld/store/store.go:281 @ 99abe67; hld/store/sqlite.go:218"
  # G8: Notifications or escalation when an agent is blocked?

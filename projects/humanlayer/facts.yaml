    evidence: "hld/store/sqlite.go @ 99abe67"
  # D6: Can agents discover each other at runtime?
  D6:
    verdict: absent
    note: "No discovery."
    evidence: "hld/store/sqlite.go @ 99abe67"
  # D7: Can agents advertise capabilities? In what format?
  D7:
    verdict: absent
    note: "No capability model."
    evidence: "hld/store/sqlite.go @ 99abe67"
  # D8: Is there an owner, team, or tenant on the agent record?
  D8:
    verdict: absent
    note: "No owner or tenant field; the daemon is single-user by construction."
    evidence: "hld/PROTOCOL.md @ 99abe67"
  # D9: Can an agent be suspended, revoked, or deprecated?
  D9:
    verdict: absent
    note: "No revocation lifecycle for agents. ELEVEN PROJECTS absent."
    evidence: "hld/store/sqlite.go @ 99abe67"
  # D10: Is there anything resembling a declarative agent manifest?
  D10:
    verdict: absent
    note: "No agent manifest."
    evidence: "hld/store/sqlite.go @ 99abe67"

  # --- E. Harness and runtime interoperability ---
  # E1: What is the minimum interface an agent implementation must satisfy?
  E1:
    verdict: implicit
    note: "claudecode-go wraps the Claude Code process, and session/claudecode_wrapper.go defines a ClaudeSession interface - a real adapter seam, but for one vendor rather than a general contract."
    evidence: "hld/session/claudecode_wrapper.go @ 99abe67"
  # E2: Transport: stdin/stdout, HTTP, gRPC, WebSocket, in-process, ACP, A2A?
  E2:
    verdict: first_class
    note: "JSON-RPC 2.0 over a Unix domain socket, line-delimited JSON, at ~/.humanlayer/daemon.sock with 0600 permissions - documented in PROTOCOL.md."
    evidence: "hld/PROTOCOL.md @ 99abe67"
  # E3: Can it host a foreign agent (Claude Code, Codex, OpenHands, LangGraph, ADK)?
  E3:
    verdict: absent
    note: "One harness: Claude Code. No pluggable agent adapters."
    evidence: "claudecode-go/ @ 99abe67"
  # E4: Is there an event stream out of a running agent? What granularity?
  E4:
    verdict: first_class
    note: "Sequence-ordered conversation events plus five typed bus events with filters on type, session and run."
    evidence: "hld/bus/types.go:9-46 @ 99abe67"
  # E5: Are tool calls externally observable, or internal to the agent?
  E5:
    verdict: first_class
    note: "Tool calls are recorded with tool_id, tool_name and tool_input_json, results with tool_result_for_id, plus is_completed and approval correlation on the same row."
    evidence: "hld/store/sqlite.go:146-158 @ 99abe67"
  # E6: How is context injected at start?
  E6:
    verdict: implicit
    note: "Session settings (permission mode, expiry) are stored columns rather than opaque adapter config."
    evidence: "hld/store/sqlite.go:117-118 @ 99abe67"
  # E7: Is cancellation supported? Cooperative or forced? Does it propagate to subagents?
  E7:
    verdict: first_class
    note: "Interrupt is first-class with a TRANSITIONAL state: interrupting ('received interrupt signal and is shutting down') then interrupted ('can be resumed'). The only project with a transitional cancel state."
    evidence: "hld/store/store.go:282-283 @ 99abe67"
  # E8: Can a run be checkpointed and restored by the platform, or only by the agent?
  E8:
    verdict: implicit
    note: "The daemon owns durability (transcript, approvals) on the agent's behalf, and interrupted sessions are resumable, but there is no checkpoint/restore API."
    evidence: "hld/store/store.go:283 @ 99abe67"
  # E9: Which of these would be hard to adapt, and why?
  E9:
    verdict: first_class
    note: "PROTOCOL.md documents transport, socket path, permissions, framing, and the JSON-RPC request/response/error formats - enough for a third-party client."
    evidence: "hld/PROTOCOL.md:1-40 @ 99abe67"

  # --- F. Agent-to-agent communication ---
  # F1: Direct messages between agents?
  F1:
    verdict: absent
    note: "No agent-to-agent messaging. AG2 remains the sole answer."
    evidence: "hld/store/sqlite.go @ 99abe67"
  # F2: Channels, topics, or pub/sub?
  F2:
    verdict: absent
    note: "The event bus is daemon-to-UI, not agent-to-agent."
    evidence: "hld/bus/types.go @ 99abe67"
  # F3: Task delegation as a distinct mechanism from messaging?
  F3:
    verdict: implicit
    note: "parent_tool_use_id tracks sub-tasks within a session; there is no delegation primitive between agents."
    evidence: "hld/store/sqlite.go:373-405 @ 99abe67"
  # F4: Synchronous RPC between agents?
  F4:
    verdict: absent
    note: "No inter-agent RPC."
    evidence: "hld/rpc/ @ 99abe67"
  # F5: Asynchronous inbox or mailbox?
  F5:
    verdict: absent
    note: "No mailbox."
    evidence: "hld/bus/types.go @ 99abe67"
  # F6: Is delivery durable? Survives restart of sender and receiver?
  F6:

schema_version: 1

project:
  slug: humanlayer
  name: HumanLayer Agent Control Plane
  depth: targeted
  evidence_class: A
  read_on: 2026-08-26
  repo: "https://github.com/humanlayer/humanlayer"
  commit: 99abe673498cf8bdcd5f989aebe9406a27185b3b
  docs: "https://humanlayer.dev/docs"
  version: "hld @ 2026-06-18 (older commit than other projects read)"
  license: Apache-2.0
  license_verdict: INTEGRATE
  runtime_class: attached_harness
  one_line: Approval and human-oversight layer for autonomous agents.
  thesis: "An approval is a durable resource with its own lifecycle, not a blocked function call - so a pending decision outlives the process that requested it, and the tool call carries its approval state inline."

probes:

  # --- A. Core abstraction and object model ---
  # A1: What does this system think an agent *is*? State it in one sentence, in their vocabulary.
  A1:
    verdict: absent
    note: "No agent resource. The agent is Claude Code, wrapped via claudecode-go; sessions and runs are the modelled units."
    evidence: "claudecode-go/ @ 99abe67"
  # A2: What is the root resource — the thing everything else hangs off?
  A2:
    verdict: first_class
    note: "Session is the durable unit with nine states, cost_usd, permission settings and an ordered conversation event stream, persisted in SQLite."
    evidence: "hld/store/sqlite.go:95-130 @ 99abe67"
  # A3: Is `Agent` persistent or ephemeral? Can it exist while not executing?
  A3:
    verdict: first_class
    note: "Sessions and approvals persist in SQLite independently of the daemon process; an ApprovalReconciler re-syncs on restart."
    evidence: "hld/session/types.go:11-13 @ 99abe67"
  # A4: Is `Task` a separate resource from `Run`? If not, which concept is missing and what fills the...
  A4:
    verdict: implicit
    note: "Sessions carry both an id and a run_id, and approvals reference run_id - so run identity is distinct from session identity, but there is no Task resource holding intent across attempts."
    evidence: "hld/store/sqlite.go:201-204 @ 99abe67"
  # A5: What is a `Session` attached to: user, agent, task, or execution?
  A5:
    verdict: first_class
    note: "Session is the session, with draft/discarded states so it can exist before running and be abandoned without running."
    evidence: "hld/store/store.go:274-284 @ 99abe67"
  # A6: Are messages first-class durable resources, or transient function arguments?
  A6:
    verdict: first_class
    note: "ConversationEvent is a sequence-ordered durable row carrying role, content, tool call fields, tool result fields, completion flag and approval correlation."
    evidence: "hld/store/sqlite.go:132-161 @ 99abe67"
  # A7: Are artifacts (files, outputs, deliverables) first-class?
  A7:
    verdict: absent
    note: "No artifact resource; there is result storage for session output but not a modelled artifact."
    evidence: "hld/store/result_storage_test.go @ 99abe67"
  # A8: Can multiple agents participate in one task? How is that represented?
  A8:
    verdict: implicit
    note: "parent_tool_use_id (migration 6, 'for sub-task tracking') gives a sub-task tree within a session, but there is no multi-agent participation model."
    evidence: "hld/store/sqlite.go:373-405 @ 99abe67"
  # A9: Draw the object model as a tree. Only nodes that exist in their code or API.
  A9:
    verdict: first_class
    note: "Session(status x9, cost_usd, dangerously_skip_permissions[+expires_at]) > ConversationEvent(tool fields, is_completed, approval_status, approval_id, parent_tool_use_id); Approval(id, run_id, session_id, status CHECK, created_at, responded_at, tool_name, tool_input, comment). See teardown section 3."
    evidence: "hld/store/sqlite.go:95-220 @ 99abe67"

  # --- B. Runtime model ---
  # B1: Does the platform launch agents, host them, or attach to external ones?
  B1:
    verdict: first_class
    note: "A long-lived Go daemon (hld) launches and supervises Claude Code sessions via claudecode-go, over a Unix domain socket."
    evidence: "hld/PROTOCOL.md @ 99abe67"
  # B2: Execution substrate: process, container, microVM, serverless, in-process library, remote HTTP?
  B2:
    verdict: implicit
    note: "Local subprocess execution of Claude Code; no container or isolate boundary."
    evidence: "claudecode-go/ @ 99abe67"
  # B3: Who owns the event loop — platform or agent?
  B3:
    verdict: implicit
    note: "Claude Code owns its own loop; the daemon supervises the session, intercepts tool approvals and records the transcript."
    evidence: "hld/session/manager.go @ 99abe67"
  # B4: Who decides when an agent wakes?
  B4:
    verdict: implicit
    note: "The daemon launches locally on request; there is no placement or scheduling layer."
    evidence: "hld/session/manager.go @ 99abe67"
  # B5: Can an agent run indefinitely? What is the actual ceiling?
  B5:
    verdict: first_class
    note: "Sessions are long-lived with last_activity_at, waiting_input for human blocks, and interrupted sessions explicitly resumable."
    evidence: "hld/store/store.go:274-284 @ 99abe67"
  # B6: Are there background or unattended agents?
  B6:
    verdict: absent
    note: "No scheduled or background execution."
    evidence: "hld/session/manager.go @ 99abe67"
  # B7: Is execution synchronous or asynchronous from the caller's view?
  B7:
    verdict: first_class
    note: "A typed event bus publishes new_approval, approval_resolved, session_status_changed, conversation_updated and session_settings_changed to filtered subscribers over channels."
    evidence: "hld/bus/types.go:9-60 @ 99abe67"
  # B8: Can in-flight work migrate between workers?
  B8:
    verdict: absent
    note: "Local single-daemon; work does not move."
    evidence: "hld/PROTOCOL.md @ 99abe67"
  # B9: Can an agent survive a machine restart? Automatically, or with operator action?
  B9:
    verdict: first_class
    note: "Interrupted sessions 'can be resumed', and ApprovalReconciler re-syncs approvals after session restart, keyed by run_id, non-fatally."
    evidence: "hld/store/store.go:283 @ 99abe67; hld/session/manager.go:512-528"
  # B10: Classify: worker/queue, durable actor, attached harness, or in-process library.
  B10:
    verdict: first_class
    note: "attached_harness: a local daemon supervising an external agent process (Claude Code) it did not author, owning durability on its behalf."
    evidence: "claudecode-go/ @ 99abe67; hld/store/sqlite.go"

  # --- C. Durability and failure semantics ---
  # C1: What state is durable, and what is lost on crash?
  C1:
    verdict: first_class
    note: "SQLite with numbered migrations, each guarded by a column-existence check before ALTER TABLE so migrations are idempotent and re-runnable."
    evidence: "hld/store/sqlite.go:373-411 @ 99abe67"
  # C2: *When* is state persisted — every step, every tool call, on checkpoint, never?
  C2:
    verdict: first_class
    note: "Conversation events are appended with a sequence number as they occur; approvals are inserted at request time with status pending."
    evidence: "hld/store/sqlite.go:132-161,201-220 @ 99abe67"
  # C3: Checkpointing or event sourcing? Can state be rebuilt from a log?
  C3:
    verdict: implicit
    note: "Append-only conversation events with sequence ordering, but session and approval rows are updated in place (status, responded_at)."
    evidence: "hld/store/sqlite.go:132-136 @ 99abe67"
  # C4: Retry semantics, and at what granularity: run, step, tool call?
  C4:
    verdict: absent
    note: "No retry or backoff policy."
    evidence: "hld/session/manager.go @ 99abe67"
  # C5: At-least-once or exactly-once? What do the docs claim versus what the code does?
  C5:
    verdict: implicit
    note: "Approval reconciliation on restart is retried implicitly (it logs and leaves the pending row for the next attempt), but there is no stated delivery guarantee."
    evidence: "hld/session/manager.go:522-528 @ 99abe67"
  # C6: Is there an idempotency model for tool side effects?
  C6:
    verdict: implicit
    note: "Not a tool-effect ledger, but the DECISION is idempotent: ErrAlreadyDecided with an AlreadyDecidedError{ID, Status} whose message names the existing status, verified by test. Generalises ADR-0014 - anything a human or UI can retry needs the same guard."
    evidence: "hld/store/errors.go:13-42 @ 99abe67; test TestApprovalErrors/UpdateApprovalResponse_AlreadyDecided; verified locally 2026-08-26: GOWORK=off go build ./... OK; make mocks then go test ./approval/... ./bus/... ./store/... -run Approval all pass"
  # C7: Process crash recovery: what resumes, and from where?
  C7:
    verdict: first_class
    note: "State is read from SQLite; ApprovalReconciler re-syncs approvals for a session on (re)start, keyed by run_id, waiting 2s for the session then logging rather than failing on error."
    evidence: "hld/session/manager.go:512-528 @ 99abe67"
  # C8: Node loss: is work re-dispatched, and how is it detected?
  C8:
    verdict: implicit
    note: "last_activity_at plus session status transitions give staleness signals, but there is no hung-session detection or reaping."
    evidence: "hld/store/sqlite.go:105 @ 99abe67"
  # C9: Context-window overflow: truncation, summarisation, or failure?
  C9:
    verdict: absent
    note: "No context-window management; that is Claude Code's concern."
    evidence: "hld/session/manager.go @ 99abe67"
  # C10: Timers, scheduled execution, long sleeps — durable across restart?
  C10:
    verdict: first_class
    note: "dangerously_skip_permissions_expires_at is a real durable timer: the bypass expires and emits session_settings_changed with reason='expired' and expired_at."
    evidence: "hld/store/sqlite.go:117-118 @ 99abe67; hld/bus/types.go:20-32"
  # C11: Human-in-the-loop pause and resume: durable, or in-memory only?
  C11:
    verdict: first_class
    note: "THE ONLY REAL APPROVAL RESOURCE IN THE STUDY. A durable approvals table with status CHECK (pending|approved|denied), created_at/responded_at, tool_name and tool_input, a comment for denial reasons or approval notes, a PARTIAL INDEX on pending rows only, correlation onto the conversation event via approval_id/approval_status, and ErrAlreadyDecided guarding double-resolution. Reconciled on session restart. Verified by running the tests."
    evidence: "hld/store/sqlite.go:201-220 @ 99abe67; hld/approval/types.go; verified locally 2026-08-26: GOWORK=off go build ./... OK; make mocks then go test ./approval/... ./bus/... ./store/... -run Approval all pass"
  # C12: Can a definition be upgraded while runs are in flight? What happens to them?
  C12:
    verdict: absent
    note: "No version pinning of any kind."
    evidence: "hld/store/sqlite.go @ 99abe67"

  # --- D. Agent identity and lifecycle ---
  # D1: Is an agent globally addressable? By what identifier?
  D1:
    verdict: absent
    note: "No agent identity; sessions and runs have ids, the agent does not."
    evidence: "hld/store/sqlite.go:95-100 @ 99abe67"
  # D2: Does identity survive process restart?
  D2:
    verdict: absent
    note: "No persisted agent identity."
    evidence: "hld/store/sqlite.go @ 99abe67"
  # D3: Is identity distinct from runtime instance?
  D3:
    verdict: absent

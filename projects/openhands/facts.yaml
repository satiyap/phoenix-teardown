object_model: |
  Backend                      (id, name, host, apiKey, kind: local|cloud)
   `-- Conversation            (UUID; the unit of work)
        |-- Event              (append-only TREE: parent_id + movable HEAD)
        |    |-- ActionEvent          (carries security_risk)
        |    |-- ObservationEvent
        |    |-- MessageEvent
        |    |-- ACPToolCallEvent
        |    |-- HookExecutionEvent   (carries blocked flag)
        |    |-- PauseEvent / InterruptEvent
        |    |-- CondensationSummaryEvent
        |    `-- ConversationStateUpdateEvent
        |-- ConversationState  (execution_status, stats, secret_registry,
        |                       confirmation_policy, agent, leaf_event_id)
        |-- Workspace          (Local | Docker | Apptainer | RemoteAPI | Cloud)
        |-- SubAgent           (delegation via nested conversation)
        `-- Secrets            (SecretRegistry, masked in output)

  AgentProfile / Manifest      (automations: requires.features, triggers)
  MCPServer                    (with OAuth flow)
  Hook                         (PreToolUse, PostToolUse, SessionStart/End, Stop)

strongest_ideas:
  - "AgentKind = 'openhands' | 'acp': the project's own agent and foreign agents are peers behind one enum. ADR-0004's thesis in production, from a team that could have privileged its own harness."
  - "Pause vs interrupt as distinct durable operations: /pause waits for the current LLM call to finish, /interrupt cancels it immediately. Both resumable."
  - "ConfirmRisky(confirm_unknown=True) with a validator forbidding threshold=UNKNOWN: fail-safe by default and impossible to misconfigure."
  - "Manifest capability assessment where 'unknown' is a distinct outcome from 'no' - and the assessment returns WHICH requirements were unmet so a refusal can explain itself."
  - "STUCK execution status: a state for 'running but not progressing'. Nearly unique in this study."
  - "SecretRegistry with output masking per output and per ACP chunk, including masking rotated secrets' previous values."
  - "Hooks that can BLOCK actions, implementable as COMMAND, PROMPT (LLM) or AGENT."
  - "Event log as a tree with a movable HEAD, making fork and history navigation first-class."
  - "Single storage chokepoint for event append, with the invariant documented where it is enforced."
  - "Apptainer support: evidence the sandbox abstraction is load-bearing rather than decorative."
  - "oasdiff REST contract checking, with code comments explaining why a field shape is preserved."

weakest_choices:
  - "Optional workspace capabilities signalled by raising NotImplementedError with NO query method. Verified: zero capability-query attributes, and LocalWorkspace.pause() silently no-ops - a false success is worse than a refusal."
  - "Thin container isolation: only --ulimit nofile, no CPU/memory/pid quota, no egress policy. Weakest link for a product whose selling point is running untrusted agent code."
  - "Security boundary depends on an LLM's risk prediction, so the enforcement point has a probabilistic input."
  - "Shared SESSION_API_KEY rather than per-agent identity, so S1 cannot be answered."
  - "No durability-timing contract (no sync/async/exit equivalent) and no conformance suite for storage backends."
  - "No definition version pinning on conversations - ADR-0011's hazard applies here too."
  - "Weak memory model: condensation only, no long-term or shared memory, and no detection of constraints lost to compaction."
  - "Two object models across two repos with no single published domain model."

reusable_components:
  - component: "AgentKind peer-adapter pattern"
    decision: REUSE
    note: "Own harness as one adapter among many; validates ADR-0004."
  - component: "ACP as adapter protocol"
    decision: ADOPT_AS_STANDARD
    note: "Working stdio protocol with real Claude Code / Codex / Gemini adapters."
  - component: "pause vs interrupt semantics"
    decision: ADOPT_AS_STANDARD
    note: "Two grades of stop, both durable and resumable."
  - component: "ConfirmRisky + confirm_unknown fail-safe"
    decision: REUSE
    note: "Approval policy that cannot be configured incoherently."
  - component: "Manifest capability assessment (unknown != no)"
    decision: REUSE
    note: "Combine with LangGraph's declared-capability detection."
  - component: "STUCK execution status"
    decision: ADOPT_AS_STANDARD
    note: "Add to our Run state machine."
  - component: "SecretRegistry output masking"
    decision: REUSE
    note: "Masks rotated secrets' previous values too."
  - component: "Blocking PreToolUse hooks"
    decision: REUSE
    note: "Interception point for the capability gateway."
  - component: "BaseWorkspace provider set"
    decision: INTEGRATE
    note: "Provider list and method surface inform our SandboxProvider."
  - component: "Workspace capability signalling via NotImplementedError"
    decision: BUILD
    note: "Reject their approach; build declared capabilities instead."
  - component: "Container isolation config"
    decision: BUILD
    note: "Insufficient; specify CPU/memory/pid quotas and egress policy ourselves."

lessons:
  - "Second successful system with no durable agent identity: an agent is a KIND plus a launch command. Two of two projects deliver value without it, so our justification must be delegation, policy and audit. S1 undefined in both is precisely that evidence. (challenges ADR-0001)"
  - "WAITING_FOR_CONFIRMATION and STUCK show the value of a rich execution state machine. The pause/interrupt split refines our CANCELLING amendment into TWO operations, not one. (confirms ADR-0002)"
  - "Delegation as nested conversation gives no delivery or ordering guarantees between agents. (confirms ADR-0003)"
  - "Strongest ADR-0004 evidence yet, plus a concrete failure mode: a plausible-looking ACP command that is not a real ACP server silently DEADLOCKS the handshake. Adapters need validation, not just configuration. (confirms ADR-0004)"
  - "MCP integrated as protocol with OAuth while policy lives in hooks, confirmation policy and risk levels - exactly the split ADR-0005 proposes. (confirms ADR-0005)"
  - "No principal model; sub-agents inherit parent credentials wholesale. (confirms ADR-0007)"
  - "Condensation-only context management shows org knowledge may be better served by versioned git-backed skills than by a memory store. (amends ADR-0008)"
  - "BaseWorkspace with five providers including Apptainer is direct precedent for SandboxProvider. Also proves the negative: optional capabilities must be DECLARED, and a no-op must never masquerade as success. (confirms ADR-0009)"
  - "OTel reachable only through a vendor SDK, and integrating it required working around non-standard context propagation. The delegate.parent_trace_id re-linking pattern is needed for subagent traces. (amends ADR-0010)"
  - "No version pinning on conversations either - two of two projects share the hazard. (confirms ADR-0011)"
  - "NEW: capability negotiation must be declarative and queryable, and an unsupported optional operation must fail explicitly rather than no-op. Proposing ADR-0012."

adr_impact:
  - adr: ADR-0001
    effect: challenges
    note: "Second system succeeding with no durable agent identity. Identity lives on the Conversation; an agent is a kind plus a launch command."
  - adr: ADR-0002
    effect: confirms
    note: "STUCK and WAITING_FOR_CONFIRMATION enrich the state machine. pause/interrupt = two grades of stop, both durable."
  - adr: ADR-0003
    effect: confirms
    note: "Sub-agent delegation has no mailbox, no ordering, no delivery guarantee."
  - adr: ADR-0004
    effect: confirms
    note: "AgentKind peer model is the strongest supporting evidence so far. Plus: adapters need validation - a wrong ACP command deadlocks silently."
  - adr: ADR-0005
    effect: confirms
    note: "MCP as protocol with OAuth; policy enforced separately via hooks and confirmation policy."
  - adr: ADR-0006
    effect: neutral
    note: "No A2A; ACP occupies the adapter role."
  - adr: ADR-0007
    effect: confirms
    note: "Shared session key, no principal model, sub-agents inherit credentials wholesale."
  - adr: ADR-0008
    effect: amends
    note: "Git-backed org skills may serve organizational knowledge better than a memory store. Condensation-only leaves agents unable to accumulate knowledge."
  - adr: ADR-0009
    effect: confirms
    note: "Five providers behind one ABC is direct precedent. Negative lesson: NotImplementedError signalling plus a silent local no-op is the wrong contract."
  - adr: ADR-0010
    effect: amends
    note: "OTel only via vendor SDK, requiring workarounds for non-standard context propagation. Subagent traces need explicit parent re-linking."
  - adr: ADR-0011
    effect: confirms
    note: "No version pin on conversations; same silent-resume hazard."

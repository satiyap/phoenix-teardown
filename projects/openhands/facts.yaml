    evidence: "openhands-agent-server/openhands/agent_server/conversation_router.py @ 760eea2"
  # C5: At-least-once or exactly-once? What do the docs claim versus what the code does?
  C5:
    verdict: unknown
    note: "No documented delivery semantics for tool execution replay."
    evidence: "openhands-sdk/openhands/sdk/conversation/state.py @ 760eea2"
  # C6: Is there an idempotency model for tool side effects?
  C6:
    verdict: absent
    note: "No idempotency key on tool calls or actions."
    evidence: "src/types/agent-server/core/events/action-event.ts @ f48eca6"
  # C7: Process crash recovery: what resumes, and from where?
  C7:
    verdict: implicit

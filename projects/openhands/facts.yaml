  repo: "https://github.com/OpenHands/OpenHands + https://github.com/OpenHands/software-agent-sdk"
  commit: "Canvas f48eca6ab9149b3aa532e86842c85da43e370108 / SDK 760eea2845509ceb446db11f73ca5aa666bd01bb"
  docs: "https://docs.all-hands.dev"

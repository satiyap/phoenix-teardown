  runtime_class: attached_harness
  one_line: "Agent Canvas: self-hosted developer control center running OpenHands, Claude Code, Codex, Gemini or any ACP-compatible agent across local, remote and cloud backends."
  thesis: "The control plane owns the workspace, the event log and the policy; the agent is a replaceable subprocess speaking a standard protocol. AgentKind = openhands | acp makes the native agent a peer of every foreign agent."

probes:

  # --- A. Core abstraction and object model ---
  # A1: What does this system think an agent *is*? State it in one sentence, in their vocabulary.
  A1:
    verdict: first_class
    note: "An agent is a KIND plus a launch command, not a resource. AgentKind = 'openhands' | 'acp': the native agent and foreign ACP agents are peers behind one enum."
    evidence: "src/types/settings.ts:110 @ f48eca6"
  # A2: What is the root resource — the thing everything else hangs off?
  A2:
    verdict: first_class
    note: "Backend is the root (id, name, host, apiKey, kind: local|cloud); Conversation is the unit of work."
    evidence: "src/api/backend-registry/types.ts:4 @ f48eca6"
  # A3: Is `Agent` persistent or ephemeral? Can it exist while not executing?
  A3:
    verdict: absent
    note: "No Agent resource with durable identity. AgentProfile is configuration, like LangGraph's Assistant."
    evidence: "openhands-agent-server/openhands/agent_server/agent_profiles_router.py @ 760eea2"
  # A4: Is `Task` a separate resource from `Run`? If not, which concept is missing and what fills the...
  A4:
    verdict: absent
    note: "No Task/Run split. Conversation is the durable unit; a 'run' is POST /{id}/run against it."
    evidence: "openhands-agent-server/openhands/agent_server/conversation_router.py:284 @ 760eea2"
  # A5: What is a `Session` attached to: user, agent, task, or execution?
  A5:
    verdict: first_class
    note: "Conversation is the session, identified by UUID, owning state, events, workspace and secrets."
    evidence: "openhands-sdk/openhands/sdk/conversation/state.py @ 760eea2"
  # A6: Are messages first-class durable resources, or transient function arguments?
  A6:
    verdict: first_class
    note: "MessageEvent is a durable node in the append-only event tree, addressable by EventID with parent_id."
    evidence: "openhands-sdk/openhands/sdk/conversation/state.py:315 @ 760eea2"
  # A7: Are artifacts (files, outputs, deliverables) first-class?
  A7:
    verdict: implicit
    note: "No Artifact resource. Outputs are files in the workspace plus git_changes/git_diff on BaseWorkspace."
    evidence: "openhands-sdk/openhands/sdk/workspace/base.py:234 @ 760eea2"
  # A8: Can multiple agents participate in one task? How is that represented?
  A8:
    verdict: implicit
    note: "Sub-agents via sub_agents_router create nested conversations; not modelled as co-participants in one task."
    evidence: "openhands-agent-server/openhands/agent_server/sub_agents_router.py:117 @ 760eea2"
  # A9: Draw the object model as a tree. Only nodes that exist in their code or API.
  A9:
    verdict: first_class
    note: "Backend > Conversation > {Event tree, ConversationState, Workspace, SubAgent, Secrets}. See teardown section 3."
    evidence: "openhands-sdk/openhands/sdk/conversation/state.py @ 760eea2"


    evidence: "openhands-sdk/openhands/sdk/conversation/state.py:341 @ 760eea2"
  # C8: Node loss: is work re-dispatched, and how is it detected?
  C8:
    verdict: implicit
    note: "Canvas polls backend health (use-backends-health) so an unreachable backend is detected; no run re-dispatch."
    evidence: "src/hooks/query/use-backends-health.ts:188 @ f48eca6"
  # C9: Context-window overflow: truncation, summarisation, or failure?
  C9:
    verdict: first_class
    note: "Condensation: a configurable condenser compresses history and emits CondensationSummaryEvent."
    evidence: "openhands-sdk/openhands/sdk/event/ @ 760eea2"
  # C10: Timers, scheduled execution, long sleeps — durable across restart?
  C10:
    verdict: first_class
    note: "Automations support scheduled triggers; goal loops carry lifecycle status."
    evidence: "README.md @ f48eca6"
  # C11: Human-in-the-loop pause and resume: durable, or in-memory only?
  C11:
    verdict: first_class
    note: "WAITING_FOR_CONFIRMATION is a first-class execution state, and pause/interrupt both land in resumable 'paused'."
    evidence: "src/types/agent-server/core/base/common.ts:71 @ f48eca6"
  # C12: Can a definition be upgraded while runs are in flight? What happens to them?
  C12:
    verdict: absent

  # B10: Classify: worker/queue, durable actor, attached harness, or in-process library.
  B10:
    verdict: first_class
    note: "attached_harness: launches and adapts external agent processes over ACP, inside a pluggable sandbox."
    evidence: "src/types/settings.ts:110 @ f48eca6"

  # --- C. Durability and failure semantics ---
  # C1: What state is durable, and what is lost on crash?
  C1:
    verdict: first_class
    note: "Durable: the append-only Event tree plus ConversationState (execution_status, stats, secret_registry, confirmation_policy, agent, leaf_event_id)."
    evidence: "openhands-sdk/openhands/sdk/conversation/state.py:170-200 @ 760eea2"
  # C2: *When* is state persisted — every step, every tool call, on checkpoint, never?
  C2:
    verdict: implicit
    note: "Events persist on append via a single chokepoint, but there is NO declared persistence-timing contract (no sync/async/exit equivalent)."
    evidence: "openhands-sdk/openhands/sdk/conversation/state.py:315 @ 760eea2"
  # C3: Checkpointing or event sourcing? Can state be rebuilt from a log?
  C3:
    verdict: first_class
    note: "Event sourcing with a branching TREE: parent_id stamping plus a movable HEAD (leaf_event_id). Moving HEAD re-roots the active branch, so fork and history navigation are first-class."
    evidence: "openhands-sdk/openhands/sdk/conversation/state.py:175,315 @ 760eea2"
  # C4: Retry semantics, and at what granularity: run, step, tool call?
  C4:
    verdict: absent

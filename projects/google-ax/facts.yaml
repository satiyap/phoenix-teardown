    evidence: "proto/ax.proto @ b777313"
  # I5: Are tools versioned?
  I5:
    verdict: absent
    note: "No tool versioning."
    evidence: "proto/ax.proto @ b777313"
  # I6: How are credentials supplied to a tool?
  I6:
    verdict: implicit
    note: "Credentials are the harness's concern; AX supports GCP credentials for its own OTLP export."
    evidence: "internal/telemetry/telemetry.go:38 @ b777313"
  # I7: OAuth or delegated user credentials?
  I7:
    verdict: absent
    note: "No OAuth or delegated credentials."
    evidence: "internal/server/server.go @ b777313"
  # I8: Can policy intercept a tool call before execution?
  I8:
    verdict: absent
    note: "NO POLICY LAYER AT ALL. Nothing intercepts a tool call."
    evidence: "internal/server/server.go:82-83 @ b777313"
  # I9: Approval gates on specific tools?
  I9:
    verdict: implicit
    note: "ConfirmationContent enables per-action approval, but there is no rule-based gate deciding WHEN to ask - the harness decides."
    evidence: "proto/content.proto:38-47 @ b777313"
  # I10: Do tools execute inside or outside the agent's sandbox?
  I10:
    verdict: first_class
    note: "Tools execute inside the substrate actor sandbox, since the whole harness runs there."
    evidence: "internal/harness/substrate/substrate.go:50 @ b777313"

  # --- J. Security and identity ---
  # J1: What identity does an agent authenticate as?

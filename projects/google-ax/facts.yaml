# Machine-readable extraction. Schema: schema/facts.schema.yaml
# Validate:  ./.venv/bin/python tools/validate_facts.py
#
# verdict:   first_class | implicit | absent | unknown
# scenarios: first_class_answer | inferable | undefined | unknown
# evidence:  'path/file.py:120 @ sha'  or  'URL (read YYYY-MM-DD)'

schema_version: 1

project:
  slug: google-ax
  name: Google AX
  depth: deep
  evidence_class: A
  read_on: 2026-08-26
  repo: "https://github.com/google/ax"
  commit: b77731302075b3630b200af5e2cf63ac93b5f315
  docs: "https://agentexecutor.io"
  version: "v1alpha (pre-1.0, breaking changes declared)"
  license: Apache-2.0
  license_verdict: REFERENCE_ONLY
  runtime_class: durable_actor
  one_line: Distributed harness runtime that provisions isolated, suspendable/resumable environments to execute harnesses and agents.
  thesis: "Separate the single-writer orchestrator from disposable suspendable actors, and make the append-only event log the only source of truth: state is derived by replaying the log, never stored separately."

probes:

  # --- A. Core abstraction and object model ---
  # A1: What does this system think an agent *is*? State it in one sentence, in their vocabulary.
  A1:
    verdict: first_class
    note: "A harness is a registered executor of agentic loops. AX itself thinks in CONVERSATIONS, not agents: the durable identity is conversation_id and agent_id names which harness served it."
    evidence: "proto/ax.proto:27-37 @ b777313"
  # A2: What is the root resource — the thing everything else hangs off?
  A2:
    verdict: first_class
    note: "Conversation is the root and the durable unit. 'A conversation cannot be continued before the last execution is completed or failed.'"
    evidence: "proto/ax.proto:27-29 @ b777313"
  # A3: Is `Agent` persistent or ephemeral? Can it exist while not executing?
  A3:
    verdict: implicit
    note: "Actors persist suspended between turns keyed by conversation_id, so execution capacity exists while idle. But there is no Agent resource to persist."
    evidence: "internal/harness/substrate/substrate.go:92-99 @ b777313"
  # A4: Is `Task` a separate resource from `Run`? If not, which concept is missing and what fills the...
  A4:
    verdict: implicit
    note: "CLOSEST YET: Conversation > Interaction, and Interaction has its own id and terminal state. But it is an execution not an intent, and a TODO admits 'CreateInteraction should return an Interaction message and the outputs should be polled from the Interaction'."
    evidence: "proto/ax.proto:111-131 @ b777313"
  # A5: What is a `Session` attached to: user, agent, task, or execution?
  A5:
    verdict: first_class
    note: "Conversation is the session; Interaction is one execution within it."
    evidence: "proto/ax.proto:30-37 @ b777313"
  # A6: Are messages first-class durable resources, or transient function arguments?
  A6:
    verdict: implicit
    note: "Steps (including text content) are durable log entries, but there is no Message resource and no addressing."
    evidence: "proto/ax.proto:134-210 @ b777313"
  # A7: Are artifacts (files, outputs, deliverables) first-class?
  A7:
    verdict: absent
    note: "No artifact concept. Outputs are Steps in the log."
    evidence: "proto/ax.proto:59-61 @ b777313"
  # A8: Can multiple agents participate in one task? How is that represented?
  A8:
    verdict: absent
    note: "One conversation, one in-flight execution, one harness. No multi-agent participation and no subagents at all."
    evidence: "proto/ax.proto:27-29 @ b777313"
  # A9: Draw the object model as a tree. Only nodes that exist in their code or API.
  A9:
    verdict: first_class
    note: "Conversation > Interaction > Step (Content|Thought|ToolCall|ToolResult|FunctionCall|FunctionResult). StepEvent is the log entry. Harness > Execution. Actor keyed by conversation. See teardown section 3."
    evidence: "proto/ax.proto @ b777313"

  # --- B. Runtime model ---
  # B1: Does the platform launch agents, host them, or attach to external ones?
  B1:
    verdict: first_class
    note: "Launches AND resumes: CreateActor then ResumeActor schedules the actor onto a worker and returns a routable IP."
    evidence: "internal/harness/substrate/substrate.go:86-110 @ b777313"
  # B2: Execution substrate: process, container, microVM, serverless, in-process library, remote HTTP?
  B2:
    verdict: first_class
    note: "Suspendable/resumable actors in an external actor system (SubstrATE), reached over gRPC. Also a Python sidecar for Python harnesses."
    evidence: "internal/harness/substrate/substrate.go:50 @ b777313"
  # B3: Who owns the event loop — platform or agent?
  B3:
    verdict: first_class
    note: "The controller owns the loop and is explicitly 'a single-writer system for managing agentic loops'."
    evidence: "internal/controller/controller.go:15,33 @ b777313"
  # B4: Who decides when an agent wakes?
  B4:
    verdict: first_class
    note: "Control plane decides: CreateInteraction starts or resumes; the actor is resumed onto a worker on demand."
    evidence: "internal/controller/controller.go:64-66 @ b777313"
  # B5: Can an agent run indefinitely? What is the actual ceiling?
  B5:
    verdict: implicit
    note: "Bounded per interaction; a conversation persists indefinitely as a suspended actor plus its log. No documented ceiling."
    evidence: "internal/harness/substrate/substrate.go:92 @ b777313"
  # B6: Are there background or unattended agents?
  B6:
    verdict: absent
    note: "No background or scheduled execution; no cron."
    evidence: "internal/controller/controller.go @ b777313"
  # B7: Is execution synchronous or asynchronous from the caller's view?
  B7:
    verdict: first_class
    note: "Streaming: CreateInteraction returns a stream; the harness contract is a bidirectional stream."
    evidence: "proto/ax.proto:125-128 @ b777313"
  # B8: Can in-flight work migrate between workers?
  B8:
    verdict: first_class
    note: "Yes - the actor is suspended between turns and resumed onto ANY worker, getting a fresh routable IP each time. Work is not pinned to a machine."
    evidence: "internal/harness/substrate/substrate.go:98-109 @ b777313"
  # B9: Can an agent survive a machine restart? Automatically, or with operator action?
  B9:
    verdict: first_class
    note: "Replaying the append-only log 'brings the executor back to a consistent state from which execution can resume'."
    evidence: "internal/controller/eventlog/eventlog.go:28-30 @ b777313"
  # B10: Classify: worker/queue, durable actor, attached harness, or in-process library.
  B10:
    verdict: first_class
    note: "durable_actor driven by a single-writer control plane: durable identity (conversation), disposable compute (resumable actor on any worker)."
    evidence: "internal/controller/controller.go:15 @ b777313"

  # --- C. Durability and failure semantics ---
  # C1: What state is durable, and what is lost on crash?
  C1:
    verdict: first_class
    note: "The event log is the only durable state: conversation_id, step, protojson StepEvent payload. Everything else is derived."
    evidence: "internal/controller/eventlog/postgres.go:44-50 @ b777313"
  # C2: *When* is state persisted — every step, every tool call, on checkpoint, never?
  C2:
    verdict: first_class
    note: "Every step is appended atomically as it happens - inputs are logged before the harness runs."
    evidence: "internal/controller/controller.go:243-264 @ b777313"
  # C3: Checkpointing or event sourcing? Can state be rebuilt from a log?
  C3:
    verdict: first_class
    note: "Event sourcing, explicitly: 'Every entry is an atomic step: replaying the log in order brings the executor back to a consistent state from which execution can resume.'"
    evidence: "internal/controller/eventlog/eventlog.go:28-30 @ b777313"
  # C4: Retry semantics, and at what granularity: run, step, tool call?
  C4:
    verdict: absent
    note: "No declarative retry or backoff policy."
    evidence: "internal/controller/controller.go @ b777313"
  # C5: At-least-once or exactly-once? What do the docs claim versus what the code does?
  C5:
    verdict: implicit
    note: "At-least-once in effect: a PENDING execution is resumed by re-Starting the harness. No exactly-once claim and no dedupe for tool effects."
    evidence: "internal/controller/controller.go:109-121 @ b777313"
  # C6: Is there an idempotency model for tool side effects?
  C6:
    verdict: absent
    note: "No idempotency key for tool side effects. Actor CREATION is idempotent, but tool calls are not. Four for four absent."
    evidence: "internal/harness/substrate/substrate.go:92-95 @ b777313"
  # C7: Process crash recovery: what resumes, and from where?
  C7:
    verdict: first_class
    note: "ResumptionState folds the event log to recover both state and harness id. No separate state store to drift from the log."
    evidence: "internal/controller/controller.go:224-241 @ b777313"
  # C8: Node loss: is work re-dispatched, and how is it detected?
  C8:
    verdict: implicit
    note: "waitForHealthy uses the standard gRPC health protocol with a timeout to detect an actor that is not ready; Unavailable and NOT_SERVING are retried."
    evidence: "internal/harness/substrate/substrate.go:135-169 @ b777313"
  # C9: Context-window overflow: truncation, summarisation, or failure?
  C9:
    verdict: absent
    note: "No context-window management; entirely the harness's concern."
    evidence: "internal/harness/harness.go @ b777313"
  # C10: Timers, scheduled execution, long sleeps — durable across restart?
  C10:
    verdict: absent
    note: "No timers, scheduling or sleeps."
    evidence: "internal/controller/controller.go @ b777313"
  # C11: Human-in-the-loop pause and resume: durable, or in-memory only?
  C11:
    verdict: first_class
    note: "BEST DESIGN IN STUDY: approvals are wire-protocol CONTENT (ConfirmationContent with a stable id, question, and oneof decision), so a pending approval is durable because the log is durable. No separate approval store, and full replayability."
    evidence: "proto/content.proto:28-47 @ b777313"
  # C12: Can a definition be upgraded while runs are in flight? What happens to them?
  C12:
    verdict: first_class
    note: "VERIFIED: resuming with a different harness is REJECTED - 'resumption not allowed: harness ID changed from harness-a to harness-b'. Only project in the study that fails loudly. Pins harness IDENTITY, not version."
    evidence: "internal/controller/controller.go:82-85 @ b777313; test TestExec_ResumeExplicitDifferentHarnessRejected; verified locally 2026-08-26: go build ./... and go test ./internal/controller/... pass"

  # --- D. Agent identity and lifecycle ---
  # D1: Is an agent globally addressable? By what identifier?
  D1:
    verdict: implicit
    note: "Harnesses have stable registry ids and conversations have durable ids, but there is no Agent identity distinct from harness id."
    evidence: "internal/controller/registry.go:38-51 @ b777313"
  # D2: Does identity survive process restart?
  D2:
    verdict: absent
    note: "The registry is IN-MEMORY, rebuilt from YAML at startup. Nothing about harness identity is persisted."
    evidence: "internal/controller/registry.go:25-36 @ b777313"
  # D3: Is identity distinct from runtime instance?
  D3:
    verdict: implicit
    note: "Harness id (registration) is distinct from execution id (uuid per execution), but agent and harness are conflated - acknowledged by TODO: 'We need to consolidate agents and harness registration.'"
    evidence: "internal/controller/controller.go:74-76 @ b777313"
  # D4: Are agents versioned? Immutable or mutable definitions?
  D4:
    verdict: absent
    note: "No versioning of harnesses or agents. Four for four absent."
    evidence: "internal/controller/registry.go @ b777313"
  # D5: Is there a registry or catalog?
  D5:
    verdict: implicit
    note: "In-memory Registry keyed by harness id with a default, populated declaratively from YAML. Registration is immutable ('harness %q already registered') but not persisted or discoverable."
    evidence: "internal/controller/registry.go:38-51 @ b777313; internal/config/config.go:97-102"
  # D6: Can agents discover each other at runtime?
  D6:
    verdict: absent
    note: "No runtime discovery."
    evidence: "internal/controller/registry.go @ b777313"
  # D7: Can agents advertise capabilities? In what format?
  D7:
    verdict: absent
    note: "No capability advertisement. Optional behaviour is probed (health) and absence is treated as OK."
    evidence: "internal/harness/substrate/substrate.go:135-138 @ b777313"
  # D8: Is there an owner, team, or tenant on the agent record?
  D8:
    verdict: absent
    note: "No owner, team or tenant on any resource."
    evidence: "proto/ax.proto @ b777313"
  # D9: Can an agent be suspended, revoked, or deprecated?
  D9:
    verdict: absent
    note: "No suspend, revoke or deprecate. Four for four absent."
    evidence: "internal/controller/registry.go @ b777313"
  # D10: Is there anything resembling a declarative agent manifest?
  D10:
    verdict: implicit
    note: "Harnesses are declared in YAML config (registry.antigravity / antigravity-interactions / substrate[]), which is a declarative registration but not an agent manifest. manifests/ is Kubernetes deployment, not agent spec."
    evidence: "internal/config/config.go:97-102 @ b777313"

  # --- E. Harness and runtime interoperability ---
  # E1: What is the minimum interface an agent implementation must satisfy?
  E1:
    verdict: first_class
    note: "SMALLEST AND CLEANEST IN STUDY: Harness{Start(ctx, conversationID, config) -> Execution} and Execution{Run, Queue, ID, Close}. Four methods. Durability is held by the CONTROLLER, not the adapter."
    evidence: "internal/harness/harness.go:42-63 @ b777313"
  # E2: Transport: stdin/stdout, HTTP, gRPC, WebSocket, in-process, ACP, A2A?
  E2:
    verdict: first_class
    note: "gRPC bidirectional streaming (HarnessService.Connect). Answers OQ-012: a remote harness needs NO co-location, unlike ACP-over-stdio."
    evidence: "proto/ax.proto:85-91 @ b777313"
  # E3: Can it host a foreign agent (Claude Code, Codex, OpenHands, LangGraph, ADK)?
  E3:
    verdict: first_class
    note: "Built-in Antigravity and Antigravity-Interactions harnesses plus user-supplied harnesses on substrate with their own ActorTemplate and container image."
    evidence: "internal/config/config.go:90-102 @ b777313"
  # E4: Is there an event stream out of a running agent? What granularity?
  E4:
    verdict: first_class
    note: "Typed step stream: HarnessOutputs frames of Steps, terminated by exactly one HarnessEnd carrying terminal State and optional Error."
    evidence: "proto/ax.proto:59-91 @ b777313"
  # E5: Are tool calls externally observable, or internal to the agent?
  E5:
    verdict: first_class
    note: "ToolCallStep, ToolResultStep, FunctionCallStep, FunctionResultStep are all first-class step types in the log."
    evidence: "proto/ax.proto:165-211 @ b777313"
  # E6: How is context injected at start?
  E6:
    verdict: first_class
    note: "agent_config is deliberately opaque bytes: 'opaque to the controller and interpreted by the harness implementation'. Keeps the boundary clean."
    evidence: "internal/harness/harness.go:43-46 @ b777313"
  # E7: Is cancellation supported? Cooperative or forced? Does it propagate to subagents?
  E7:
    verdict: first_class
    note: "HarnessCancel mid-stream with a TYPED reason: USER_REQUESTED | TIMEOUT | INTERNAL_ERROR. No other project types the cancellation reason."
    evidence: "proto/ax.proto:46-48,103-109 @ b777313"
  # E8: Can a run be checkpointed and restored by the platform, or only by the agent?
  E8:
    verdict: first_class
    note: "The CONTROL PLANE owns durability via the event log; the adapter has no checkpoint/restore methods at all. Important design lesson for our adapter interface."
    evidence: "internal/harness/harness.go:42-63 @ b777313"
  # E9: Which of these would be hard to adapt, and why?
  E9:
    verdict: first_class
    note: "Precisely specified contract makes adapters implementable: 'the server streams zero or more HarnessResponse{outputs} frames terminated by exactly one HarnessResponse{end}'."
    evidence: "proto/ax.proto:86-90 @ b777313"

  # --- F. Agent-to-agent communication ---
  # F1: Direct messages between agents?
  F1:
    verdict: absent
    note: "No agent-to-agent messaging. Four for four absent."
    evidence: "proto/ax.proto @ b777313"
  # F2: Channels, topics, or pub/sub?
  F2:
    verdict: absent
    note: "No channels or pub/sub."
    evidence: "proto/ax.proto @ b777313"
  # F3: Task delegation as a distinct mechanism from messaging?
  F3:
    verdict: absent
    note: "No delegation primitive and no subagents at all - notable, since all three anchors had them."
    evidence: "proto/ax.proto @ b777313"
  # F4: Synchronous RPC between agents?
  F4:
    verdict: absent
    note: "No inter-agent RPC."
    evidence: "proto/ax.proto @ b777313"
  # F5: Asynchronous inbox or mailbox?
  F5:
    verdict: absent
    note: "No mailbox."
    evidence: "proto/ax.proto @ b777313"
  # F6: Is delivery durable? Survives restart of sender and receiver?
  F6:
    verdict: absent
    note: "No inter-agent delivery layer."
    evidence: "proto/ax.proto @ b777313"
  # F7: Is message ordering guaranteed? Per what scope?
  F7:
    verdict: first_class
    note: "Total ordering within a conversation, enforced by PRIMARY KEY (conversation_id, step) with the step computed in-transaction."
    evidence: "internal/controller/eventlog/sql.go:46-57 @ b777313"
  # F8: Acknowledgement or delivery receipts?
  F8:
    verdict: absent
    note: "No acknowledgement between agents."
    evidence: "proto/ax.proto @ b777313"
  # F9: Correlation ids for request/response pairing?
  F9:
    verdict: first_class
    note: "conversation_id plus interaction_id on every StepEvent correlate all work; ConfirmationContent carries its own id linking question to decision."
    evidence: "proto/ax.proto:30-37 @ b777313; proto/content.proto:41"
  # F10: Conversation threading?
  F10:
    verdict: implicit
    note: "Conversation is the thread; no branching or forking."
    evidence: "proto/ax.proto:27-29 @ b777313"
  # F11: Capability-based routing — address by what an agent *can do* rather than who it is?
  F11:
    verdict: absent
    note: "No capability routing."
    evidence: "internal/controller/registry.go @ b777313"

  # --- G. Human-agent collaboration ---
  # G1: Is a human modelled as a special kind of agent, a distinct principal type, or not modelled?
  G1:
    verdict: absent
    note: "No principals of any kind - no humans, no agents, no auth."
    evidence: "internal/server/server.go:82-83 @ b777313"
  # G2: Shared rooms, channels, or workspaces?
  G2:
    verdict: absent
    note: "No workspace or room concept."
    evidence: "proto/ax.proto @ b777313"
  # G3: Task threads humans can read and post into?
  G3:
    verdict: implicit
    note: "A conversation is readable via its event log and resumable with new inputs."
    evidence: "proto/ax.proto:126-127 @ b777313"
  # G4: Mentions or directed addressing?
  G4:
    verdict: absent
    note: "No mentions or addressing."
    evidence: "proto/ax.proto @ b777313"
  # G5: Approval gates. Blocking or advisory? Durable while pending?
  G5:
    verdict: first_class
    note: "ConfirmationContent(id, question, oneof{ApprovalDecision|DeclineDecision}) as durable protocol content. Question and answer are the SAME object in the log - cleaner than all three anchors."
    evidence: "proto/content.proto:28-47 @ b777313"
  # G6: Mid-run intervention: can a human redirect without restarting?
  G6:
    verdict: first_class
    note: "Resume with new inputs at any point; cancel mid-stream with a reason."
    evidence: "proto/ax.proto:46-48,126-127 @ b777313"
  # G7: Agent status and presence visible to humans?
  G7:
    verdict: implicit
    note: "State on StepEvent (PENDING/COMPLETED/FAILED/CANCELED) is visible, but there is no WAITING_FOR_HUMAN or STUCK state."
    evidence: "proto/ax.proto:94-101 @ b777313"
  # G8: Notifications or escalation when an agent is blocked?
  G8:
    verdict: absent
    note: "No notification or escalation."
    evidence: "proto/ax.proto @ b777313"
  # G9: Shared scratchpad or working surface?
  G9:
    verdict: absent
    note: "No shared scratchpad."
    evidence: "proto/ax.proto @ b777313"
  # G10: Can a human see the context an agent is operating on?
  G10:
    verdict: first_class
    note: "The full event log is retrievable, so a human can see every step the agent took."
    evidence: "internal/controller/eventlog/eventlog.go:35 @ b777313"

  # --- H. Context and memory ---
  # H1: Which of these exist as *separate* concepts: prompt context, working state, session history, ...
  H1:
    verdict: absent
    note: "No memory subsystem at all. Context is harness-internal plus per-execution agent_config. Skills are the only knowledge mechanism."
    evidence: "internal/skills/ @ b777313"
  # H2: Who owns memory: agent, human, workspace, task, or tenant?
  H2:
    verdict: implicit
    note: "Skills are owned by a registry (Gemini Enterprise) or a local directory, explicitly harness-agnostic."
    evidence: "internal/config/config.go:119-133 @ b777313"
  # H3: Can memory be shared between agents? At what granularity?
  H3:
    verdict: implicit
    note: "Skills are shared by construction - a registry or directory feeding any harness."
    evidence: "internal/config/config.go:119-133 @ b777313"
  # H4: Are there permissions on memory?
  H4:
    verdict: absent
    note: "No memory permissions (no memory)."
    evidence: "internal/skills/ @ b777313"
  # H5: Is provenance tracked — where a memory came from?
  H5:
    verdict: implicit
    note: "Skill provenance is the registry or directory it came from; no per-item provenance."
    evidence: "internal/config/config.go:119-133 @ b777313"
  # H6: Expiry, TTL, or forgetting?
  H6:
    verdict: absent
    note: "No TTL or expiry."
    evidence: "internal/skills/ @ b777313"
  # H7: Summarisation or compaction. Automatic or explicit?
  H7:
    verdict: absent
    note: "No summarisation or compaction in AX."
    evidence: "internal/harness/harness.go @ b777313"
  # H8: Retrieval mechanism: vector, keyword, structured, agent-driven?
  H8:
    verdict: implicit
    note: "Skills materialise as <skill-id>/SKILL.md directories fed to a harness system-instruction pointer. Filesystem retrieval, no vector store."
    evidence: "internal/config/config.go:124-129 @ b777313"
  # H9: Can an agent mutate its own memory mid-run?
  H9:
    verdict: absent
    note: "No agent-writable memory."
    evidence: "internal/skills/ @ b777313"
  # H10: Conflict resolution on concurrent writes?
  H10:
    verdict: absent
    note: "No shared mutable memory."
    evidence: "internal/skills/ @ b777313"
  # H11: Is memory in the same store as execution state, or separate?
  H11:
    verdict: first_class
    note: "Execution state (event log, SQL) and knowledge (skills, filesystem/registry) are entirely separate stores. THIRD project to choose filesystem/git-backed skills over a memory store."
    evidence: "internal/skills/ @ b777313; internal/controller/eventlog/ @ b777313"

  # --- I. Tools and capabilities ---
  # I1: Are tools bound to agents statically, or resolved dynamically?
  I1:
    verdict: absent
    note: "Tools are entirely the harness's business; AX only observes ToolCall/ToolResult steps in the log."
    evidence: "proto/ax.proto:165-211 @ b777313"
  # I2: Is there a capability abstraction distinct from tool implementation?
  I2:
    verdict: absent
    note: "No capability abstraction."
    evidence: "proto/ax.proto @ b777313"
  # I3: Is there a registry of available tools?
  I3:
    verdict: absent
    note: "No tool registry (the Registry is for harnesses)."
    evidence: "internal/controller/registry.go @ b777313"
  # I4: Tool scoping — can an agent be restricted to a subset?
  I4:
    verdict: absent

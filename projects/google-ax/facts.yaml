object_model: |
  Conversation                  (conversation_id; the durable unit)
   `-- Interaction              (interaction_id; one execution)
        `-- Step                (the atomic unit; typed)
             |-- ContentStep         (text, image, audio, document, video,
             |                        ConfirmationContent)
             |-- ThoughtStep
             |-- ToolCallStep / ToolResultStep
             `-- FunctionCallStep / FunctionResultStep

  StepEvent                     (log entry: conversation_id, interaction_id,
                                 agent_id, agent_config, steps[], state)

  Harness                       (registered by id; one may be default)
   `-- Execution                (Run, Queue, ID, Close)

  Actor                         (substrate; keyed by conversation_id, suspendable)
  Skill                         (from registry or local dir; harness-agnostic)

strongest_ideas:
  - "State DERIVED by folding the event log, never stored separately. ResumptionState recomputes both state and harness id from the log, eliminating log/state drift as a class of bug."
  - "Single-writer enforced by a composite primary key, with the step number computed as MAX+1 inside the insert transaction. Ordering safety with no distributed lock."
  - "A three-method durability interface (Append, Events, Close) - the smallest durable-execution contract in the study, and sufficient."
  - "Approvals as wire-protocol CONTENT: ConfirmationContent(id, question, oneof decision). Question and answer are one durable object in the log, so no separate approval store and full replayability."
  - "Refusing to resume across a harness change, verified by test. The only project that fails loudly where ADR-0011 says it must."
  - "Cancellation with a typed reason (USER_REQUESTED | TIMEOUT | INTERNAL_ERROR)."
  - "A precisely specified stream contract: 'zero or more outputs frames terminated by exactly one end', stated in the service comment so adapters are implementable without guesswork."
  - "agent_config as opaque bytes - the control plane deliberately refuses to parse adapter config."
  - "Explicit northbound/southbound API separation in one 235-line proto."
  - "gRPC as the adapter transport, so remote harnesses work without co-location."
  - "Idempotent actor creation with the reasoning stated in a comment."
  - "OpenTelemetry by default, instrumenting both storage and adapters."
  - "Harness-agnostic skills sourced from a registry or local directories."

weakest_choices:
  - "NO authentication or authorization whatsoever - logging-only gRPC interceptors on a service that provisions sandboxes and runs arbitrary harnesses."
  - "In-memory harness registry with no versioning and no persistence; restart loses registrations."
  - "Agent and harness are conflated, acknowledged by a TODO."
  - "No multi-agent anything: no subagents, no delegation, no messaging."
  - "No memory or context management at all."
  - "No policy layer, so no interception, no rule-based approval gating, no audit beyond the raw log."
  - "Fail-OPEN on capability absence (a harness lacking the health service is 'treated as ready') - the opposite of Letta's rule, with no framework distinguishing the two cases."
  - "Interaction is not yet a first-class resource, acknowledged by TODO, so the Task/Run gap remains open."
  - "Pre-1.0 with declared breaking changes and paused external PRs, so the design is a moving target."

reusable_components:
  - component: "Derive state by folding the event log"
    decision: REUSE
    note: "Eliminates log/state divergence entirely."
  - component: "Composite PK + in-transaction step number"
    decision: REUSE
    note: "Single-writer ordering without distributed locking."
  - component: "Three-method event log interface"
    decision: ADOPT_AS_STANDARD
    note: "Minimal sufficient durability contract."
  - component: "Approvals as durable protocol content"
    decision: ADOPT_AS_STANDARD
    note: "Better than all three Phase 2 anchors."
  - component: "Refuse resume on definition change"
    decision: ADOPT_AS_STANDARD
    note: "ADR-0011, verified working."
  - component: "Typed CancelReason"
    decision: ADOPT_AS_STANDARD
    note: "Cancellation should carry why."
  - component: "Precisely specified stream terminator"
    decision: REUSE
    note: "Makes third-party adapters implementable."
  - component: "Opaque agent_config bytes"
    decision: ADOPT_AS_STANDARD
    note: "Keeps the control-plane/adapter boundary honest."
  - component: "gRPC southbound harness contract"
    decision: REUSE
    note: "Enables remote adapters; answers OQ-012."
  - component: "Idempotent actor create/resume"
    decision: REUSE
    note: "Correct restart semantics."
  - component: "OTel setup"
    decision: REUSE
    note: "First real precedent for ADR-0010."
  - component: "No-auth server design"
    decision: BUILD
    note: "Reject; must not ship a network service without authN."
  - component: "In-memory harness registry"
    decision: BUILD
    note: "Reject; registry must be durable and versioned."

lessons:
  - "First implementation of ADR-0001's exact model: actors keyed by conversation, suspended between turns, resumed onto ANY worker, control plane as single writer. But note the divergence - AX's durable identity is the CONVERSATION, not the agent. Reinforces that agent identity earns its place through delegation and policy, neither of which AX has. (confirms ADR-0001)"
  - "Conversation > Interaction is the closest thing to Task/Run yet, with Interaction carrying its own id and terminal state. A TODO admits it is not yet a first-class resource - even a Google team found this hard. (amends ADR-0002)"
  - "No agent-to-agent messaging. FOUR FOR FOUR absent. The case for building it now rests entirely on our own requirements. (confirms ADR-0003)"
  - "The cleanest adapter contract in the study: Start -> Execution{Run, Queue, ID, Close}. Four methods, with durability held by the CONTROLLER rather than the adapter. My strawman AgentRuntime had seven methods including checkpoint/restore; AX shows those belong in the control plane. (confirms ADR-0004)"
  - "gRPC bidirectional streaming as the southbound contract answers OQ-012: remote adapters need no co-location. Better than ACP-over-stdio, and suggests our southbound API should be gRPC-shaped with ACP as one adapter behind it. (amends ADR-0006)"
  - "No principals at all, and consequently no auth, no audit, no delegation. Demonstrates precisely what is lost without the abstraction. (confirms ADR-0007 negatively)"
  - "Third project to choose filesystem/registry-backed skills over a memory store. Strong convergence for the Knowledge node. (confirms ADR-0008)"
  - "Delegates isolation entirely to SubstrATE with user-supplied ActorTemplates. A provider interface, not an implementation - independently arrived at. (confirms ADR-0009)"
  - "FIRST project in the study with real OpenTelemetry: OTLP exporter, propagation, spans on both storage and adapters. Breaks the 3-for-3 gap and proves the standard is viable for agent runtimes. (confirms ADR-0010)"
  - "Only project that fails loudly on definition change, verified by test. Refines the ADR: AX pins harness IDENTITY but not VERSION, so substitution is caught and upgrade is not. Our pin must cover both. (confirms ADR-0011)"
  - "AX is fail-OPEN on capability absence while Letta is fail-CLOSED. The correlation is instructive: Letta's optional capability guards memory isolation, AX's guards readiness. ADR-0012 must distinguish safety-relevant capabilities (fail closed) from liveness-relevant ones (may fail open). (amends ADR-0012)"
  - "NEW: narrow the adapter interface. Since ADR-0012 establishes not every harness can checkpoint, putting checkpoint/restore in the adapter guarantees a lowest-common-denominator problem. Proposed: Start -> {Run, Queue, Cancel, Close} with the control plane owning the log."

adr_impact:
  - adr: ADR-0001
    effect: confirms
    note: "First implementation of durable identity + disposable compute. But identity is the conversation, not the agent."
  - adr: ADR-0002
    effect: amends
    note: "Conversation > Interaction is the closest split yet, but a TODO admits Interaction is not yet a resource."
  - adr: ADR-0003
    effect: confirms
    note: "No agent-to-agent messaging. Four for four."
  - adr: ADR-0004
    effect: confirms
    note: "Cleanest adapter contract in the study; four methods, durability held by the controller not the adapter."
  - adr: ADR-0005
    effect: neutral
    note: "No MCP; tools are opaque step types owned by the harness."
  - adr: ADR-0006
    effect: amends
    note: "gRPC southbound streaming enables remote adapters without co-location. Answers OQ-012."
  - adr: ADR-0007
    effect: confirms
    note: "No principals, no auth, no audit, no delegation - shows what is lost without the abstraction."
  - adr: ADR-0008
    effect: confirms
    note: "Third project choosing filesystem/registry skills over a memory store."
  - adr: ADR-0009
    effect: confirms
    note: "Isolation delegated entirely to an external actor system with user-supplied templates."
  - adr: ADR-0010
    effect: confirms
    note: "FIRST real OTel in the study: OTLP, propagation, spans on storage and adapters."
  - adr: ADR-0011
    effect: confirms
    note: "Only project that fails loudly on definition change (verified). Pins identity but not version."
  - adr: ADR-0012
    effect: amends
    note: "Fail-open on capability absence, opposite Letta. ADR must distinguish safety-relevant from liveness-relevant capabilities."
  - adr: ADR-0013
    effect: neutral
    note: "No policy engine, so nothing to trace."

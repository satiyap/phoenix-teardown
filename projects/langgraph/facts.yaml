# Machine-readable extraction. Schema: schema/facts.schema.yaml
# Validate:  ./.venv/bin/python tools/validate_facts.py
#
# verdict:   first_class | implicit | absent | unknown
# scenarios: first_class_answer | inferable | undefined | unknown
# evidence:  'path/file.py:120 @ sha'  or  'URL (read YYYY-MM-DD)'

schema_version: 1

project:
  slug: langgraph
  name: LangGraph / LangSmith
  depth: deep
  evidence_class: A
  read_on: 2026-08-26
  repo: "https://github.com/langchain-ai/langgraph"
  commit: 38031739e551638e373fb553453256c23feeb41f
  docs: "https://langchain-ai.github.io/langgraph/"
  version: "langgraph 1.2.11 / checkpoint 4.2.0 / sdk 0.4.3"
  license: MIT
  license_verdict: INTEGRATE
  runtime_class: hybrid
  one_line: Graph-based runtime for building resilient agents with pluggable checkpointers.
  thesis: "Model execution as a Pregel super-step loop over versioned channels, and make the persistence boundary an explicit caller-selected tradeoff. Get the checkpoint contract right and durability, HITL, time-travel and forking all fall out of one mechanism."

probes:

  # --- A. Core abstraction and object model ---
  # A1: What does this system think an agent *is*? State it in one sentence, in their vocabulary.
  A1:
    verdict: first_class
    note: "A graph of nodes over versioned channels. An 'agent' is not a runtime concept; the unit is a compiled Pregel graph executing super-steps."
    evidence: "libs/langgraph/langgraph/pregel/main.py @ 3803173"
  # A2: What is the root resource — the thing everything else hangs off?
  A2:
    verdict: first_class
    note: "Thread is the root in OSS, but it is only a thread_id string in a config dict, not a stored object. Becomes a real resource only in the closed Platform."
    evidence: "libs/sdk-py/langgraph_sdk/schema.py:300 @ 3803173"
  # A3: Is `Agent` persistent or ephemeral? Can it exist while not executing?
  A3:
    verdict: absent
    note: "No Agent resource exists in the OSS runtime. Platform 'Assistant' is config-over-graph, not a persistent agent."
    evidence: "libs/sdk-py/langgraph_sdk/schema.py:246 @ 3803173"
  # A4: Is `Task` a separate resource from `Run`? If not, which concept is missing and what fills the...
  A4:
    verdict: absent
    note: "No Task resource. A Run exists only at the Platform layer; in OSS a run is a function call with no durable identity."
    evidence: "libs/sdk-py/langgraph_sdk/schema.py:362 @ 3803173"
  # A5: What is a `Session` attached to: user, agent, task, or execution?
  A5:
    verdict: implicit
    note: "Thread is the session analogue, attached to nothing in particular - the caller supplies an arbitrary thread_id."
    evidence: "libs/langgraph/langgraph/types.py @ 3803173"
  # A6: Are messages first-class durable resources, or transient function arguments?
  A6:
    verdict: absent
    note: "Messages are ordinary channel values, not durable addressable resources. No mailbox, no delivery guarantee."
    evidence: "libs/checkpoint/langgraph/checkpoint/base/__init__.py:92 @ 3803173"
  # A7: Are artifacts (files, outputs, deliverables) first-class?
  A7:
    verdict: absent
    note: "No artifact concept. Outputs are channel values or Store items."
    evidence: "libs/checkpoint/langgraph/checkpoint/store/base/__init__.py:51 @ 3803173"
  # A8: Can multiple agents participate in one task? How is that represented?
  A8:
    verdict: implicit
    note: "Multiple agents = multiple nodes in one graph sharing channel state, or subgraphs. Not modelled as distinct participants."
    evidence: "libs/langgraph/langgraph/pregel/_algo.py @ 3803173"
  # A9: Draw the object model as a tree. Only nodes that exist in their code or API.
  A9:
    verdict: first_class
    note: "Graph > Node/Channel > Thread > Checkpoint > PendingWrite. Store is separate. See teardown section 3."
    evidence: "libs/checkpoint/langgraph/checkpoint/base/__init__.py:38-160 @ 3803173"

  # --- B. Runtime model ---
  # B1: Does the platform launch agents, host them, or attach to external ones?
  B1:
    verdict: absent
    note: "Neither launches, hosts, nor attaches to external agents. The agent IS Python inside the graph; no adapter concept."
    evidence: "libs/langgraph/langgraph/pregel/main.py @ 3803173"
  # B2: Execution substrate: process, container, microVM, serverless, in-process library, remote HTTP?
  B2:
    verdict: first_class
    note: "In-process library. Platform wraps it in containers with Postgres+Redis."
    evidence: "libs/cli/langgraph_cli/deploy.py @ 3803173"
  # B3: Who owns the event loop — platform or agent?
  B3:
    verdict: first_class
    note: "Caller owns the event loop. invoke/stream drive the super-step loop synchronously from the caller's view."
    evidence: "libs/langgraph/langgraph/pregel/_loop.py @ 3803173"
  # B4: Who decides when an agent wakes?
  B4:
    verdict: first_class
    note: "Caller decides. No autonomous wake; Platform Cron provides scheduled triggers."
    evidence: "libs/sdk-py/langgraph_sdk/schema.py:383 @ 3803173"
  # B5: Can an agent run indefinitely? What is the actual ceiling?
  B5:
    verdict: implicit
    note: "Bounded by recursion_limit on super-steps, not by wall clock. No indefinite background execution in OSS."
    evidence: "libs/langgraph/langgraph/pregel/main.py @ 3803173"
  # B6: Are there background or unattended agents?
  B6:
    verdict: absent
    note: "No background agents in OSS. Cron exists only in the closed Platform."
    evidence: "libs/sdk-py/langgraph_sdk/schema.py:383 @ 3803173"
  # B7: Is execution synchronous or asynchronous from the caller's view?
  B7:
    verdict: first_class
    note: "Synchronous from the caller's view; async variants exist but the caller still awaits."
    evidence: "libs/langgraph/langgraph/pregel/main.py @ 3803173"
  # B8: Can in-flight work migrate between workers?
  B8:
    verdict: absent
    note: "No work migration in OSS. Any such behaviour lives in the closed Platform."
    evidence: "libs/langgraph/langgraph/pregel/_loop.py @ 3803173"
  # B9: Can an agent survive a machine restart? Automatically, or with operator action?
  B9:
    verdict: first_class
    note: "Yes via checkpointer: a new process resumes the thread from its last checkpoint."
    evidence: "libs/checkpoint/langgraph/checkpoint/base/__init__.py:176 @ 3803173"
  # B10: Classify: worker/queue, durable actor, attached harness, or in-process library.
  B10:
    verdict: first_class
    note: "in_process library; Platform layers worker_queue on top."
    evidence: "libs/langgraph/langgraph/pregel/main.py @ 3803173"

  # --- C. Durability and failure semantics ---
  # C1: What state is durable, and what is lost on crash?
  C1:
    verdict: first_class
    note: "Durable: channel_values, channel_versions, versions_seen, pending_writes, metadata (source/step/parents/run_id). Lost: in-flight node locals."
    evidence: "libs/checkpoint/langgraph/checkpoint/base/__init__.py:38-125 @ 3803173"
  # C2: *When* is state persisted — every step, every tool call, on checkpoint, never?
  C2:
    verdict: first_class
    note: "Caller-selected: Durability = sync (before next step) | async (during next step) | exit (on exit only). Excellent design - names a real tradeoff."
    evidence: "libs/langgraph/langgraph/types.py:89 @ 3803173"
  # C3: Checkpointing or event sourcing? Can state be rebuilt from a log?
  C3:
    verdict: first_class
    note: "Checkpointing, not event sourcing. Snapshot of channel values plus pending writes; monotonically increasing checkpoint ids allow ordering and replay."
    evidence: "libs/checkpoint/langgraph/checkpoint/base/__init__.py:97 @ 3803173"
  # C4: Retry semantics, and at what granularity: run, step, tool call?
  C4:
    verdict: first_class
    note: "Declarative RetryPolicy(initial_interval, backoff_factor, max_interval) applied per node."
    evidence: "libs/langgraph/langgraph/types.py:418 @ 3803173"
  # C5: At-least-once or exactly-once? What do the docs claim versus what the code does?
  C5:
    verdict: implicit
    note: "At-least-once at NODE granularity. Verified: a side effect before interrupt() executes twice on resume."
    evidence: "verified empirically 2026-08-26, langgraph 1.2.11; libs/langgraph/langgraph/types.py:864 @ 3803173"
  # C6: Is there an idempotency model for tool side effects?
  C6:
    verdict: absent
    note: "No idempotency model for side effects. CachePolicy is a perf cache keyed on node input, not an idempotency barrier."
    evidence: "libs/langgraph/langgraph/types.py:521 @ 3803173"
  # C7: Process crash recovery: what resumes, and from where?
  C7:
    verdict: first_class
    note: "Deterministic task IDs hashed from checkpoint_id + namespace + step (xxhash for v>1, uuid5 below), with a task_id_checksum assertion. Completed tasks are skipped on resume."
    evidence: "libs/langgraph/langgraph/pregel/_algo.py:550,616,662 @ 3803173"
  # C8: Node loss: is work re-dispatched, and how is it detected?
  C8:
    verdict: unknown
    note: "No node-loss detection in OSS (no nodes). Platform lease/heartbeat behaviour is closed source."
    evidence: "libs/langgraph/langgraph/pregel/_loop.py @ 3803173"
  # C9: Context-window overflow: truncation, summarisation, or failure?
  C9:
    verdict: absent
    note: "No automatic context-overflow handling. Summarisation is left to user code."
    evidence: "libs/langgraph/langgraph/pregel/main.py @ 3803173"
  # C10: Timers, scheduled execution, long sleeps — durable across restart?
  C10:
    verdict: implicit
    note: "No durable timers in OSS. Platform Cron provides scheduling; durability closed."
    evidence: "libs/sdk-py/langgraph_sdk/schema.py:383 @ 3803173"
  # C11: Human-in-the-loop pause and resume: durable, or in-memory only?
  C11:
    verdict: first_class
    note: "interrupt() is durable: requires a checkpointer, surfaces value to client, resumes via Command(resume=...). Pending interrupts queryable as thread state."
    evidence: "libs/langgraph/langgraph/types.py:851 @ 3803173 and libs/sdk-py/langgraph_sdk/schema.py:300"
  # C12: Can a definition be upgraded while runs are in flight? What happens to them?
  C12:
    verdict: absent
    note: "No definition version on checkpoints. Verified: same-topology change silently runs new code; a RENAMED node silently drops the pending task and returns empty with no error. Genuine hazard."
    evidence: "verified empirically 2026-08-26, langgraph 1.2.11"

  # --- D. Agent identity and lifecycle ---
  # D1: Is an agent globally addressable? By what identifier?
  D1:
    verdict: absent
    note: "No agent_id anywhere in the OSS runtime. Platform assistant_id is the nearest analogue."
    evidence: "libs/sdk-py/langgraph_sdk/schema.py:246 @ 3803173"
  # D2: Does identity survive process restart?
  D2:
    verdict: implicit
    note: "Thread state survives restart; agent identity does not exist to survive."
    evidence: "libs/checkpoint/langgraph/checkpoint/base/__init__.py:176 @ 3803173"
  # D3: Is identity distinct from runtime instance?
  D3:
    verdict: absent
    note: "No identity/instance distinction because there is no identity."
    evidence: "libs/langgraph/langgraph/pregel/main.py @ 3803173"
  # D4: Are agents versioned? Immutable or mutable definitions?
  D4:
    verdict: first_class
    note: "Platform only: Assistant has integer version and AssistantVersion history. Versions config, NOT graph topology - see C12."
    evidence: "libs/sdk-py/langgraph_sdk/schema.py:269 @ 3803173"
  # D5: Is there a registry or catalog?
  D5:
    verdict: implicit
    note: "Platform assistant search acts as a registry; nothing in OSS."
    evidence: "libs/sdk-py/langgraph_sdk/schema.py:282 @ 3803173"
  # D6: Can agents discover each other at runtime?
  D6:
    verdict: absent
    note: "No runtime agent discovery."
    evidence: "libs/sdk-py/langgraph_sdk/schema.py @ 3803173"
  # D7: Can agents advertise capabilities? In what format?
  D7:
    verdict: absent
    note: "No capability advertisement for agents. (The Capability enum in the conformance suite is about storage ops, different concept.)"
    evidence: "libs/checkpoint-conformance/langgraph/checkpoint/conformance/capabilities.py @ 3803173"
  # D8: Is there an owner, team, or tenant on the agent record?
  D8:
    verdict: absent
    note: "No owner, team, or tenant on any resource in OSS."
    evidence: "libs/sdk-py/langgraph_sdk/schema.py:246 @ 3803173"
  # D9: Can an agent be suspended, revoked, or deprecated?
  D9:
    verdict: absent
    note: "No suspend/revoke/deprecate lifecycle."
    evidence: "libs/sdk-py/langgraph_sdk/schema.py @ 3803173"
  # D10: Is there anything resembling a declarative agent manifest?
  D10:
    verdict: absent
    note: "No declarative agent manifest. Graphs are defined in Python code."
    evidence: "libs/langgraph/langgraph/graph @ 3803173"

  # --- E. Harness and runtime interoperability ---
  # E1: What is the minimum interface an agent implementation must satisfy?
  E1:
    verdict: absent
    note: "No agent interface to implement; you write Python nodes. No adapter boundary exists."
    evidence: "libs/langgraph/langgraph/pregel/main.py @ 3803173"
  # E2: Transport: stdin/stdout, HTTP, gRPC, WebSocket, in-process, ACP, A2A?
  E2:
    verdict: first_class
    note: "In-process Python for OSS; HTTP+SSE for Platform. No stdio/gRPC/ACP/A2A."
    evidence: "libs/sdk-py/langgraph_sdk/client.py @ 3803173"
  # E3: Can it host a foreign agent (Claude Code, Codex, OpenHands, LangGraph, ADK)?
  E3:
    verdict: absent
    note: "Cannot host a foreign agent. LangGraph is the harness, not a host for others."
    evidence: "libs/langgraph/langgraph/pregel/main.py @ 3803173"
  # E4: Is there an event stream out of a running agent? What granularity?
  E4:
    verdict: first_class
    note: "Rich stream/debug event stream: _DebugCheckpointPayload, _DebugTaskPayload, _DebugTaskResultPayload, RunMetadataPayload."
    evidence: "libs/sdk-py/langgraph_sdk/schema.py:686-723 @ 3803173"
  # E5: Are tool calls externally observable, or internal to the agent?
  E5:
    verdict: first_class
    note: "Tool calls are observable as node executions in the stream."
    evidence: "libs/sdk-py/langgraph_sdk/schema.py:697 @ 3803173"
  # E6: How is context injected at start?
  E6:
    verdict: first_class
    note: "Context injected via config/context on invoke; Assistant carries static context at Platform layer."
    evidence: "libs/sdk-py/langgraph_sdk/schema.py:246 @ 3803173"
  # E7: Is cancellation supported? Cooperative or forced? Does it propagate to subagents?
  E7:
    verdict: implicit
    note: "No cooperative cancel token for sync nodes; async path can propagate CancelledError. Verified: abandoning a sync invoke leaves the worker running and the task pending."
    evidence: "verified empirically 2026-08-26, langgraph 1.2.11"
  # E8: Can a run be checkpointed and restored by the platform, or only by the agent?
  E8:
    verdict: first_class
    note: "Platform-side checkpoint/restore via the checkpointer; the runtime owns it, not the agent."
    evidence: "libs/checkpoint/langgraph/checkpoint/base/__init__.py:176 @ 3803173"
  # E9: Which of these would be hard to adapt, and why?
  E9:
    verdict: implicit
    note: "Adapting LangGraph as a guest harness is feasible via the SDK; adapting foreign agents INTO LangGraph is not supported."
    evidence: "libs/sdk-py/langgraph_sdk/client.py @ 3803173"

  # --- F. Agent-to-agent communication ---
  # F1: Direct messages between agents?
  F1:
    verdict: absent
    note: "No direct agent-to-agent messages."
    evidence: "libs/langgraph/langgraph/pregel/_algo.py @ 3803173"
  # F2: Channels, topics, or pub/sub?
  F2:
    verdict: absent
    note: "No channels in the messaging sense. LangGraph 'channels' are state slots, not pub/sub topics."
    evidence: "libs/checkpoint/langgraph/checkpoint/base/__init__.py:92 @ 3803173"
  # F3: Task delegation as a distinct mechanism from messaging?
  F3:
    verdict: absent
    note: "No task delegation primitive. Send() is intra-graph fan-out."
    evidence: "libs/langgraph/langgraph/types.py @ 3803173"
  # F4: Synchronous RPC between agents?
  F4:
    verdict: absent
    note: "No inter-agent RPC."
    evidence: "libs/langgraph/langgraph/pregel/main.py @ 3803173"
  # F5: Asynchronous inbox or mailbox?
  F5:
    verdict: absent
    note: "No mailbox or inbox."
    evidence: "libs/langgraph/langgraph/pregel/_algo.py @ 3803173"
  # F6: Is delivery durable? Survives restart of sender and receiver?
  F6:
    verdict: absent
    note: "No message delivery layer, hence no durability guarantee."
    evidence: "libs/langgraph/langgraph/pregel/_algo.py @ 3803173"
  # F7: Is message ordering guaranteed? Per what scope?
  F7:
    verdict: implicit
    note: "Ordering exists only as super-step sequencing within one graph."
    evidence: "libs/langgraph/langgraph/pregel/_loop.py @ 3803173"
  # F8: Acknowledgement or delivery receipts?
  F8:
    verdict: absent
    note: "No acknowledgement mechanism."
    evidence: "libs/langgraph/langgraph/pregel/_algo.py @ 3803173"
  # F9: Correlation ids for request/response pairing?
  F9:
    verdict: implicit
    note: "run_id in checkpoint metadata correlates checkpoints to a run; not a message correlation id."
    evidence: "libs/checkpoint/langgraph/checkpoint/base/__init__.py:61 @ 3803173"
  # F10: Conversation threading?
  F10:
    verdict: implicit
    note: "Thread is the threading construct, but for human conversation, not agent-to-agent."
    evidence: "libs/sdk-py/langgraph_sdk/schema.py:300 @ 3803173"
  # F11: Capability-based routing — address by what an agent *can do* rather than who it is?
  F11:
    verdict: absent
    note: "No capability-based routing."
    evidence: "libs/langgraph/langgraph/pregel/_algo.py @ 3803173"

  # --- G. Human-agent collaboration ---
  # G1: Is a human modelled as a special kind of agent, a distinct principal type, or not modelled?
  G1:
    verdict: absent
    note: "Humans are not modelled in the runtime. Auth subject is BaseUser (identity, is_authenticated, permissions) - no Principal abstraction and no agent principal."
    evidence: "libs/sdk-py/langgraph_sdk/auth/types.py:152-202 @ 3803173"
  # G2: Shared rooms, channels, or workspaces?
  G2:
    verdict: absent
    note: "No shared workspace or room concept."
    evidence: "libs/sdk-py/langgraph_sdk/schema.py @ 3803173"
  # G3: Task threads humans can read and post into?
  G3:
    verdict: implicit
    note: "A Thread is readable and updatable by a human via update_state, functioning as a shared surface."
    evidence: "libs/sdk-py/langgraph_sdk/schema.py:333 @ 3803173"
  # G4: Mentions or directed addressing?
  G4:
    verdict: absent
    note: "No mentions or directed addressing."
    evidence: "libs/sdk-py/langgraph_sdk/schema.py @ 3803173"
  # G5: Approval gates. Blocking or advisory? Durable while pending?
  G5:
    verdict: first_class
    note: "interrupt() is a durable blocking approval gate; pending interrupts exposed as thread.interrupts keyed by task id."
    evidence: "libs/langgraph/langgraph/types.py:851 @ 3803173; libs/sdk-py/langgraph_sdk/schema.py:300"
  # G6: Mid-run intervention: can a human redirect without restarting?
  G6:
    verdict: first_class
    note: "update_state allows a human to modify thread state mid-run and resume, including forking (metadata source='update'|'fork')."
    evidence: "libs/checkpoint/langgraph/checkpoint/base/__init__.py:41 @ 3803173"
  # G7: Agent status and presence visible to humans?
  G7:
    verdict: first_class
    note: "ThreadStatus = idle | busy | interrupted | error gives visible agent status."
    evidence: "libs/sdk-py/langgraph_sdk/schema.py:34 @ 3803173"
  # G8: Notifications or escalation when an agent is blocked?
  G8:
    verdict: absent
    note: "No notification or escalation mechanism."
    evidence: "libs/sdk-py/langgraph_sdk/schema.py @ 3803173"
  # G9: Shared scratchpad or working surface?
  G9:
    verdict: implicit
    note: "Channel state acts as a shared scratchpad, but it is execution state rather than a collaboration surface."
    evidence: "libs/checkpoint/langgraph/checkpoint/base/__init__.py:92 @ 3803173"
  # G10: Can a human see the context an agent is operating on?
  G10:
    verdict: first_class
    note: "get_state exposes the full context the agent is operating on."
    evidence: "libs/sdk-py/langgraph_sdk/schema.py:333 @ 3803173"

  # --- H. Context and memory ---
  # H1: Which of these exist as *separate* concepts: prompt context, working state, session history, ...
  H1:
    verdict: first_class
    note: "Three separated concepts: checkpointer channels (working execution state), BaseStore (cross-thread memory), BaseCache (node-output cache). Supports the ADR-0008 split."
    evidence: "libs/checkpoint/langgraph/checkpoint/store/base/__init__.py:708 @ 3803173"
  # H2: Who owns memory: agent, human, workspace, task, or tenant?
  H2:
    verdict: implicit
    note: "Store items are owned by whatever namespace tuple the caller chooses - 'user IDs, assistant IDs, or other arbitrary namespaces'. Ownership is convention, not enforced."
    evidence: "libs/checkpoint/langgraph/checkpoint/store/base/__init__.py:711 @ 3803173"
  # H3: Can memory be shared between agents? At what granularity?
  H3:
    verdict: first_class
    note: "Store is explicitly shared across threads via namespaces."
    evidence: "libs/checkpoint/langgraph/checkpoint/store/base/__init__.py:711 @ 3803173"
  # H4: Are there permissions on memory?
  H4:
    verdict: absent
    note: "No permissions on Store namespaces. Any holder of the store handle can read any namespace - looks like an isolation boundary but is not one."
    evidence: "libs/checkpoint/langgraph/checkpoint/store/base/__init__.py:708 @ 3803173"
  # H5: Is provenance tracked — where a memory came from?
  H5:
    verdict: absent
    note: "No provenance field on Item (value/key/namespace/timestamps only)."
    evidence: "libs/checkpoint/langgraph/checkpoint/store/base/__init__.py:51 @ 3803173"
  # H6: Expiry, TTL, or forgetting?
  H6:
    verdict: first_class
    note: "TTLConfig: refresh_on_read, omit_expired, default_ttl, sweep_interval_minutes."
    evidence: "libs/checkpoint/langgraph/checkpoint/store/base/__init__.py:545 @ 3803173"
  # H7: Summarisation or compaction. Automatic or explicit?
  H7:
    verdict: absent
    note: "No built-in summarisation or compaction of history."
    evidence: "libs/langgraph/langgraph/pregel/main.py @ 3803173"
  # H8: Retrieval mechanism: vector, keyword, structured, agent-driven?
  H8:
    verdict: first_class
    note: "Store search with optional semantic index (IndexConfig), plus filtered search and namespace listing."
    evidence: "libs/checkpoint/langgraph/checkpoint/store/base/__init__.py:578 @ 3803173"
  # H9: Can an agent mutate its own memory mid-run?
  H9:
    verdict: first_class
    note: "Nodes can write to the Store mid-run via the injected store handle."
    evidence: "libs/checkpoint/langgraph/checkpoint/store/base/__init__.py:708 @ 3803173"
  # H10: Conflict resolution on concurrent writes?
  H10:
    verdict: absent
    note: "No versioning, CAS, or conflict policy on Store items. Last-write-wins by implementation default."
    evidence: "libs/checkpoint/langgraph/checkpoint/store/base/__init__.py:431 @ 3803173"
  # H11: Is memory in the same store as execution state, or separate?
  H11:
    verdict: first_class
    note: "Separate stores: checkpointer for execution state, BaseStore for memory. Good separation."
    evidence: "libs/checkpoint/langgraph/checkpoint/store/base/__init__.py:708 @ 3803173"

  # --- I. Tools and capabilities ---
  # I1: Are tools bound to agents statically, or resolved dynamically?
  I1:
    verdict: first_class
    note: "Tools are Python callables bound statically at graph construction."
    evidence: "libs/langgraph/langgraph/prebuilt @ 3803173"
  # I2: Is there a capability abstraction distinct from tool implementation?
  I2:
    verdict: absent
    note: "No capability abstraction distinct from tool implementation. NOTE the vocabulary collision: the conformance Capability enum concerns checkpointer storage ops."
    evidence: "libs/checkpoint-conformance/langgraph/checkpoint/conformance/capabilities.py @ 3803173"
  # I3: Is there a registry of available tools?
  I3:
    verdict: absent
    note: "No tool registry."
    evidence: "libs/langgraph/langgraph/prebuilt @ 3803173"
  # I4: Tool scoping — can an agent be restricted to a subset?
  I4:
    verdict: absent
    note: "No tool scoping or restriction mechanism."
    evidence: "libs/langgraph/langgraph/prebuilt @ 3803173"
  # I5: Are tools versioned?
  I5:
    verdict: absent
    note: "No tool versioning."
    evidence: "libs/langgraph/langgraph/prebuilt @ 3803173"
  # I6: How are credentials supplied to a tool?
  I6:
    verdict: absent
    note: "Credentials are ambient in the host process; no injection model."
    evidence: "libs/langgraph/langgraph/pregel/main.py @ 3803173"
  # I7: OAuth or delegated user credentials?
  I7:

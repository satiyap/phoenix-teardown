object_model: |
  # OSS runtime - no agent, no user, no tenant
  Graph (compiled Pregel)
   |-- Node
   |-- Channel               (named, versioned)
   `-- Thread                (only a thread_id string in config)
        `-- Checkpoint       (id, ts, channel_values, channel_versions, versions_seen)
             |-- PendingWrite        (task_id, channel, value)
             `-- CheckpointMetadata  (source, step, parents, run_id)
  Store (separate from checkpointer)
   `-- Item (namespace tuple, key, value, TTL)

  # Platform (closed) - where resources actually appear
  Assistant (assistant_id, graph_id, config, context, version)
   `-- AssistantVersion
  Thread (thread_id, status, values, interrupts)
   `-- Run (run_id, thread_id, assistant_id, status, multitask_strategy)
  Cron

strongest_ideas:
  - "Checkpointer conformance suite: BASE vs EXTENDED capabilities, detected at runtime by method-override check, with spec tests gated on detected capabilities. Directly applicable to harness adapters."
  - "Durability as a caller-selected mode (sync|async|exit) rather than a hidden internal detail."
  - "Deterministic task IDs hashed from checkpoint_id + namespace + step, with a checksum assertion guarding the invariant."
  - "MultitaskStrategy (reject|interrupt|rollback|enqueue) names the concurrent-run policy explicitly."
  - "Interrupts exposed as queryable thread state (thread.interrupts keyed by task id) rather than a suspended coroutine."
  - "Auth handler specificity fallback: exact resource+action -> resource -> global."
  - "Store separated from checkpointer, with hierarchical namespaces and TTL."

weakest_choices:
  - "Node-granularity resume with no side-effect protection: any effect before interrupt() runs twice, and the docs treat this as a note rather than a warning."
  - "No definition version on checkpoints: renaming a node silently drops pending work with no error."
  - "No agent or principal concept, so identity, delegation and audit are all impossible; S1 cannot be posed."
  - "Proprietary telemetry with no OTel, so the best observability is locked behind a commercial product."
  - "Store namespaces look like an isolation boundary but carry no permissions."
  - "No budget or cost controls; recursion_limit bounds steps, not spend."
  - "Thread is not a resource in OSS, just a config string, so lifecycle operations have nowhere to live."

reusable_components:
  - component: "Conformance-suite pattern for capability negotiation"
    decision: REUSE
    note: "Best available answer to heterogeneous backend capabilities; adopt for harness adapters."
  - component: "Durability mode vocabulary (sync|async|exit)"
    decision: ADOPT_AS_STANDARD
    note: "Good public contract for a real tradeoff."
  - component: "Deterministic task ID scheme"
    decision: REUSE
    note: "Prerequisite for correct resume."
  - component: "MultitaskStrategy vocabulary"
    decision: ADOPT_AS_STANDARD
    note: "Names a decision most systems leave implicit."
  - component: "Auth specificity fallback chain"
    decision: REUSE
    note: "Predictable policy resolution."
  - component: "Checkpointer implementations"
    decision: INTEGRATE
    note: "Use when hosting LangGraph agents; not our storage layer."
  - component: "Graph runtime"
    decision: INTEGRATE
    note: "One harness among several per ADR-0004."

lessons:
  - "A widely successful agent runtime shipped with NO agent identity. Durable thread state delivered the value. Our case for agent identity must rest on delegation, policy and audit, not on durability. (challenges ADR-0001)"
  - "Absence of Task and durable Run is exactly why 'retry this intent' has nowhere to live. (confirms ADR-0002)"
  - "Multi-agent via shared mutable channel state provides no ordering, delivery or correlation guarantees. (confirms ADR-0003)"
  - "The conformance suite is a concrete, proven design for adapter capability negotiation: base + extended + runtime detection + spec tests. (confirms ADR-0004)"
  - "Auth principal is BaseUser only, so agents cannot hold permissions. (confirms ADR-0007)"
  - "Checkpointer/Store separation validates the context split, but no permissions or provenance on Store leaves H4/H5 unanswered by precedent. (confirms ADR-0008 partially)"
  - "Proprietary telemetry locked the best observability behind a commercial product - the outcome OTel avoids. (confirms ADR-0010)"
  - "NEW: checkpoints must record the definition version that produced them and resume must fail loudly on incompatible change. Proposing ADR-0011."
  - "AMENDMENT: the Run state machine needs an explicit CANCELLING state, or cancellation is indistinguishable from abandonment."

adr_impact:
  - adr: ADR-0001
    effect: challenges
    note: "No agent identity whatsoever, yet successful. Durable thread state was sufficient for its use case. Rebase our justification on delegation/policy/audit rather than durability."
  - adr: ADR-0002
    effect: confirms
    note: "No Task and no durable Run in OSS; retry has no home. Also needs a CANCELLING state per S5."
  - adr: ADR-0003
    effect: confirms
    note: "Shared channel state gives no delivery or ordering guarantees."
  - adr: ADR-0004
    effect: confirms
    note: "Conformance suite supplies the capability-negotiation pattern the adapter interface needs."
  - adr: ADR-0005
    effect: neutral
    note: "No capability model; MCP lives outside the runtime."
  - adr: ADR-0006
    effect: neutral
    note: "No A2A."
  - adr: ADR-0007
    effect: confirms
    note: "BaseUser-only principal makes S1 unanswerable."
  - adr: ADR-0008
    effect: confirms
    note: "Checkpointer/Store separation is real and useful; permissions and provenance still missing."
  - adr: ADR-0009
    effect: neutral
    note: "No sandbox at all."
  - adr: ADR-0010
    effect: confirms
    note: "No OTel anywhere; observability is commercial-only. Counter-example that supports the decision."

# Machine-readable extraction. Schema: schema/facts.schema.yaml
# Validate:  ./.venv/bin/python tools/validate_facts.py
#
# verdict:   first_class | implicit | absent | unknown
# scenarios: first_class_answer | inferable | undefined | unknown
# evidence:  'path/file.py:120 @ sha'  or  'URL (read YYYY-MM-DD)'

schema_version: 1

project:
  slug: google-agent-platform
  name: Google Agent Platform
  depth: deep
  evidence_class: A
  read_on: 2026-08-26
  repo: "https://github.com/google/adk-python"
  commit: 85b52f6a307598eb0bc20a6ab2a6780bb9efe7c1
  docs: "https://google.github.io/adk-docs/"
  version: "google-adk 2.7.1"
  license: Apache-2.0
  license_verdict: INTEGRATE
  runtime_class: hybrid
  one_line: Agent Development Kit plus the managed Vertex AI Agent Engine control plane.
  thesis: "Every stateful concern is a swappable service behind an abstract interface, with an in-memory implementation for development and a managed implementation for production - so the local path and the production path are the same code with a different injection."

probes:

  # --- A. Core abstraction and object model ---
  # A1: What does this system think an agent *is*? State it in one sentence, in their vocabulary.
  A1:
    verdict: implicit
    note: "BaseAgent subclasses (LlmAgent, SequentialAgent, ParallelAgent, LoopAgent) are Python objects with a name. No agent id or persisted identity."
    evidence: "src/google/adk/agents/ @ 85b52f6"
  # A2: What is the root resource — the thing everything else hangs off?
  A2:
    verdict: first_class
    note: "Session keyed by (app_name, user_id, session_id), with pluggable backends: in-memory, SQLite, generic SQL, Firestore, Redis, Vertex AI."
    evidence: "src/google/adk/sessions/base_session_service.py @ 85b52f6"
  # A3: Is `Agent` persistent or ephemeral? Can it exist while not executing?
  A3:
    verdict: first_class
    note: "Sessions, memory, artifacts and credentials all persist independently of any running process, each behind a service interface."
    evidence: "src/google/adk/sessions/database_session_service.py @ 85b52f6"
  # A4: Is `Task` a separate resource from `Run`? If not, which concept is missing and what fills the...
  A4:
    verdict: implicit
    note: "Invocation is a real run with pausable/resumable/rewindable semantics, but there is no Task resource holding intent across attempts."
    evidence: "src/google/adk/apps/_configs.py:29-47 @ 85b52f6"
  # A5: What is a `Session` attached to: user, agent, task, or execution?
  A5:
    verdict: first_class
    note: "Session is the session, with App above it and Invocation below. Consistently keyed by (app_name, user_id)."
    evidence: "src/google/adk/sessions/session.py @ 85b52f6"
  # A6: Are messages first-class durable resources, or transient function arguments?
  A6:
    verdict: first_class
    note: "Event is the durable transcript unit, carrying actions including rewind_before_invocation_id."
    evidence: "src/google/adk/events/event.py @ 85b52f6"
  # A7: Are artifacts (files, outputs, deliverables) first-class?
  A7:
    verdict: first_class
    note: "BaseArtifactService with versioned artifacts scoped per session or per user; GCS and in-memory implementations."
    evidence: "src/google/adk/artifacts/ @ 85b52f6"
  # A8: Can multiple agents participate in one task? How is that represented?
  A8:
    verdict: first_class
    note: "Multi-agent composition via SequentialAgent, ParallelAgent, LoopAgent, agent-as-tool, and LLM-driven transfer."
    evidence: "src/google/adk/agents/ @ 85b52f6"
  # A9: Draw the object model as a tree. Only nodes that exist in their code or API.
  A9:
    verdict: first_class
    note: "App(is_resumable, compaction, plugins) > Agent > Invocation > Event; Session(app_name, user_id, session_id) > State(app:/user:/temp:/session) + Event[]; plus MemoryEntry, AuthCredential, Artifact, Skill. See teardown section 3."
    evidence: "src/google/adk/ @ 85b52f6; verified live against google-adk 2.7.1 (PyPI, 2026-08-26)"

  # --- B. Runtime model ---
  # B1: Does the platform launch agents, host them, or attach to external ones?
  B1:
    verdict: first_class
    note: "A Runner drives in-process agents through flows (flows/llm_flows/); services are injected."
    evidence: "src/google/adk/runners.py @ 85b52f6"
  # B2: Execution substrate: process, container, microVM, serverless, in-process library, remote HTTP?
  B2:
    verdict: first_class
    note: "The agent runs in-process, but CODE EXECUTION has seven pluggable backends: container, GKE, Vertex AI, Agent Engine sandbox, model-native, and unsafe_local."
    evidence: "src/google/adk/code_executors/ @ 85b52f6"
  # B3: Who owns the event loop — platform or agent?
  B3:
    verdict: first_class
    note: "flows/llm_flows/base_llm_flow.py owns the LLM loop, with sixteen plugin callbacks around it."
    evidence: "src/google/adk/flows/llm_flows/base_llm_flow.py @ 85b52f6"
  # B4: Who decides when an agent wakes?
  B4:
    verdict: implicit
    note: "The caller constructs a Runner and injects services; there is no placement layer."
    evidence: "src/google/adk/runners.py @ 85b52f6"
  # B5: Can an agent run indefinitely? What is the actual ceiling?
  B5:
    verdict: first_class
    note: "Sessions are long-lived and resumable; an invocation can pause on a long-running function call and resume from the last event."
    evidence: "src/google/adk/apps/_configs.py:32-36 @ 85b52f6"
  # B6: Are there background or unattended agents?
  B6:
    verdict: absent
    note: "No scheduling or cron in the framework."
    evidence: "src/google/adk/runners.py @ 85b52f6"
  # B7: Is execution synchronous or asynchronous from the caller's view?
  B7:
    verdict: first_class
    note: "Async event streaming from the runner, with an on_event_callback plugin hook and live/ bidirectional support."
    evidence: "src/google/adk/plugins/base_plugin.py:155 @ 85b52f6"
  # B8: Can in-flight work migrate between workers?
  B8:
    verdict: implicit
    note: "Sessions are backend-stored so any process can resume them, but there is no work distribution or migration mechanism."
    evidence: "src/google/adk/sessions/base_session_service.py @ 85b52f6"
  # B9: Can an agent survive a machine restart? Automatically, or with operator action?
  B9:
    verdict: first_class
    note: "ResumabilityConfig: resume an invocation from the last event if it paused or failed midway, best-effort, with at-least-once semantics once resumed."
    evidence: "src/google/adk/apps/_configs.py:29-47 @ 85b52f6"
  # B10: Classify: worker/queue, durable actor, attached harness, or in-process library.
  B10:
    verdict: first_class
    note: "hybrid: in-process agents with every stateful concern behind a pluggable service interface (in-memory for local, Vertex/GCP for production)."
    evidence: "src/google/adk/sessions/base_session_service.py @ 85b52f6"

  # --- C. Durability and failure semantics ---
  # C1: What state is durable, and what is lost on crash?
  C1:
    verdict: first_class
    note: "Sessions persist events and state through BaseSessionService, with SQLite, SQL, Firestore, Redis, Vertex and in-memory backends, plus schema migrations."
    evidence: "src/google/adk/sessions/migration/ @ 85b52f6"
  # C2: *When* is state persisted — every step, every tool call, on checkpoint, never?
  C2:
    verdict: first_class
    note: "Events are appended to the session as they occur; state mutations are applied through the session service."
    evidence: "src/google/adk/sessions/base_session_service.py @ 85b52f6"
  # C3: Checkpointing or event sourcing? Can state be rebuilt from a log?
  C3:
    verdict: implicit
    note: "Event-log-shaped: events are appended and rewind is applied logically via _apply_rewinds ('the single source of truth for which events are live'), but state is also stored as mutable JSON on the session row."
    evidence: "src/google/adk/events/_rewind_events.py @ 85b52f6; src/google/adk/sessions/schemas/v0.py:163-165"
  # C4: Retry semantics, and at what granularity: run, step, tool call?
  C4:
    verdict: first_class
    note: "_reflect_retry_model_plugin and reflect_retry_tool_plugin reflect on a failure and retry DIFFERENTLY rather than repeating the same call; _retry_options_utils covers eval retries."
    evidence: "src/google/adk/plugins/_reflect_retry_model_plugin.py @ 85b52f6"
  # C5: At-least-once or exactly-once? What do the docs claim versus what the code does?
  C5:
    verdict: first_class
    note: "Stated explicitly and precisely: 'we only guarantee an at-least-once behavior once resumed'. A platform naming its guarantee rather than implying exactly-once."
    evidence: "src/google/adk/apps/_configs.py:38-40 @ 85b52f6"
  # C6: Is there an idempotency model for tool side effects?
  C6:
    verdict: absent
    note: "No effect ledger or idempotency key - but the requirement is stated as a developer contract: 'Tool call to resume needs to be idempotent because we only guarantee an at-least-once behavior once resumed.' The clearest articulation of the hazard in the study, and it delegates the work rather than doing it."
    evidence: "src/google/adk/apps/_configs.py:38-40 @ 85b52f6"
  # C7: Process crash recovery: what resumes, and from where?
  C7:
    verdict: first_class
    note: "Resume from the last event, with rewind semantics resolving which events are live, and temp: state explicitly discarded on resumption."
    evidence: "src/google/adk/apps/_configs.py:33-42 @ 85b52f6; src/google/adk/events/_rewind_events.py"
  # C8: Node loss: is work re-dispatched, and how is it detected?
  C8:
    verdict: absent
    note: "No lost-worker or hung-invocation detection."
    evidence: "src/google/adk/runners.py @ 85b52f6"
  # C9: Context-window overflow: truncation, summarisation, or failure?
  C9:
    verdict: first_class
    note: "EventsCompactionConfig with a pluggable BaseEventsSummarizer and an llm_event_summarizer; apps/compaction.py performs it. Second project after AG2 to ship a compaction STRATEGY rather than only a hook."
    evidence: "src/google/adk/apps/compaction.py @ 85b52f6; src/google/adk/apps/_configs.py:49-60"
  # C10: Timers, scheduled execution, long sleeps — durable across restart?
  C10:
    verdict: absent
    note: "No timers or durable sleeps."
    evidence: "src/google/adk/runners.py @ 85b52f6"
  # C11: Human-in-the-loop pause and resume: durable, or in-memory only?
  C11:
    verdict: first_class
    note: "Long-running function calls pause an invocation, and resumability restores it from the last event - so an approval can outlive the process. Combined with before_tool_callback / after_tool_callback this is durable HITL, though as a pattern rather than a named Approval resource."
    evidence: "src/google/adk/apps/_configs.py:32-36 @ 85b52f6; src/google/adk/plugins/base_plugin.py:297,321"
  # C12: Can a definition be upgraded while runs are in flight? What happens to them?
  C12:
    verdict: implicit
    note: "Session storage schema is versioned with migrations (schemas/v0.py, v1.py) and telemetry schema is deployment-pinnable - so schema pinning is clearly understood - but nothing pins the AGENT definition to an in-flight invocation."
    evidence: "src/google/adk/sessions/schemas/ @ 85b52f6; src/google/adk/telemetry/_schema_version.py"

  # --- D. Agent identity and lifecycle ---
  # D1: Is an agent globally addressable? By what identifier?
  D1:
    verdict: implicit
    note: "Agents have a name used for transfer and tracing, but no id and no persisted identity record."
    evidence: "src/google/adk/agents/base_agent.py @ 85b52f6"
  # D2: Does identity survive process restart?
  D2:
    verdict: absent
    note: "No persisted agent identity."
    evidence: "src/google/adk/agents/ @ 85b52f6"
  # D3: Is identity distinct from runtime instance?
  D3:
    verdict: implicit
    note: "The agent class/config is the definition and the Invocation is the execution, but there is no Agent definition resource."
    evidence: "src/google/adk/agents/ @ 85b52f6"
  # D4: Are agents versioned? Immutable or mutable definitions?
  D4:
    verdict: absent
    note: "No agent versioning. Note the contrast: session STORAGE schema and TELEMETRY schema are both versioned, so the team versions what it owns - just not agents."
    evidence: "src/google/adk/sessions/schemas/ @ 85b52f6"
  # D5: Is there a registry or catalog?
  D5:
    verdict: implicit
    note: "auth_provider_registry, credential_exchanger_registry and credential_refresher_registry are real registries - but for credential providers, not agents."
    evidence: "src/google/adk/auth/auth_provider_registry.py @ 85b52f6"
  # D6: Can agents discover each other at runtime?
  D6:
    verdict: absent
    note: "No agent discovery beyond A2A agent cards at the interop edge."
    evidence: "src/google/adk/a2a/ @ 85b52f6"
  # D7: Can agents advertise capabilities? In what format?
  D7:
    verdict: absent
    note: "No declared capability metadata for agents or runtimes."
    evidence: "src/google/adk/agents/ @ 85b52f6"
  # D8: Is there an owner, team, or tenant on the agent record?
  D8:
    verdict: first_class
    note: "Everything is owned by (app_name, user_id): sessions, memory, artifacts, credentials, and app:/user: state scopes."
    evidence: "src/google/adk/sessions/schemas/v0.py:146-161 @ 85b52f6"
  # D9: Can an agent be suspended, revoked, or deprecated?
  D9:
    verdict: absent
    note: "No revocation or deprecation lifecycle for agents. TEN PROJECTS absent."
    evidence: "src/google/adk/agents/ @ 85b52f6"
  # D10: Is there anything resembling a declarative agent manifest?
  D10:
    verdict: implicit
    note: "Agents can be declared in config (agents can be built from YAML-ish config objects) and Apps carry declarative configuration, but there is no portable agent-image manifest of the Omnigent or Pydantic AI kind."
    evidence: "src/google/adk/apps/_configs.py @ 85b52f6"

  # --- E. Harness and runtime interoperability ---
  # E1: What is the minimum interface an agent implementation must satisfy?
  E1:
    verdict: first_class
    note: "THE MOST CONSISTENTLY APPLIED PATTERN IN THE STUDY, generalised beyond runtimes: BaseSessionService, BaseMemoryService, BaseArtifactService, BaseCredentialService, BaseCodeExecutor, BaseEvalService, BaseCredentialExchanger, BaseCredentialRefresher, BaseEventsSummarizer - each with an InMemory implementation AND a managed one, so the local path and the production path are the same code with a different injection."
    evidence: "src/google/adk/memory/base_memory_service.py @ 85b52f6; src/google/adk/sessions/base_session_service.py"
  # E2: Transport: stdin/stdout, HTTP, gRPC, WebSocket, in-process, ACP, A2A?
  E2:
    verdict: first_class
    note: "Code executors span container, GKE, Vertex AI, Agent Engine sandbox and model-native; A2A provides HTTP interop; MCP for tools."
    evidence: "src/google/adk/code_executors/ @ 85b52f6"
  # E3: Can it host a foreign agent (Claude Code, Codex, OpenHands, LangGraph, ADK)?
  E3:
    verdict: first_class
    note: "A2A agents can be wrapped as ADK agents (a2a/agent, a2a/converters, a2a/executor), and MCP tools are consumed - so third-party agents are reachable through the A2A protocol."
    evidence: "src/google/adk/a2a/ @ 85b52f6"
  # E4: Is there an event stream out of a running agent? What granularity?
  E4:
    verdict: first_class
    note: "Typed Event stream with an on_event_callback hook, plus four distinct error callbacks (on_model_error, on_tool_error, on_agent_error, on_run_error)."
    evidence: "src/google/adk/plugins/base_plugin.py:114-396 @ 85b52f6"
  # E5: Are tool calls externally observable, or internal to the agent?
  E5:
    verdict: first_class
    note: "before_tool_callback / after_tool_callback / on_tool_error_callback, plus auth_preprocessor injecting credentials into tool calls."
    evidence: "src/google/adk/plugins/base_plugin.py:297-348 @ 85b52f6"
  # E6: How is context injected at start?
  E6:
    verdict: first_class
    note: "App and agent configuration objects (ResumabilityConfig, EventsCompactionConfig) are declarative Pydantic models with extra='forbid'."
    evidence: "src/google/adk/apps/_configs.py:49-56 @ 85b52f6"
  # E7: Is cancellation supported? Cooperative or forced? Does it propagate to subagents?
  E7:
    verdict: absent
    note: "No cancellation model found for an in-flight invocation."
    evidence: "src/google/adk/runners.py @ 85b52f6"
  # E8: Can a run be checkpointed and restored by the platform, or only by the agent?
  E8:
    verdict: first_class
    note: "Resumability plus event rewind: an invocation resumes from the last event, and rewind_before_invocation_id logically drops a range of events with _apply_rewinds as the single source of truth."
    evidence: "src/google/adk/events/_rewind_events.py @ 85b52f6"
  # E9: Which of these would be hard to adapt, and why?
  E9:
    verdict: first_class
    note: "Abstract base classes with docstring contracts throughout, an AGENTS.md, llms.txt and llms-full.txt for machine consumption, and per-Python-version constraints files."
    evidence: "src/google/adk/memory/base_memory_service.py:43-49 @ 85b52f6; llms.txt"

  # --- F. Agent-to-agent communication ---
  # F1: Direct messages between agents?
  F1:
    verdict: absent
    note: "No durable agent-to-agent messaging. Coordination is through shared session State and LLM-driven transfer. AG2 remains the sole answer."
    evidence: "src/google/adk/agents/ @ 85b52f6"
  # F2: Channels, topics, or pub/sub?
  F2:
    verdict: absent
    note: "No channels or pub/sub between agents."
    evidence: "src/google/adk/agents/ @ 85b52f6"
  # F3: Task delegation as a distinct mechanism from messaging?
  F3:
    verdict: first_class
    note: "Agent transfer and agent-as-tool are first-class delegation mechanisms, with SequentialAgent / ParallelAgent / LoopAgent for structured composition."
    evidence: "src/google/adk/agents/ @ 85b52f6"
  # F4: Synchronous RPC between agents?
  F4:
    verdict: implicit
    note: "A2A gives RPC-shaped interop at the edge; internally an agent is called as a tool."
    evidence: "src/google/adk/a2a/executor/ @ 85b52f6"
  # F5: Asynchronous inbox or mailbox?
  F5:
    verdict: absent
    note: "No mailbox or inbox."
    evidence: "src/google/adk/agents/ @ 85b52f6"
  # F6: Is delivery durable? Survives restart of sender and receiver?
  F6:
    verdict: absent
    note: "No inter-agent delivery layer, so no delivery guarantees to state."
    evidence: "src/google/adk/agents/ @ 85b52f6"
  # F7: Is message ordering guaranteed? Per what scope?
  F7:
    verdict: first_class
    note: "Events are ordered within a session, and _apply_rewinds defines authoritatively which are live after a rewind."
    evidence: "src/google/adk/events/_rewind_events.py @ 85b52f6"
  # F8: Acknowledgement or delivery receipts?
  F8:
    verdict: absent
    note: "No inter-agent acknowledgement."
    evidence: "src/google/adk/agents/ @ 85b52f6"
  # F9: Correlation ids for request/response pairing?
  F9:
    verdict: first_class
    note: "invocation_id correlates events within a run, (app_name, user_id, session_id) scopes everything, and OTel spans carry gen_ai plus adk.* attributes."
    evidence: "src/google/adk/telemetry/_adk_attributes.py @ 85b52f6"
  # F10: Conversation threading?
  F10:
    verdict: first_class
    note: "Event REWIND is effectively a branch operation: rewind_before_invocation_id drops an invocation and everything after it, so history can be replayed differently from a chosen point."
    evidence: "src/google/adk/events/_rewind_events.py @ 85b52f6"
  # F11: Capability-based routing — address by what an agent *can do* rather than who it is?
  F11:
    verdict: implicit
    note: "LLM-driven transfer selects a sub-agent by description, which is capability-ish routing, but there is no declared capability index."
    evidence: "src/google/adk/agents/ @ 85b52f6"

  # --- G. Human-agent collaboration ---
  # G1: Is a human modelled as a special kind of agent, a distinct principal type, or not modelled?
  G1:
    verdict: absent
    note: "No principals. Notably ADK models CREDENTIALS the agent carries outward thoroughly and inbound authority not at all."
    evidence: "src/google/adk/auth/ @ 85b52f6"
  # G2: Shared rooms, channels, or workspaces?
  G2:
    verdict: implicit
    note: "App and (app_name, user_id) scoping delimit a workspace-like boundary, but there is no shared multi-human space."
    evidence: "src/google/adk/sessions/schemas/v0.py:146-161 @ 85b52f6"
  # G3: Task threads humans can read and post into?
  G3:
    verdict: first_class
    note: "A CLI with a dev UI, live/ bidirectional streaming, and event streams let a human drive and observe a running agent."
    evidence: "src/google/adk/cli/ @ 85b52f6"
  # G4: Mentions or directed addressing?
  G4:
    verdict: absent
    note: "No participant addressing."
    evidence: "src/google/adk/agents/ @ 85b52f6"
  # G5: Approval gates. Blocking or advisory? Durable while pending?
  G5:
    verdict: first_class
    note: "Long-running function calls pause the invocation until resolved, and resumability makes the pause durable - approval outlives the process. before_tool_callback can gate a call."
    evidence: "src/google/adk/apps/_configs.py:32-36 @ 85b52f6"
  # G6: Mid-run intervention: can a human redirect without restarting?
  G6:
    verdict: first_class
    note: "A human can resume a paused invocation, rewind to before an invocation, and gate tools via callbacks."
    evidence: "src/google/adk/events/_rewind_events.py @ 85b52f6"
  # G7: Agent status and presence visible to humans?
  G7:
    verdict: implicit
    note: "Events and plugin callbacks expose progress and errors, but there is no WAITING_FOR_HUMAN status field."
    evidence: "src/google/adk/plugins/base_plugin.py:155 @ 85b52f6"
  # G8: Notifications or escalation when an agent is blocked?
  G8:
    verdict: absent
    note: "No notification or escalation."
    evidence: "src/google/adk/ @ 85b52f6"
  # G9: Shared scratchpad or working surface?
  G9:
    verdict: first_class
    note: "Session State with app:/user:/temp:/session scopes is shared context, and artifacts are shared per session or per user."
    evidence: "src/google/adk/sessions/state.py:64-66 @ 85b52f6"
  # G10: Can a human see the context an agent is operating on?
  G10:
    verdict: first_class
    note: "Full event history, a sqlite_span_exporter for local trace inspection, a dev UI, and an evaluation package."
    evidence: "src/google/adk/telemetry/sqlite_span_exporter.py @ 85b52f6"

  # --- H. Context and memory ---
  # H1: Which of these exist as *separate* concepts: prompt context, working state, session history, ...
  H1:
    verdict: first_class
    note: "THE ONLY REAL MEMORY SERVICE IN THE STUDY. BaseMemoryService with add_session_to_memory, add_events_to_memory, add_memory and search_memory, scoped by (app_name, user_id). Implementations: in-memory, VERTEX AI MEMORY BANK, and VERTEX AI RAG. Verified live."
    evidence: "src/google/adk/memory/base_memory_service.py:43-140 @ 85b52f6; verified live against google-adk 2.7.1 (PyPI, 2026-08-26)"
  # H2: Who owns memory: agent, human, workspace, task, or tenant?
  H2:
    verdict: first_class
    note: "Memory is scoped by (app_name, user_id) on every call, and state has explicit app: and user: scopes - ownership is in the key."
    evidence: "src/google/adk/memory/base_memory_service.py:64-72 @ 85b52f6; src/google/adk/sessions/state.py:64-66"
  # H3: Can memory be shared between agents? At what granularity?
  H3:
    verdict: first_class
    note: "app: state is application-wide across users and sessions; user: state is per-user across sessions. Cross-session sharing is a declared scope rather than an accident."
    evidence: "src/google/adk/sessions/state.py:64-66 @ 85b52f6; verified live against google-adk 2.7.1 (PyPI, 2026-08-26)"
  # H4: Are there permissions on memory?
  H4:
    verdict: implicit
    note: "Scoping by (app_name, user_id) is enforced in the storage primary key, which prevents accidental cross-user reads - but there is no authorization check on the claimed user_id."
    evidence: "src/google/adk/sessions/schemas/v0.py:146-161 @ 85b52f6"
  # H5: Is provenance tracked — where a memory came from?
  H5:
    verdict: first_class
    note: "FIRST REAL MEMORY PROVENANCE: MemoryEntry carries author and timestamp, with the timestamp documented as 'when the original content of this memory happened' - event time, not storage time - plus an id and custom_metadata."
    evidence: "src/google/adk/memory/memory_entry.py:26-45 @ 85b52f6"
  # H6: Expiry, TTL, or forgetting?
  H6:
    verdict: implicit

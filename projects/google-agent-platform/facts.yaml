lessons:
  - "THE ONLY REAL MEMORY SERVICE IN THE STUDY, and it CONFIRMS rather than contradicts ADR-0008's claim that memory is not one thing: a BaseMemoryService for semantic recall (scoped (app_name, user_id), backed by Vertex Memory Bank or RAG) and SEPARATELY a four-scope state model (app:, user:, temp:, session). Adopt both the split and the prefix mechanism. MemoryEntry.author/timestamp gives the provenance our Knowledge node needs. (confirms ADR-0008 strongly)"
  - "SPLITS ADR-0007 in a way I had not considered: ADK has an excellent model of CREDENTIALS the agent carries outward (five typed schemes, OAuth2 exchange and refresh as separate registries, OIDC discovery, a pluggable credential service) and NO model of authority flowing inward (no principals, no authorization). Our ADR conflates these. A Principal model and a Credential model are different subsystems, and a system can have one without the other. (challenges ADR-0007)"
  - "The most consistent application of the adapter pattern in the study, generalised beyond runtimes: every stateful concern is a service interface with an in-memory implementation AND a managed one. The lesson for our adapter design is the in-memory sibling - if every pluggable interface ships a working local implementation, development and production are the same code path. (confirms ADR-0004 strongly)"
  - "Seven pluggable code executors (container, GKE, Vertex, Agent Engine sandbox, model-native, unsafe_local) - widest range in the study. But no egress guard, so ADK ships web-fetching tools with the SSRF hazard Pydantic AI closes. Our three-boundary sandbox needs all three: ADK has the process boundary, Pydantic AI has egress, Cloudflare argues storage. (confirms ADR-0009 strongly)"
  - "COMPLETES ADR-0010. Cloudflare: follow the conventions. Pydantic AI: version your adherence. ADK: separate stable from experimental into distinct modules, namespace what you own, declare that adk.experimental.* carries no compatibility guarantee, and let the DEPLOYMENT pin the telemetry schema version. Adopt all four. (confirms ADR-0010)"
  - "Invocation is pausable, resumable 'from the last event', and REWINDABLE. No separate Task, but rewind is a Run-level operation my model lacked: our Run should support a logical rewind marker rather than only forward progress. (amends ADR-0002)"
  - "States ADR-0014's requirement better than I did: 'Tool call to resume needs to be idempotent because we only guarantee an at-least-once behavior once resumed.' A platform naming its guarantee precisely and pushing the remainder to the developer. Our ADR should quote it, then explain why we take the obligation BACK - a platform that replays owns the hazard. (confirms ADR-0014)"
  - "Second independent convergence on tenancy-in-the-primary-key: StorageSession declares app_name, user_id and id all primary_key=True, exactly like Omnigent's workspace_id. Two projects reaching the same mechanism independently settles this for our design. (confirms J7 approach)"
  - "Best example in the study of the ADR-0012 fail-closed MESSAGE rule: an unsupported optional method raises NotImplementedError naming the fallback. Compare OpenHands' silent pause() no-op - same situation, opposite handling. (confirms ADR-0012)"
  - "TEN PROJECTS and nobody versions AND pins. ADK versions session storage schemas with migrations and makes telemetry schema pinnable, so this team plainly understands schema pinning - and still nothing pins the agent definition to an in-flight invocation. The consistency of this gap across projects that version other things carefully is now the strongest argument for ADR-0011 being a genuine differentiator. (confirms ADR-0011 negatively)"
  - "METHODOLOGICAL, and the third of its kind: Phase 1 triaged this class B on its README and package shape. It has the only memory service, the best credential subsystem, the only typed session state, the widest sandbox range, and the most careful telemetry structure. With AG2 (dismissed on a tally) and Pydantic AI (stale version), THREE of Phase 3's six passes found substantially more than recon predicted, and each time the error was trusting a cheap signal over the source."

adr_impact:
  - adr: ADR-0001
    effect: neutral
    note: "Agents are Python objects with a name; no identity, registry or lifecycle."
  - adr: ADR-0002
    effect: amends
    note: "Invocation is pausable, resumable from the last event, and REWINDABLE. Our Run needs a logical rewind marker."
  - adr: ADR-0003
    effect: confirms
    note: "No durable agent messaging; coordination via shared State. AG2 remains the sole precedent."
  - adr: ADR-0004
    effect: confirms
    note: "Most consistent application in the study, generalised to every stateful concern - each with an in-memory sibling."
  - adr: ADR-0005
    effect: confirms
    note: "MCP and OpenAPI tool generation as protocols, with no capability-claim model."
  - adr: ADR-0006
    effect: confirms
    note: "a2a/ is a converter-and-executor interop layer marked experimental, separate from the internal model. Second confirmation after AG2."
  - adr: ADR-0007
    effect: challenges
    note: "Splits the ADR: excellent outbound credential model, no inbound authority model. Principal and Credential are different subsystems."
  - adr: ADR-0008
    effect: confirms
    note: "The only real memory service, and it validates the claim: a memory SERVICE for recall plus four STATE scopes. Adopt both."
  - adr: ADR-0009
    effect: confirms
    note: "Seven pluggable code executors, widest in the study, with the unsafe one named unsafe_local. No egress guard though."
  - adr: ADR-0010
    effect: confirms
    note: "Completes the picture: stable vs experimental semconv modules, vendor namespace, no-guarantee marking, pinnable schema version."
  - adr: ADR-0011
    effect: confirms
    note: "Versions storage and telemetry schemas but not the agent definition. Ten projects, nobody versions AND pins."
  - adr: ADR-0012
    effect: confirms
    note: "Best example of the fail-closed message rule: NotImplementedError naming the fallback."
  - adr: ADR-0013
    effect: neutral
    note: "Sixteen plugin callbacks are real seams, but no policy decision object. Still no shadow mode after ten projects."
  - adr: ADR-0014
    effect: confirms
    note: "States the requirement precisely as a developer contract, naming the at-least-once guarantee."

    note: "An agent plus a runner plus a model is a small start, but the full model is large: App, Agent, Session, State scopes, MemoryService, ArtifactService, CredentialService, plugins, executors."
    evidence: "src/google/adk/runners.py @ 85b52f6"
  # R3: Is there a local dev loop? Hot reload?
  R3:
    verdict: first_class
    note: "Excellent: an InMemory implementation of every service, a CLI dev UI, a local sqlite span exporter, and per-Python-version constraints files for reproducible installs."
    evidence: "src/google/adk/cli/ @ 85b52f6; constraints-3.13.txt"
  # R4: How do you debug a stuck run?
  R4:
    verdict: first_class
    note: "Full event history, sixteen plugin callbacks, a debug_logging_plugin, a local sqlite span exporter, and a dev UI."
    evidence: "src/google/adk/plugins/debug_logging_plugin.py @ 85b52f6"
  # R5: Can an agent be unit tested? Is there a test harness?
  R5:
    verdict: first_class
    note: "In-memory services make every path testable without infrastructure, plus a whole evaluation package (BaseEvalService, eval sets, agent_evaluator, scenario generation)."
    evidence: "src/google/adk/evaluation/ @ 85b52f6"
  # R6: Deployment story?
  R6:
    verdict: first_class
    note: "Agent Engine, Cloud Run, GKE or self-hosted, with a deploy path in the CLI."
    evidence: "src/google/adk/cli/ @ 85b52f6"
  # R7: CLI ergonomics — try the equivalent of `init`, `agent add`, `run`.
  R7:
    verdict: first_class
    note: "A real CLI with run, eval, web/dev UI and deploy subcommands."
    evidence: "src/google/adk/cli/ @ 85b52f6"

  # --- S. Hard scenarios ---
  # S1: Delegated authority
  S1:
    verdict: inferable
    note: "The strongest CREDENTIAL story in the study - five typed kinds, OAuth2 exchange and refresh as separate registries, OIDC discovery, a pluggable credential service - but no agent principal, so the agent acts WITH credentials rather than AS an identity. Omnigent's RFC 8628 remains the only first_class answer."
    evidence: "src/google/adk/auth/ @ 85b52f6"
  # S2: Torn side effect
  S2:
    verdict: inferable
    note: "No effect ledger, but the hazard is stated as a developer contract with the guarantee named: 'Tool call to resume needs to be idempotent because we only guarantee an at-least-once behavior once resumed.' The clearest articulation in the study - and it delegates the work rather than doing it."
    evidence: "src/google/adk/apps/_configs.py:38-40 @ 85b52f6"
  # S3: Upgrade mid-flight
  S3:
    verdict: inferable
    note: "Session storage schema is versioned with migrations and telemetry schema is deployment-pinnable, so this team understands schema pinning - yet nothing pins the agent definition to an in-flight invocation. Ten projects, still nobody versions AND pins."
    evidence: "src/google/adk/sessions/schemas/ @ 85b52f6; src/google/adk/telemetry/_schema_version.py"
  # S4: Concurrent memory write
  S4:
    verdict: inferable
    note: "Best answer in the study, by DECOMPOSITION rather than locking: app: / user: / temp: / session scopes separate what is shared from what is not, and unprefixed session state is validated against a declared Pydantic schema so a stray or mistyped key raises StateSchemaError. Reduces the surface where conflict can occur rather than resolving conflicts."
    evidence: "src/google/adk/sessions/state.py:24-46,64-66 @ 85b52f6"
  # S5: Cancellation tree
  S5:
    verdict: undefined
    note: "No cancellation model found."
    evidence: "src/google/adk/runners.py @ 85b52f6"
  # S6: Silent context loss
  S6:
    verdict: first_class_answer
    note: "TWO EXPLICIT MECHANISMS. EventsCompactionConfig with a pluggable BaseEventsSummarizer performs compaction deliberately, and event REWIND makes history reduction first-class and inspectable, with _apply_rewinds documented as 'the single source of truth for which events are live after rewinds'. Context loss is a modelled operation rather than a side effect."
    evidence: "src/google/adk/apps/compaction.py @ 85b52f6; src/google/adk/events/_rewind_events.py"
  # S7: Poison message
  S7:
    verdict: inferable
    note: "Reflect-and-retry plugins consume the error and retry DIFFERENTLY rather than repeating the same call, and four distinct error callbacks let a plugin classify failures. No dead-letter or quarantine."
    evidence: "src/google/adk/plugins/_reflect_retry_model_plugin.py @ 85b52f6"
  # S8: Tenant leak
  S8:
    verdict: first_class_answer
    note: "ENFORCED IN THE SCHEMA, which I checked rather than assumed: StorageSession declares app_name, user_id and id all primary_key=True (sessions/schemas/v0.py:146-161), so a query that omits or mistakes the scope finds nothing. Second independent convergence on tenancy-in-the-primary-key after Omnigent. Caveat: nothing authorizes the caller's claim to a user_id, so this prevents accidental leaks, not deliberate impersonation."
    evidence: "src/google/adk/sessions/schemas/v0.py:146-161 @ 85b52f6"
  # S9: Runaway spend
  S9:
    verdict: undefined
    note: "Token usage is measured; nothing enforces a budget."
    evidence: "src/google/adk/telemetry/_token_usage.py @ 85b52f6"
  # S10: Zombie sandbox
  S10:
    verdict: undefined
    note: "Code executors are pluggable but sandbox lifecycle reaping is the backend's concern."
    evidence: "src/google/adk/code_executors/ @ 85b52f6"

object_model: |
  App                          is_resumable, compaction config, plugins
   `-- Agent (BaseAgent)       LlmAgent | Sequential | Parallel | Loop
        `-- Invocation         one run; resumable, rewindable
             `-- Event         actions{rewind_before_invocation_id, ...}

  Session                      (app_name, user_id, session_id)
   |-- State                   FOUR SCOPES by key prefix:
   |    |-- "app:"             application-wide
   |    |-- "user:"            per-user, cross-session
   |    |-- "temp:"            NEVER persisted (filtered by every backend)
   |    `-- (unprefixed)       session-scoped, schema-VALIDATED
   `-- Event[]                 the transcript

  MemoryEntry                  content, author, timestamp, id, custom_metadata
  AuthCredential               apiKey | http | oauth2 | openIdConnect
                               | serviceAccount
  Artifact                     versioned, per-session or per-user

strongest_ideas:
  - "Every stateful concern behind an abstract base class WITH an in-memory implementation, so the local development path and the production path are the same code with a different service injected - not a mock, not a separate mode."
  - "Four state scopes by key prefix (app:, user:, temp:, unprefixed session), with temp: filtered out independently by every persistence backend."
  - "Unprefixed session state validated against a declared Pydantic schema, raising StateSchemaError on an undeclared or mistyped key - while prefixed namespaces are deliberately exempt. The scoped namespaces are open, the session's own contract is closed."
  - "MemoryEntry records author and timestamp, with the timestamp documented as 'when the original content of this memory happened' - event time, not storage time."
  - "Credential EXCHANGE and REFRESH as separate registries behind separate interfaces: obtaining a credential and keeping it alive are different problems with different failure modes."
  - "An optional interface method whose NotImplementedError names the fallback: 'This memory service does not support adding event deltas. Call add_session_to_memory(session) to ingest the full session.'"
  - "custom_metadata as a documented staging area: 'Prefer this for service-specific fields (e.g., TTL) that may later become first-class API parameters.'"
  - "Stating the idempotency requirement as a developer contract with the guarantee named: 'Tool call to resume needs to be idempotent because we only guarantee an at-least-once behavior once resumed.'"
  - "Marking non-durable state IN THE KEY (temp:), so 'any temporary / in-memory state will be lost upon resumption' is visible at the point of use."
  - "Event rewind with a single documented source of truth: rewind_before_invocation_id drops a range, and _apply_rewinds is 'the single source of truth for which events are live'."
  - "Naming the dangerous executor unsafe_local_code_executor, so it cannot be chosen without reading the word 'unsafe'."
  - "Telemetry stability tiers as SEPARATE MODULES: _stable_semconv, _experimental_semconv, and _adk_attributes for vendor-owned names."
  - "adk.experimental.* attributes explicitly declaring 'no compatibility guarantee: an attribute may be renamed, restructured, or removed in any release'."
  - "A deployment-pinnable telemetry schema version, so consumers pin while producers evolve."
  - "An allow-listed unpickler for session state, treating deserialization as an attack surface."
  - "Tenancy enforced in the composite primary key (app_name, user_id, id) - the same mechanism as Omnigent's workspace_id, arrived at independently."
  - "Reflect-and-retry rather than retry-identically: consume the error and change the next attempt."
  - "Sixteen named lifecycle hooks including four distinct error callbacks (model, tool, agent, run)."
  - "Per-Python-version constraints files (3.10 through 3.14) for reproducible installs."
  - "A credential service backed by session state, so credentials follow the conversation rather than requiring separate infrastructure."
  - "Six managed services, every one behind an interface with a working local implementation - open core without withholding anything needed to build or test."

weakest_choices:
  - "No agent identity, registry, versioning or revocation - despite versioning session storage schemas AND telemetry schemas carefully."
  - "No principals, authorization model or policy engine: outbound credentials are excellent, inbound authority is unmodelled. Storage-layer scoping prevents accidental cross-tenant reads but nothing authorizes the claimed user_id."
  - "Idempotency delegated entirely to tool authors, honestly but completely - asking every tool author to solve a distributed-systems problem correctly."
  - "No durable agent-to-agent messaging."
  - "No cancellation model at all."
  - "NO EGRESS CONTROL, and ADK ships web-fetching tools - the SSRF and cloud-credential hazard Pydantic AI closes is open here."
  - "No quotas or cost enforcement; token usage is measured only."
  - "Large shipped surface including labs/, features/, optimization/ and @experimental markers."
  - "State is a mutable JSON column while events are appended - a hybrid that makes 'what is authoritative' less crisp than a pure log."


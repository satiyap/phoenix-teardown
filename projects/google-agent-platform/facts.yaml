    decision: ADOPT_AS_STANDARD
    note: "Local and production paths become the same code."
  - component: "Four state scopes (app:/user:/temp:/session)"
    decision: ADOPT_AS_STANDARD
    note: "The concrete mechanism ADR-0008 was missing."
  - component: "temp: filtered by every backend"
    decision: ADOPT_AS_STANDARD
    note: "Non-durable state marked at the point of use."
  - component: "Schema-validated session state"
    decision: ADOPT_AS_STANDARD
    note: "Only typed session state in the study."
  - component: "MemoryEntry{author, timestamp} with event-time semantics"
    decision: ADOPT_AS_STANDARD
    note: "First real memory provenance."
  - component: "Credential exchange / refresh split"
    decision: ADOPT_AS_STANDARD
    note: "Two problems, two interfaces, two registries."
  - component: "Optional method whose error names the fallback"
    decision: ADOPT_AS_STANDARD
    note: "Correct form of the ADR-0012 fail-closed message."
  - component: "custom_metadata as declared staging area"
    decision: REUSE
    note: "Honest extension point with a stated migration path."
  - component: "Idempotency stated as a contract, with the guarantee named"
    decision: ADOPT_AS_STANDARD
    note: "Quote it in ADR-0014, then take the obligation back."
  - component: "Event rewind + single source of truth"
    decision: REUSE
    note: "Logical history reduction over an append-only store."
  - component: "unsafe_local naming"
    decision: ADOPT_AS_STANDARD
    note: "Make the unsafe path visible rather than convenient."
  - component: "Telemetry stability tiers as separate modules"
    decision: ADOPT_AS_STANDARD
    note: "Completes ADR-0010 alongside Cloudflare and Pydantic AI."
  - component: "Pinnable telemetry schema version"
    decision: ADOPT_AS_STANDARD
    note: "Consumers pin, producers evolve."
  - component: "Tenancy in the composite primary key"
    decision: ADOPT_AS_STANDARD
    note: "Second independent convergence; settles the question."
  - component: "Allow-listed unpickler"
    decision: REUSE
    note: "Session state deserialization is an attack surface."
  - component: "Reflect-and-retry"

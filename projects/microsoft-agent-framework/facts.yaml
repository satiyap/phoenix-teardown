object_model: |
  Agent                        with hooks, middleware, skills, tools
  Session                      _sessions.py
  Workflow                     built via WorkflowBuilder
   |-- Executor                a node (agent, function, or nested workflow)
   |-- EdgeGroup               typed topology:
   |    |-- SingleEdgeGroup
   |    |-- FanOutEdgeGroup
   |    |-- FanInEdgeGroup
   |    `-- SwitchCaseEdgeGroup  (+ Case, + Default)
   |-- superstep               Pregel iteration; checkpoint boundary
   `-- RequestInfo             HITL request/response mid-workflow

  WorkflowCheckpoint           (verified live)
    workflow_name
    graph_signature_hash       <- hash of the workflow CODE; checked on restore
    checkpoint_id
    previous_checkpoint_id     <- chain, so checkpoints form a history
    timestamp
    messages                   messages exchanged between executors
    state                      committed only; pending changes excluded
    pending_request_info_events   unanswered HITL requests survive
    iteration_count            superstep boundary (NOT unique per lifecycle)
    metadata
    version

  DeclarativeAgent (YAML)      kind, name, instructions, model, tools[]
                               with approvalMode + allowedTools

strongest_ideas:
  - "graph_signature_hash stamped on every checkpoint and ENFORCED on restore - the only working version-and-pin in thirteen projects."
  - "Deriving the version from a BYTECODE DIGEST (sha256 of __code__.co_code plus sorted co_names, mixed with workflow name and step names), so there is no version to forget to bump and no drift between the recorded version and the actual code."
  - "Explaining WHY the bytecode digest is needed: it catches body changes that step-name discovery misses, e.g. steps referenced via attribute access (my_steps.fetch)."
  - "A canonical JSON digest (sort_keys, tight separators) so the hash is reproducible across runs and machines."
  - "Binding a checkpoint to a workflow DEFINITION rather than an instance, so checkpoints are portable across instances of the same definition - a property I had not thought to want."
  - "previous_checkpoint_id chaining checkpoints into a history rather than keeping only a latest."
  - "Checkpointing ONLY COMMITTED STATE - 'pending state changes are not included' - so a checkpoint can never capture a half-applied mutation."
  - "pending_request_info_events stored IN the checkpoint, so an unanswered human request survives a restart without a separate approval store."
  - "Documenting that iteration_count is NOT unique across a lifecycle, with the concrete case that breaks the assumption (a run pausing at IDLE_WITH_PENDING_REQUESTS)."
  - "Typed edge groups - Single, FanOut, FanIn, SwitchCase with explicit Case and Default - making topology DECLARED rather than emergent control flow."
  - "EdgeGroup.register() so custom topologies are first-class rather than forks."
  - "Graph validation before execution (_validation.py) and graph visualisation (_viz.py) - both only possible because topology is data."
  - "WorkflowExecutor: a workflow is itself a node, giving composable nesting without inventing a second abstraction."
  - "IDLE_WITH_PENDING_REQUESTS as a named state - HumanLayer's waiting_input, reached independently."
  - "BIDIRECTIONAL content policy (Purview): blocking at both prompt ingress and response egress, against a centrally managed DLP policy the agent author cannot edit or bypass."
  - "Auditing into an existing enterprise compliance system (Audit, Communication Compliance, Insider Risk, eDiscovery, Data Lifecycle) rather than a bespoke log."
  - "_feature_stage.py - an explicit feature-stability marker in code, the same instinct as ADK putting stability in the module path."
  - "Declarative agent manifests carrying approvalMode and allowedTools, so tool scoping and approval policy are part of the DECLARED agent rather than runtime configuration."
  - "=Env. expressions in manifests for deployment-time values."

weakest_choices:
  - "No agent identity, version or revocation - while versioning WORKFLOWS with real rigour. The same asymmetry as ADK (which versions storage and telemetry schemas but not agents)."
  - "No agent-to-agent messaging outside a workflow graph: no mailbox, no addressing, no independent delivery guarantee."
  - "Enormous surface: 35 Python packages plus .NET and Go trees, with lab/ and monty/ shipped alongside stable code."
  - "agent-framework-purview requires an Azure Purview subscription, so the best governance story is not independently usable."
  - "A bytecode hash is brittle in the SAFE direction - a comment-only edit that changes bytecode invalidates checkpoints. Correct default, but it needs an escape hatch for deliberate compatible changes and I found none."
  - "No compensation or rollback."

reusable_components:
  - component: "graph_signature_hash pinned on the checkpoint, enforced on restore"
    decision: ADOPT_AS_STANDARD
    note: "The only working precedent for ADR-0011 in thirteen projects."
  - component: "Version derived from a code digest, not a manual counter"
    decision: ADOPT_AS_STANDARD
    note: "Removes the 'forgot to bump' failure that defeats Omnigent."
  - component: "Canonical JSON digest for hash stability"
    decision: REUSE
    note: "A pin must be reproducible across machines."
  - component: "Checkpoint bound to a definition, not an instance"

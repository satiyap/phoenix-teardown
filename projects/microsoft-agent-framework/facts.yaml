  - component: "35-package provider surface"
    decision: BUILD
    note: "Reject as a scope model."

lessons:
  - "THE FIRST AND ONLY PRECEDENT FOR ADR-0011, and it is better than my design. Thirteen projects: AX pins adapter identity without versions, Omnigent versions agents without pinning, ADK versions storage and telemetry schemas but not agents, Cloudflare versions its schema but leaves snapshots unversioned. MAF does the whole thing - graph_signature_hash computed from the workflow's BYTECODE, stamped on the checkpoint, compared on restore, raising with a message naming the likely cause. Deriving the version from code removes the manual-bump failure mode entirely. AMEND ADR-0011 to derive pins from content digests wherever possible. (confirms ADR-0011)"
  - "A GENUINELY DIFFERENT ANSWER TO ADR-0003 from AG2's. Messages between executors are part of the workflow checkpoint, so intra-graph agent messaging is durable BECAUSE THE WORKFLOW IS; AG2's envelope is durable independently of any orchestration. The amendment: if all agent interaction happens inside an orchestration we already checkpoint, message durability is FREE - a cheaper v0.1 option, at the cost of agents that cannot talk outside a graph. (amends ADR-0003)"
  - "Purview adds an axis Omnigent's per-phase model lacks: policy at INGRESS AND EGRESS of the model call, evaluated against a CENTRALLY MANAGED policy the agent author cannot edit. Omnigent answers WHERE in the enforcement path to fail closed; Purview answers WHO OWNS THE RULE. Our policy model needs explicit precedence - organisation policies bind agent policies and an agent cannot weaken one. (amends ADR-0013)"
  - "MOST COMPLETE WORKFLOW ENGINE IN THE STUDY, and the first declarative fan-out/fan-in: typed EdgeGroups, Pregel supersteps, graph validation before execution, graph visualisation, and workflow-as-executor nesting. Confirms that keeping orchestration separate from agent authoring pays off - a graph you can check and draw is only possible when topology is data. (confirms L10)"
  - "IDLE_WITH_PENDING_REQUESTS is HumanLayer's waiting_input reached independently, and the note that iteration_count is not unique per boundary is a precision our Run model needs: a checkpoint marks a boundary, and a boundary can carry several checkpoints. (confirms ADR-0002)"
  - "pending_request_info_events inside the checkpoint means an unanswered human request survives a restart by virtue of the checkpoint - a second route to ADR-0015 rule 1 alongside HumanLayer's reconciler. (confirms ADR-0015)"
  - "FIFTH independent instance of A2A/AG-UI as edge packages beside a different internal model. Settled beyond doubt. (confirms ADR-0006)"
  - "Checkpointing only COMMITTED state is the effect-ledger instinct at state granularity: never persist a half-applied mutation. (confirms ADR-0014 weakly)"
  - "SCOPE NOTE: this was a targeted pass and 52 probes are recorded unknown rather than absent because I did not read those subsystems. With a 75MB three-language repo that discipline matters more than usual - it would have been easy to record absences I never checked."


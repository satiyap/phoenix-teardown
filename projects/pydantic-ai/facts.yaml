probes:

  # --- A. Core abstraction and object model ---
  # A1: What does this system think an agent *is*? State it in one sentence, in their vocabulary.
  A1:
    verdict: implicit
    note: "Agent[DepsT, OutputT] is a typed Python object, not a persisted resource. Identity is the variable that holds it."
    evidence: "pydantic_ai_slim/pydantic_ai/agent/ @ b48ee38"
  # A2: What is the root resource — the thing everything else hangs off?
  A2:
    verdict: absent
    note: "No session or conversation resource; message history is a value the caller passes in and gets back."
    evidence: "pydantic_ai_slim/pydantic_ai/_history_processor.py @ b48ee38"
  # A3: Is `Agent` persistent or ephemeral? Can it exist while not executing?
  A3:
    verdict: absent
    note: "Nothing persists between runs unless the caller or a durable engine persists it."
    evidence: "pydantic_ai_slim/pydantic_ai/durable_exec/ @ b48ee38"
  # A4: Is `Task` a separate resource from `Run`? If not, which concept is missing and what fills the...
  A4:
    verdict: absent
    note: "No Task or Run resource. A run is a function call; under a durable engine the ENGINE's workflow is the durable run - itself an argument that Run belongs to whoever owns durability."
    evidence: "pydantic_ai_slim/pydantic_ai/durable_exec/_base.py @ b48ee38"
  # A5: What is a `Session` attached to: user, agent, task, or execution?
  A5:
    verdict: absent
    note: "No session model."
    evidence: "pydantic_ai_slim/pydantic_ai/agent/ @ b48ee38"
  # A6: Are messages first-class durable resources, or transient function arguments?
  A6:
    verdict: implicit
    note: "Typed message parts (TextPart, ToolCallPart, ToolReturn, RetryPromptPart) are values, not durable resources."
    evidence: "pydantic_ai_slim/pydantic_ai/_deferred.py:20-24 @ b48ee38"
  # A7: Are artifacts (files, outputs, deliverables) first-class?
  A7:
    verdict: absent
    note: "No artifact resource."
    evidence: "pydantic_ai_slim/pydantic_ai/ @ b48ee38"
  # A8: Can multiple agents participate in one task? How is that represented?
  A8:
    verdict: absent

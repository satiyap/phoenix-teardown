  A9:
    verdict: implicit
    note: "Agent[DepsT, OutputT] > {Capability (63 exported, ordered), Toolset, Model, RunContext, DeferredToolRequests{calls, approvals, metadata}}; pydantic_graph and pydantic_evals as separate packages. Deliberately thin - a library, not a platform."
    evidence: "pydantic_ai_slim/pydantic_ai/capabilities/__init__.py @ b48ee38; verified live against pydantic_ai 2.35.0 (PyPI, 2026-08-26)"


    note: "No lost-worker detection in the library; the engine owns it."
    evidence: "pydantic_ai_slim/pydantic_ai/durable_exec/ @ b48ee38"
  # C9: Context-window overflow: truncation, summarisation, or failure?
  C9:
    verdict: implicit
    note: "_history_processor.py and a ProcessHistory capability allow message-history transformation, which is where compaction would live, but no compaction strategy ships (contrast AG2's CompactStrategy plus four policies)."
    evidence: "pydantic_ai_slim/pydantic_ai/_history_processor.py @ b48ee38"
  # C10: Timers, scheduled execution, long sleeps — durable across restart?
  C10:
    verdict: absent
    note: "No timers or sleeps; the durable engine provides them."
    evidence: "pydantic_ai_slim/pydantic_ai/durable_exec/ @ b48ee38"
  # C11: Human-in-the-loop pause and resume: durable, or in-memory only?
  C11:
    verdict: first_class
    note: "HITL AS A TYPED OUTPUT: DeferredToolRequests{calls, approvals, metadata} is returned as the run's output when the model calls a deferred tool, and DeferredToolResults (matched by tool_call_id) feeds the next run. Pending state is the CALLER's value, so durability is free at that scale. Alternatively HandleDeferredToolCalls resolves inline, and a handler may decline (return None) so the next handler in the chain tries and unhandled calls bubble up as output."
    evidence: "pydantic_ai_slim/pydantic_ai/_deferred.py:27-61 @ b48ee38; docs/capabilities/handle-deferred-tool-calls.md; verified live against pydantic_ai 2.35.0 (PyPI, 2026-08-26)"
  # C12: Can a definition be upgraded while runs are in flight? What happens to them?
  C12:
    verdict: implicit
    note: "No agent version, but the durable boundary forces the adjacent discipline: an unserializable Model crosses as a model_id resolved by registry. Agent Specs are declarative and could be versioned, but nothing pins a spec to an in-flight run."
    evidence: "pydantic_ai_slim/pydantic_ai/durable_exec/_base.py:38-45 @ b48ee38; docs/agent-spec.md"


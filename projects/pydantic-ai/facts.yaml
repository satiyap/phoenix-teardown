  # B1: Does the platform launch agents, host them, or attach to external ones?
  B1:
    verdict: implicit
    note: "In-process: agent.run() executes a graph inside the caller's process. Under a durable engine the same agent runs inside a Temporal workflow, DBOS step or Prefect flow."

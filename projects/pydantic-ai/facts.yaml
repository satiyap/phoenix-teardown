  # S3: Upgrade mid-flight
  S3:
    verdict: inferable
    note: "No agent version, but the durable boundary forces the same discipline our pin needs: an unserializable Model crosses as a model_id string resolved through a registry on the far side. A pin should be an identifier plus a resolver, never a serialized object."
    evidence: "pydantic_ai_slim/pydantic_ai/durable_exec/_base.py:38-45 @ b48ee38"
  # S4: Concurrent memory write
  S4:
    verdict: undefined
    note: "No memory store."
    evidence: "pydantic_ai_slim/pydantic_ai/ @ b48ee38"
  # S5: Cancellation tree
  S5:
    verdict: first_class_answer
    note: "Not tree propagation, but something no other project does: it REFUSES a same-process cancellation token at a durable boundary with an error explaining the mechanism and naming the alternative - 'it is a same-process handle and cannot cross the durable execution boundary. Cancel the durable workflow or flow instead.' Recognising that a cancellation primitive is scope-bound, and failing at configuration time rather than with a serialization error at runtime."
    evidence: "pydantic_ai_slim/pydantic_ai/durable_exec/_runtime_toolsets.py:38-49 @ b48ee38"
  # S6: Silent context loss
  S6:
    verdict: undefined
    note: "ProcessHistory allows history transformation, but no compaction strategy ships and no loss signal is emitted."
    evidence: "pydantic_ai_slim/pydantic_ai/_history_processor.py @ b48ee38"
  # S7: Poison message
  S7:
    verdict: undefined
    note: "No queue; poison handling is delegated to the durable engine."
    evidence: "pydantic_ai_slim/pydantic_ai/durable_exec/ @ b48ee38"
  # S8: Tenant leak
  S8:
    verdict: undefined
    note: "No tenancy."
    evidence: "pydantic_ai_slim/pydantic_ai/ @ b48ee38"
  # S9: Runaway spend
  S9:
    verdict: inferable
    note: "UsageLimits caps requests and tokens per run, and cost is calculated accurately from the maintained genai-prices dataset with a warning when pricing fails - but it MEASURES rather than ENFORCES. No budget gate stops a run mid-flight on spend."
    evidence: "pydantic_ai_slim/pydantic_ai/usage.py @ b48ee38; pydantic_ai_slim/pydantic_ai/_cost.py:1-27"
  # S10: Zombie sandbox
  S10:
    verdict: undefined
    note: "No sandbox or compute lifecycle."
    evidence: "pydantic_ai_slim/pydantic_ai/ @ b48ee38"

object_model: |
  Agent[DepsT, OutputT]        typed agent; output_type drives validation
   |-- Capability              63 exported; composable, ORDERED
   |    `-- CapabilityPosition  Literal['outermost', 'innermost']
   |-- Toolset                 FunctionToolset | MCPToolset | DynamicToolset
   |-- Model                   provider abstraction; resolved by model_id
   |-- RunContext[DepsT]       deps + usage + run state
   `-- DeferredToolRequests    HITL / external work, as an OUTPUT TYPE
        |-- calls              tool calls needing external execution
        |-- approvals          tool calls needing human approval
        `-- metadata           keyed by tool_call_id

  AgentSpec                    declarative YAML/JSON: model, instructions,
                               settings, capabilities. Agent.from_file(...)
  pydantic_graph               separate package: graph execution
  pydantic_evals               separate package: datasets, evaluators, online

strongest_ideas:
  - "Cloud credential endpoints blocked even when the local-access escape hatch is open: 'always blocked, even with allow_local=True'. An escape hatch deliberately scoped so it cannot open the worst hole."
  - "A per-provider enumerated metadata blocklist including AWS ECS task IAM role credentials, AWS EKS Pod Identity, and Azure WireServer - a PUBLIC IP that no private-range check would catch."
  - "Teredo obfuscated-address decoding as an SSRF bypass defence: 'the raw low-32 bytes are meaningless, so it needs its own decode'."
  - "Decompression-bomb defence by restricting Accept-Encoding to what can be size-limited while streaming, and rejecting other encodings even if a server returns them."
  - "VERSIONED OTel semantic-convention adherence: pinned to GenAI semconv 1.37.0 with versions 2-4 as deprecated compatibility formats that emit a warning, so a telemetry pipeline gets a migration path instead of a break."
  - "OTel message-part types pinned to a specific spec commit for traceability."
  - "Refusing an impossible composition at CONFIGURATION time with an error that explains the mechanism and names the alternative: 'cancellation_token cannot be used with {engine} durable execution because it is a same-process handle... Cancel the durable workflow or flow instead.'"
  - "HITL as a typed OUTPUT (DeferredToolRequests), making pending state the caller's value and therefore durable for free."
  - "A HandleDeferredToolCalls handler chain where a handler may DECLINE (return None) so the next one tries, and unhandled calls bubble up as output - policy auto-approves what it recognises, humans see the rest."
  - "Explicit, load-bearing composition order: CapabilityPosition ('outermost' | 'innermost'), CapabilityOrdering, CombinedCapability, with a written warning to check interactions with adjacent capabilities."
  - "Every interception point has a named type - seven Wrap*Handler types - so a capability author knows exactly what can be hooked and what shape it has."
  - "NativeOrLocalTool: one capability that resolves to a provider-native implementation where it exists and a local one otherwise."
  - "Treating durable engines as 'first-class compatibility targets, not peripheral adapters', with their own guidelines and workflow-level tests."
  - "Crossing a serialization boundary with an IDENTIFIER, not an object: a Model cannot be serialized, so a model_id string crosses and is resolved through a registry on the far side."
  - "A project rule that new features must not break serializability, checked against durable execution and agent specs."
  - "Cost from a separately maintained pricing dataset (genai-prices) rather than a hardcoded table, with an explicit warning when calculation fails and a preload to keep the snapshot load off the event loop."
  - "A shared spec system (NamedSpec) reused by both the evaluator and capability systems."
  - "Agent Specs: declarative YAML/JSON agents including their capabilities, so non-developers can configure agents and definitions live alongside other config."
  - "Evaluation as a first-class package (pydantic_evals) with datasets, evaluators, online evaluation and OTel emission."
  - "Per-package AGENTS.md files stating the design rules for that directory."

weakest_choices:
  - "No durability of its own, so every durability property depends on adopting Temporal, DBOS or Prefect. Correct for a library, insufficient for a platform."
  - "No agent identity, registry, versioning or revocation."
  - "No principals, authentication, authorization, policy engine or tenancy."
  - "No agent-to-agent messaging."
  - "HITL works only while the caller holds the value, unless a durable engine persists it."
  - "No memory or compaction, only a history-processing hook."
  - "Cost is measured accurately but never enforced - no budget gate."
  - "63 capabilities is a large surface for a composition system whose ordering is load-bearing; the guidelines acknowledge the interaction risk."
  - "No process isolation at all; the SSRF guard covers egress but tools run in-process."

reusable_components:
  - component: "_ssrf.py guard list and reasoning"
    decision: REUSE
    note: "Most security-aware code in the study; the threat applies to us too."
  - component: "Escape hatch that cannot open the worst hole"
    decision: ADOPT_AS_STANDARD
    note: "allow_local never grants credential-endpoint access."
  - component: "Restricted Accept-Encoding for bounded downloads"
    decision: ADOPT_AS_STANDARD
    note: "Decompression-bomb defence."
  - component: "Versioned semconv adherence with a deprecation window"
    decision: ADOPT_AS_STANDARD
    note: "Amends ADR-0010: telemetry consumers are downstream dependencies."
  - component: "Pinning message types to a spec commit"
    decision: REUSE
    note: "Makes convention drift traceable."
  - component: "Refuse impossible composition at config time, with reason and alternative"
    decision: ADOPT_AS_STANDARD
    note: "Best fail-closed error message in the study."
  - component: "HITL as a typed output"
    decision: REUSE
    note: "Free durability at small scale; caller owns pending state."
  - component: "Handler chain with decline-and-fallthrough"
    decision: ADOPT_AS_STANDARD
    note: "Policy handles what it recognises, humans get the remainder."
  - component: "Explicit composition position and ordering"
    decision: ADOPT_AS_STANDARD
    note: "Ordering must be declared, not discovered by debugging."
  - component: "Named types for every wrap point"
    decision: REUSE
    note: "Makes extension points discoverable and typed."
  - component: "NativeOrLocalTool resolution"
    decision: ADOPT_AS_STANDARD
    note: "Correct abstraction for provider-native features."
  - component: "Identifier-not-object across a boundary"
    decision: ADOPT_AS_STANDARD
    note: "Reinforces ADR-0011: a pin is an identifier plus a resolver."
  - component: "Serializability as a project rule"
    decision: ADOPT_AS_STANDARD
    note: "Our capabilities and specs cross a network boundary."
  - component: "genai-prices external pricing dataset"
    decision: INTEGRATE
    note: "Cost data is a maintenance burden worth outsourcing."
  - component: "Durable engines as compatibility targets"
    decision: REUSE
    note: "Direct ADR-0004 / L10 evidence."
  - component: "Declarative agent specs including capabilities"
    decision: REUSE
    note: "D10 answer; a declared agent carries its declared extensions."
  - component: "Per-package AGENTS.md design rules"
    decision: REUSE
    note: "Keeps a large surface coherent."
  - component: "Library-owned durability (i.e. none)"
    decision: BUILD
    note: "Reject; a platform must own durability. Delegation is not available to us."

lessons:
  - "Confirms ADR-0004 FROM THE OTHER DIRECTION: every other project adapts agents, this one adapts DURABILITY ENGINES, treating Temporal/DBOS/Prefect/Restate as 'first-class compatibility targets, not peripheral adapters' with rules requiring run context, deps, history, retries, model selection and toolset lifecycle to survive the boundary. (confirms ADR-0004)"
  - "Cross a serialization boundary with an identifier, not an object: a Model is unserializable, so model_id crosses and resolves through a registry. A pin should be an identifier plus a resolver, never a serialized object - which also makes pins comparable across versions. (confirms ADR-0011)"
  - "AMENDS ADR-0009 with a threat it does not mention: an agent that fetches URLs is an SSRF primitive aimed at your own infrastructure and your cloud credential endpoints. Any URL-fetching capability needs a guard blocking private ranges, link-local, CGNAT, Teredo and an enumerated cloud-metadata list - and the local-development escape hatch must not open the credential hole. (amends ADR-0009)"
  - "AMENDS ADR-0010: semantic conventions MOVE, and a telemetry consumer is a downstream dependency you cannot break. Declare the semconv version emitted, support one deprecation window with a warning, and pin message types to a spec commit. Cloudflare taught us to follow conventions; this teaches us to version our adherence. (amends ADR-0010)"
  - "AMENDS ADR-0012 with the most conceptually useful finding of the pass: THERE ARE TWO MEANINGS OF 'CAPABILITY'. Omnigent and AG2 mean declared, queryable metadata about what a thing can do (for routing and fail-closed decisions). Pydantic AI means an installed object that changes behaviour, composed with explicit ordering. Both belong in our design and MUST NOT share a name. Proposal: Capability = declared verified metadata; Extension = installable composed behaviour with declared position. (amends ADR-0012)"
  - "Confirms ADR-0014 by honest delegation: no effect ledger, because idempotency is the durable engine's job. A reminder that our ledger must interoperate - if a caller runs us inside Temporal, two idempotency mechanisms must not fight. (confirms ADR-0014)"
  - "Seventh consecutive project with no memory service - only a history-processing hook. (confirms ADR-0008)"
  - "The strongest evidence in the study for keeping orchestration external: it is the only project treating workflow-engine integration as a first-class compatibility contract with its own guidelines and workflow-level tests, rather than reimplementing one. (confirms L10)"
  - "NEW PRACTICE: refuse impossible compositions at configuration time with an error that explains the mechanism AND names the alternative. Best fail-closed message in the study, and a model for every capability rejection we emit."
  - "NEW PRACTICE: make serializability a project rule with a written check, because a spec that cannot round-trip silently diverges from the running agent."

adr_impact:
  - adr: ADR-0001
    effect: neutral
    note: "No agent identity; an Agent is a Python object. Appropriate for a library."
  - adr: ADR-0002
    effect: neutral
    note: "No Task or Run resource. Under a durable engine the engine's workflow IS the run - an argument that Run belongs to whoever owns durability."
  - adr: ADR-0003
    effect: confirms
    note: "No agent-to-agent messaging; AG2 remains the sole answer."
  - adr: ADR-0004
    effect: confirms
    note: "Adapts durability ENGINES rather than agents, as first-class compatibility targets. Identifier-not-object across the boundary."
  - adr: ADR-0005
    effect: confirms
    note: "MCP as capability and toolset, with NativeOrLocalTool distinguishing provider-native features."
  - adr: ADR-0006
    effect: neutral
    note: "No A2A."
  - adr: ADR-0007
    effect: neutral
    note: "No principals."
  - adr: ADR-0008
    effect: confirms
    note: "Seventh consecutive project with no memory service."
  - adr: ADR-0009
    effect: amends
    note: "Adds egress guarding: a fetch tool is an SSRF primitive aimed at cloud credential endpoints. Escape hatches must not open that hole."
  - adr: ADR-0010
    effect: amends
    note: "Version your semconv adherence; support one deprecation window; pin message types to a spec commit."
  - adr: ADR-0011
    effect: confirms
    note: "A pin should be an identifier plus a resolver, never a serialized object."
  - adr: ADR-0012
    effect: amends
    note: "Two meanings of capability - declared metadata vs installed behaviour. Split them: Capability and Extension."
  - adr: ADR-0013
    effect: neutral
    note: "No policy engine, though typed wrap points are real interception seams."
  - adr: ADR-0014
    effect: confirms
    note: "Delegates idempotency to the durable engine, honestly. Our ledger must not fight the engine's."

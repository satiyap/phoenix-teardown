    note: "A files/ package exists and envelopes carry event_data, but there is no blob store abstraction."
    evidence: "ag2/files/ @ 90f490a"
  # P5: Is there a vector store? Required or optional?
  P5:
    verdict: absent
    note: "No vector store; the capability index is in-memory over resume summaries."
    evidence: "ag2/network/identity.py:155 @ 90f490a"
  # P6: Is storage pluggable, or hardcoded?
  P6:
    verdict: implicit
    note: "KnowledgeStore and checkpoint_store are injectable seams, but the WAL is file-based with no pluggable backend, and its indexes are in-memory (terminal-channel pruning clears them)."
    evidence: "ag2/network/hub/core.py:2637-2639 @ 90f490a"

  # --- Q. Licensing and commercial ---
  # Q1: Exact license, including any per-directory variation.
  Q1:
    verdict: first_class
    note: "Apache-2.0, with NOTICE.md, a license_original recording AutoGen provenance, and a TRANSPARENCY_FAQS.md."
    evidence: "LICENSE, NOTICE.md @ 90f490a"
  # Q2: Are there enterprise-only components missing from the OSS repo?
  Q2:
    verdict: absent
    note: "No enterprise-only components; the network hub, rules, audit and WAL are all in the OSS package. Optional EXTRAS (a2a, acp, tracing) keep the base install small but withhold nothing."
    evidence: "pyproject.toml:107 @ 90f490a"
  # Q3: SaaS or hosted-service restrictions?
  Q3:
    verdict: absent
    note: "No SaaS restriction under Apache-2.0."
    evidence: "LICENSE @ 90f490a"
  # Q4: Trademark constraints on derived works?
  Q4:
    verdict: implicit
    note: "AG2 / AG2ai naming; Apache-2.0 grants no trademark rights."
    evidence: "NOTICE.md @ 90f490a"
  # Q5: Network copyleft (AGPL, SSPL) implications for a hosted product?
  Q5:
    verdict: absent
    note: "No network copyleft."
    evidence: "LICENSE @ 90f490a"
  # Q6: Verdict: `USE` / `INTEGRATE` / `REFERENCE_ONLY` / `AVOID`, with reasoning.
  Q6:
    verdict: first_class
    note: "THE ONLY INTEGRATE-CANDIDATE IN THE STUDY. Python, Apache-2.0, actively developed at 1.0.2, and ag2.network is a well-factored, tested, OPT-IN package solving the one subsystem we would otherwise build with no precedent. Adopting the envelope schema and hub contract is plausible even without the agent runtime - a materially different verdict from the six REFERENCE_ONLYs before it."
    evidence: "LICENSE @ 90f490a; ag2/network/__init__.py:5-10"

  # --- R. Developer experience ---
  # R1: Time from clone to a running agent. Actual elapsed minutes.
  R1:
    verdict: first_class
    note: "VERIFIED: python -m venv, pip install ag2, import and inspect the Envelope, Rule and Passport types - clean first try. The network hub needs no external services."
    evidence: "verified live against ag2 1.0.2 (PyPI, 2026-08-26); pytest test/network/test_at_least_once.py test/network/test_hub_invariants.py -> 39 passed"
  # R2: How many concepts before "hello world"?
  R2:
    verdict: implicit
    note: "A bare Agent needs almost nothing (the network is opt-in). The full network model is large: passport, resume, rule, channel, manifest, adapter, envelope, expectation, task."
    evidence: "ag2/network/__init__.py:5-10 @ 90f490a"
  # R3: Is there a local dev loop? Hot reload?
  R3:
    verdict: first_class
    note: "In-process hub with file-based WAL, so a full multi-agent network runs locally with no infrastructure. testing.py and network/testing helpers ship in the package."
    evidence: "ag2/testing.py @ 90f490a; ag2/network/testing.py"
  # R4: How do you debug a stuck run?
  R4:
    verdict: first_class
    note: "Replayable per-channel WAL, audit.jsonl, HubListener callbacks including rejections, watch.py, observers/, and EV_PACKET recording handoff reasons."
    evidence: "ag2/watch.py @ 90f490a; ag2/observers/"
  # R5: Can an agent be unit tested? Is there a test harness?
  R5:
    verdict: first_class
    note: "49 network test files including dedicated test_at_least_once.py, test_hub_invariants.py, test_expectations_boundary.py and test_channel_pruning.py. VERIFIED: 39 tests pass across at-least-once and hub invariants."
    evidence: "test/network/ @ 90f490a; verified live against ag2 1.0.2 (PyPI, 2026-08-26); pytest test/network/test_at_least_once.py test/network/test_hub_invariants.py -> 39 passed"
  # R6: Deployment story?
  R6:
    verdict: implicit
    note: "Library-first with optional extras; no deployment manifests. Remote hub transports exist for distribution."
    evidence: "pyproject.toml @ 90f490a"
  # R7: CLI ergonomics — try the equivalent of `init`, `agent add`, `run`.
  R7:
    verdict: implicit
    note: "No agent-management CLI; there is a textual TUI and jog.yaml/justfile for development tasks."
    evidence: "ag2/textual.py @ 90f490a"

  # --- S. Hard scenarios ---
  # S1: Delegated authority
  S1:
    verdict: inferable
    note: "AuthBlock describes handshake validation (issuer, audience, key_fingerprint, claim), the arbiter is replaceable for custom permission protocols, and Envelope.depth caps delegation hops. But scheme is still 'none' | future schemes, so no working delegated-credential flow ships. Omnigent remains the only first_class answer."
    evidence: "ag2/network/identity.py:52-60 @ 90f490a"
  # S2: Torn side effect
  S2:
    verdict: first_class_answer
    note: "SECOND INDEPENDENT PRECEDENT, DIFFERENT KEY. find_envelope_by_causation returns the prior accepted reply so a handler can 'skip the side effect' after an at-least-once redelivery, and it is checked BEFORE the turn-ownership probe 'so a redelivery is a no-op regardless of whose turn it now is'. The reply IS the idempotency record - no key to generate or propagate. VERIFIED: 39 tests pass."
    evidence: "ag2/network/hub/core.py:2626-2644 @ 90f490a; ag2/network/client/handlers.py:198-211; verified live against ag2 1.0.2 (PyPI, 2026-08-26); pytest test/network/test_at_least_once.py test/network/test_hub_invariants.py -> 39 passed"
  # S3: Upgrade mid-flight
  S3:
    verdict: undefined
    note: "Passport is immutable but unversioned, and Task.resumed_state is owner-defined and unversioned, so nothing detects a definition change across resume."
    evidence: "ag2/network/identity.py:62-68 @ 90f490a"
  # S4: Concurrent memory write
  S4:
    verdict: inferable
    note: "Per-channel lock serialises validate_send / fold / on_accepted, and context mutations are EV_CONTEXT_SET envelopes in the WAL - so concurrent shared-state writes are ordered by the same mechanism as messages rather than by a separate lock."
    evidence: "ag2/network/hub/core.py:1856-1859 @ 90f490a; ag2/network/envelope.py:71-76"
  # S5: Cancellation tree
  S5:
    verdict: first_class_answer
    note: "BEST ANSWER IN THE STUDY. EV_TASK_CANCEL_REQUEST (a peer ASKS: 'the owner is free to honour by calling Task.cancel or to ignore the request entirely') is deliberately distinct from EV_TASK_CANCELLED (the owner's terminal emission). Cooperative cancellation across a trust boundary - the only correct model when the canceller does not own the work."
    evidence: "ag2/network/envelope.py:81-91 @ 90f490a"
  # S6: Silent context loss
  S6:
    verdict: inferable
    note: "CompactStrategy triggers on measurable limits (event count, token count) and TokenBudgetPolicy documents its own failure mode: 'the budget is a target, not a guarantee: events the cut orphaned are dropped from the span, and a span that would reduce to nothing widens past the budget instead.' Bounded and explained rather than silent, though not emitted as an event."
    evidence: "ag2/compact.py:5-13 @ 90f490a; ag2/policies/token_budget.py:12-20"
  # S7: Poison message
  S7:
    verdict: inferable
    note: "InboxBlock caps pending at 1000 with overflow 'reject' and an 80% high_water backpressure signal; TaskExpired and channel/task TTLs age work out; on_envelope_rejected makes every refusal observable. No dead-letter queue."
    evidence: "ag2/network/rule.py:80-96 @ 90f490a"
  # S8: Tenant leak
  S8:
    verdict: undefined
    note: "No tenant resource - 'tenant' denotes user code, not an isolation unit."
    evidence: "ag2/network/hub/core.py:24-25 @ 90f490a"
  # S9: Runaway spend
  S9:
    verdict: inferable
    note: "LimitsBlock caps concurrent channels and tasks and delegation depth with TTL defaults (channel 2h, task 15m) - genuine resource bounds that stop runaway fan-out. But RateBlock is 'not enforced by the in-process hub' and CostProfile fields are 'not validated by V1', so there is no money-denominated limit."
    evidence: "ag2/network/rule.py:69-77,100-117 @ 90f490a"
  # S10: Zombie sandbox
  S10:
    verdict: undefined
    note: "No sandbox or compute model; TTLs and max_silence bound logical work, not processes."
    evidence: "ag2/network/rule.py:107-108 @ 90f490a"

object_model: |
  Hub                              the authority; owns WAL, audit, arbiter
   |-- Passport                    IMMUTABLE identity + billing.
   |                               kind: agent | human | remote_agent
   |-- Resume                      MUTABLE capability claims + OBSERVED record
   |    |-- claimed_capabilities   what the agent says it can do
   |    `-- observed[cap]          ObservedStat{n, completed, failed,
   |                               expired, p50_latency_ms} - hub-derived
   |-- SKILL.md                    markdown + frontmatter, per agent
   |-- Rule (per hub, per agent)   access + limits, enforced HUB-SIDE
   |    |-- AccessBlock            who may talk to whom, channel types
   |    `-- LimitsBlock            max_concurrent_channels / _tasks,
   |                               channel_ttl 2h, task_ttl 15m,
   |                               delegation_depth 5, RateBlock, InboxBlock
   |-- Channel                     manifest, participants, state, expectations
   |    `-- WAL                    append-only per-channel envelope log
   `-- AuditLog                    append-only audit.jsonl, open kind set

  Envelope                         the wire shape for every A2A message
  Task                             agent-owned lifecycle + checkpoint/resume

strongest_ideas:
  - "A durable envelope carrying causation_id, depth, priority, ttl_seconds, trace_id and audience - the complete agent-to-agent message shape, and richer than my strawman."
  - "Dedupe by causation_id instead of a generated key: a reply caused by envelope X proves X was handled, so there is no key to generate or propagate."
  - "Checking the redelivery guard BEFORE the turn-ownership probe, so a redelivery is a no-op regardless of whose turn it now is."
  - "The WAL stores the full envelope regardless of addressing, so audit scope is deliberately WIDER than delivery scope - an audit trail that only recorded deliveries could not show what was withheld."
  - "Envelope.depth auto-incremented by the hub and capped by Rule.limits.delegation_depth, so runaway delegation is bounded by the platform rather than by prompt discipline."
  - "Immutable Passport, mutable Resume: 'mutating any field requires unregister + re-register, which yields a fresh agent_id'. Immutability by construction."
  - "Hub-derived observed stats per capability (n, completed, failed, expired, p50_latency_ms), updated on every terminal task event - declared-vs-verified capability, continuous rather than a test run."
  - "Capability routing that shows the LLM both the claim and the observed success rate, plus cost, as 'a structured list the LLM can rank'."
  - "Observation EXPANDS the capability index: an agent appears under a capability 'even if it wasn't in their original claimed_capabilities'. Capabilities can be discovered, not only declared."
  - "kind: agent | human | remote_agent - humans and remote agents are participant KINDS with a passport, rule and inbox, addressable in audience exactly like an agent."
  - "Channel protocols as adapters (conversation, discussion, consulting, workflow) with ExpectedTurn enforcement and EV_EXPECTATION_VIOLATED, so who-speaks-next is declared and hub-enforced rather than emergent from prompts."
  - "can_send() as a public probe so a handler never reaches into adapter internals."
  - "Cancel REQUEST distinct from cancel FACT: a peer asks, and 'the owner is free to honour... or to ignore the request entirely'."
  - "TaskExpired as a terminal state distinct from TaskFailed."
  - "The hub never calls Agent.ask, executes tenant transforms, or imports tenant modules - a trust boundary enforced by architecture rather than by policy."
  - "A replaceable arbiter so federation or custom permission protocols 'can replace the default rule-based behavior without forking the hub'."
  - "Rejections are observable: on_envelope_rejected fires for EVERY attempt on any pre-WAL failure, not just successes."
  - "An open audit kind set, with built-in constants as 'conveniences for the hub's own emissions, not a closed enum'."
  - "The network package is OPT-IN: importing it changes nothing about a standalone agent, so the simple case pays nothing for the distributed machinery."
  - "Context mutations are EV_CONTEXT_SET envelopes in the same WAL, unifying shared-state changes with messaging instead of running two parallel mechanisms."
  - "Routing observability: EV_PACKET records the triggering tool, a human-readable reason, and the resolved target agent_id."
  - "InboxBlock with a high_water backpressure signal defaulting to 80% of max_pending - pressure signalled before overflow."
  - "Honest self-documentation throughout: 'only reject is enforced today', 'the budget is a target, not a guarantee', RateBlock 'not enforced by the in-process hub', CostProfile 'not validated by V1', p50_latency_ms 'a single-sample stand-in for a future reservoir'."
  - "'Compaction removes. Aggregation creates. They are separate concerns.' A conceptual separation I had conflated."
  - "AgentRuntime explicitly marked cache-only, separating durable identity from connection state."
  - "task_id dedupe on observation so 'a single task contributing twice (e.g. cascade EXPIRED + owner-emitted COMPLETED) is recorded only once'."

weakest_choices:
  - "No tenancy: 'tenant' names the trust boundary for user code, but there is no tenant resource or row-level isolation."
  - "RateBlock is declared but not enforced by the in-process hub - config that does not do what it says."
  - "AuthBlock.scheme is 'none' | future schemes, so the shape of auth exists without a working scheme beyond API keys."
  - "No passport versioning, so no mid-flight upgrade detection."
  - "No sandboxing or isolation model at all."
  - "File-based WAL with in-memory indexes, and terminal-channel pruning clears the causation index - so the dedupe guarantee has a retention horizon."
  - "CostProfile fields are unvalidated, so there is no real cost control."
  - "OTel is an optional extra rather than default, without Cloudflare's semantic-convention discipline."
  - "InboxBlock overflow modes are partially implemented: drop_oldest and drop_newest silently behave as reject."
  - "ObservedStat is a lifetime counter with no decay, and p50_latency_ms is really the last sample - so an early failure is never forgotten and the percentile is not a percentile."
  - "No compensation or rollback."

reusable_components:
  - component: "Envelope schema (causation_id, depth, priority, ttl, trace_id, audience)"
    decision: INTEGRATE
    note: "The complete A2A message shape; adopt nearly verbatim."
  - component: "Dedupe by causation_id"
    decision: ADOPT_AS_STANDARD
    note: "Cheaper than a generated key; refines ADR-0014."
  - component: "Redelivery guard checked before turn ownership"
    decision: ADOPT_AS_STANDARD
    note: "Redelivery must be a no-op unconditionally."
  - component: "WAL records full envelope regardless of audience"
    decision: ADOPT_AS_STANDARD
    note: "Audit scope must exceed delivery scope."
  - component: "Hub-incremented depth capped by rule"
    decision: ADOPT_AS_STANDARD
    note: "Platform-bounded delegation, not prompt-bounded."
  - component: "Immutable Passport + mutable Resume + cache-only runtime"
    decision: ADOPT_AS_STANDARD
    note: "Resolves the identity-mutability question our model left open."
  - component: "Hub-derived observed stats per capability"
    decision: ADOPT_AS_STANDARD
    note: "Continuous declared-vs-verified; complements a bench."
  - component: "Capability routing exposing claim + observed rate + cost"
    decision: ADOPT_AS_STANDARD
    note: "First real F11 answer in the study."
  - component: "kind: agent | human | remote_agent"
    decision: ADOPT_AS_STANDARD
    note: "Cleanest expression of ADR-0007 found anywhere."
  - component: "Channel protocol adapters with expectations"
    decision: INTEGRATE
    note: "Turn-taking as declared protocol, enforced hub-side."
  - component: "Cancel request vs cancel fact"
    decision: ADOPT_AS_STANDARD
    note: "Correct model when the canceller does not own the work."
  - component: "TaskExpired distinct from TaskFailed"
    decision: ADOPT_AS_STANDARD
    note: "Different causes need different terminal states."
  - component: "Hub never imports tenant code"
    decision: ADOPT_AS_STANDARD
    note: "Trust boundary by architecture, not by policy."
  - component: "Replaceable arbiter"
    decision: REUSE
    note: "Custom permission protocols without forking."
  - component: "on_envelope_rejected for every attempt"
    decision: ADOPT_AS_STANDARD
    note: "Refusals must be as observable as successes."
  - component: "Open audit kind set"
    decision: REUSE
    note: "Extensible without a schema change."
  - component: "Opt-in network package"
    decision: ADOPT_AS_STANDARD
    note: "The distributed path must be additive, not mandatory."
  - component: "Context mutations as WAL envelopes"
    decision: REUSE
    note: "Unifies shared state with messaging."
  - component: "high_water backpressure signal"
    decision: REUSE
    note: "Signal pressure before overflow."
  - component: "File WAL with in-memory indexes"
    decision: BUILD
    note: "Reject; a dedupe guarantee must not have a retention horizon."
  - component: "Declared-but-unenforced rate limits"
    decision: BUILD
    note: "Reject; unenforced config is worse than absent config."
  - component: "Lifetime observed counters with no decay"
    decision: BUILD
    note: "Reject; routing on reputation needs a window or reservoir."

lessons:
  - "Best identity model in the study: immutable Passport (mutation requires unregister + re-register, yielding a fresh agent_id), mutable Resume (claims + observed), and AgentRuntime marked explicitly cache-only. Our Agent should split into exactly these three. (amends ADR-0001)"
  - "Task is a first-class primitive with TaskExpired distinct from TaskFailed, plus checkpoint() and resume_from - and it is AGENT-OWNED: 'the framework does not assign or schedule them'. (confirms ADR-0002)"
  - "REVERSES THE PHASE 3 CONCLUSION. After seven absent verdicts I had drafted a rewrite of ADR-0003 around shared state and was going to drop messaging from v0.1. AG2 has the whole thing: hub-stamped envelopes on per-channel append-only WALs, audience addressing, at-least-once delivery with causation dedupe, depth-capped delegation, TTLs, priorities, inbox backpressure and hub-enforced access rules. The ADR stands and the design should follow AG2's envelope closely. (confirms ADR-0003 strongly)"
  - "A2A and ACP are OPTIONAL-DEPENDENCY EDGE ADAPTERS (agent cards, gRPC server) sitting outside a richer internal envelope model. The clearest independent confirmation that interop belongs at the boundary and the internal model should be your own. (confirms ADR-0006 strongly)"
  - "kind: agent | human | remote_agent makes humans and agents the same kind of thing with a discriminator - each with a passport, a rule and an inbox, addressable in audience. This is what 'humans and agents are both principals' should mean in a schema, and no other project does it. (confirms ADR-0007 strongly)"
  - "SKILL.md with Anthropic-style frontmatter per agent, plus a knowledge/ package. SIXTH CONSECUTIVE PROJECT with filesystem/markdown skills and no memory service. Beyond settled. (confirms ADR-0008)"
  - "OTel is only an optional extra, which is weaker than AX or Cloudflare. But HubListener contributes what they lack: on_envelope_rejected fires for EVERY attempt, so refusals are observable, and envelope.trace_id is first-class so trace context rides the message. Amend ADR-0010 to require that rejected operations are as observable as successful ones. (amends ADR-0010)"
  - "Immutable passports sidestep part of the upgrade problem, but there is no passport version and Task.resumed_state is unversioned. EIGHT PROJECTS, still nobody has versioning AND pinning. (confirms ADR-0011 negatively)"
  - "Extends the capability ADR from harnesses to AGENTS, and from a test-run to a continuous signal: claimed_capabilities versus hub-maintained observed{n, completed, failed, expired, p50_latency_ms} updated on every terminal task event. Omnigent verifies claims in a bench; AG2 verifies them in production. BOTH belong - bench for correctness, observation for reliability. (confirms and extends ADR-0012)"
  - "Rules 'enforced at the hub, never the client', with a replaceable arbiter so custom permission protocols need no fork, and on_envelope_rejected making every refusal observable. Still no shadow-comparison mode after eight projects. (confirms ADR-0013)"
  - "SECOND INDEPENDENT PRECEDENT for the effect ledger, with a better key for reply-shaped work: rather than generating and propagating an idempotency_key, look up whether this sender already posted an envelope whose causation_id is the triggering envelope. The reply IS the idempotency record. Our ledger should support both keys, and must check the guard BEFORE any ownership or turn test. (confirms ADR-0014)"
  - "METHODOLOGICAL CORRECTION, recorded against myself: the Phase 3 interim findings called AG2 'downgraded in value' on the strength of a six-project tally and a Phase 1 recon that predated AG2 1.0. That judgement nearly cost the study its answer to the entire F-section. A convergence across N projects is evidence about what is COMMON, not proof about what is POSSIBLE. Budget a project by what it is architected to answer, not by how confident the current tally makes me."

adr_impact:
  - adr: ADR-0001
    effect: amends
    note: "Immutable Passport + mutable Resume + cache-only AgentRuntime. Best identity model in the study."
  - adr: ADR-0002
    effect: confirms
    note: "Task is first-class with checkpoint/resume and TaskExpired distinct from TaskFailed; agent-owned, not framework-scheduled."
  - adr: ADR-0003
    effect: confirms
    note: "REVERSES the seven-project consensus. Full durable A2A messaging: WAL-backed envelopes, audience addressing, at-least-once with causation dedupe, depth caps."
  - adr: ADR-0004
    effect: neutral
    note: "No harness adapter contract, though acp/ drives Claude Code, Codex, KiloCode and OpenCode."
  - adr: ADR-0005
    effect: confirms
    note: "MCP as protocol via mcp/ and an ACP tool_gateway, separate from the capability model (the Resume)."
  - adr: ADR-0006
    effect: confirms
    note: "A2A and ACP are optional edge adapters outside a richer internal envelope model. Clearest confirmation in the study."
  - adr: ADR-0007
    effect: confirms
    note: "kind: agent | human | remote_agent - humans are participant kinds with passport, rule and inbox."
  - adr: ADR-0008
    effect: confirms
    note: "SKILL.md with frontmatter; sixth consecutive project with filesystem skills and no memory service."
  - adr: ADR-0009
    effect: neutral
    note: "No sandbox model."
  - adr: ADR-0010
    effect: amends
    note: "OTel optional (weaker), but rejections are observable via on_envelope_rejected and trace_id rides the envelope."
  - adr: ADR-0011
    effect: confirms
    note: "Immutable but unversioned passports; unversioned resumed_state. Eight projects, still nobody has versioning AND pinning."
  - adr: ADR-0012
    effect: confirms
    note: "Extends to agents and to continuous observation: claimed vs hub-derived observed stats per capability."
  - adr: ADR-0013
    effect: confirms
    note: "Hub-side enforcement, replaceable arbiter, every refusal observable. Still no shadow mode."
  - adr: ADR-0014
    effect: confirms
    note: "Second independent precedent, with causation_id as a better key for reply-shaped work."

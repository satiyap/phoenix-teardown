  # --- H. Context and memory ---
  # H1: Which of these exist as *separate* concepts: prompt context, working state, session history, ...
  H1:
    verdict: implicit
    note: "No memory service, but the richest context-management layer in the study: episodic_memory and working_memory policies, sliding_window, token_budget, CompactStrategy, plus a knowledge/ package and KnowledgeStore."
    evidence: "ag2/policies/ @ 90f490a; ag2/knowledge/"
  # H2: Who owns memory: agent, human, workspace, task, or tenant?
  H2:
    verdict: first_class
    note: "SKILL.md and Resume are per-agent records owned by that passport; KnowledgeStore is hub-rooted."
    evidence: "ag2/network/identity.py:15-16 @ 90f490a"
  # H3: Can memory be shared between agents? At what granularity?
  H3:
    verdict: first_class
    note: "Channel-scoped context variables are shared across participants and mutated durably via EV_CONTEXT_SET."
    evidence: "ag2/network/envelope.py:71-76 @ 90f490a"
  # H4: Are there permissions on memory?
  H4:
    verdict: implicit
    note: "Rule.access governs who may talk to whom and which channel types, which indirectly scopes what an agent can learn, but there are no per-item knowledge permissions."
    evidence: "ag2/network/rule.py:1-13 @ 90f490a"
  # H5: Is provenance tracked — where a memory came from?
  H5:
    verdict: first_class
    note: "ResumeExample records title, outcome, task_id, channel_id and when - provenance for a capability claim traceable back to the task and channel that produced it."
    evidence: "ag2/network/identity.py:123-129 @ 90f490a"
  # H6: Expiry, TTL, or forgetting?
  H6:
    verdict: first_class
    note: "Per-envelope ttl_seconds, channel expires_at and TTL defaults, task TTLs, and terminal-channel pruning that clears indexes."
    evidence: "ag2/network/envelope.py:110-112 @ 90f490a; ag2/network/hub/core.py:2637-2639"
  # H7: Summarisation or compaction. Automatic or explicit?
  H7:
    verdict: first_class
    note: "CompactStrategy 'reduces stream history to respect system constraints... triggered when measurable limits (event count, token count) are approached', with the discipline stated: 'Compaction removes. Aggregation creates. They are separate concerns.'"
    evidence: "ag2/compact.py:5-13 @ 90f490a"
  # H8: Retrieval mechanism: vector, keyword, structured, agent-driven?
  H8:
    verdict: implicit
    note: "Resume.summary is 'one-line, indexed for peers(action=find)' and there is a capability index, but retrieval is over agents rather than documents. No vector store."
    evidence: "ag2/network/identity.py:155 @ 90f490a"
  # H9: Can an agent mutate its own memory mid-run?
  H9:
    verdict: first_class
    note: "Agents write context via EV_CONTEXT_SET and their Resume evolves; the hub also writes observed stats on their behalf."
    evidence: "ag2/network/envelope.py:71-76 @ 90f490a"
  # H10: Conflict resolution on concurrent writes?
  H10:
    verdict: first_class
    note: "Channel context is shared mutable state, but mutations are ordered envelopes under the per-channel lock, so concurrent writes are serialised by the same mechanism as messages."
    evidence: "ag2/network/hub/core.py:1856-1859 @ 90f490a"
  # H11: Is memory in the same store as execution state, or separate?
  H11:
    verdict: first_class

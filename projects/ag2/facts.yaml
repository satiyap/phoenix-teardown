  # --- L. Orchestration and scheduling ---
  # L1: Does it distinguish agent coordination from workflow orchestration?
  L1:
    verdict: first_class
    note: "Clean: agents own tasks ('the framework does not assign or schedule them'), the hub owns routing and enforcement, and channel adapters own turn-taking protocol."

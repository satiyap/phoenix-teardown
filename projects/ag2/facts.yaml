schema_version: 1

project:
  slug: ag2
  name: AG2 Agent Network
  depth: deep
  evidence_class: A
  read_on: 2026-08-26
  repo: "https://github.com/ag2ai/ag2"
  commit: 90f490a1b72b27ab4c219dd3586e94d42383a016
  docs: "https://docs.ag2.ai"
  version: "ag2 1.0.2"
  license: Apache-2.0
  license_verdict: REFERENCE_ONLY
  runtime_class: hybrid
  one_line: Formerly AutoGen; self-described open-source AgentOS focused on multi-agent conversation patterns.
  thesis: "Agent-to-agent conversation is a protocol problem, and the protocol belongs in an addressable channel governed by a hub - never in the agents. The hub is the authority (rules enforced hub-side, tenant code never imported) and the whole network is opt-in, so a standalone agent pays nothing for it."

probes:

  # --- A. Core abstraction and object model ---
  # A1: What does this system think an agent *is*? State it in one sentence, in their vocabulary.
  A1:
    verdict: first_class
    note: "Three records back every registered agent: Passport (IMMUTABLE id + billing; mutating any field requires unregister + re-register yielding a fresh agent_id), Resume (mutable capability claims + hub-observed track record), and SKILL.md. AgentRuntime is explicitly cache-only."
    evidence: "ag2/network/identity.py:1-21,62-68 @ 90f490a"
  # A2: What is the root resource — the thing everything else hangs off?
  A2:
    verdict: first_class
    note: "Channel is the durable conversation unit with a manifest, participants, state, expectations and an append-only per-channel WAL of envelopes."
    evidence: "ag2/network/channel.py @ 90f490a; ag2/network/envelope.py:6-11"
  # A3: Is `Agent` persistent or ephemeral? Can it exist while not executing?
  A3:
    verdict: first_class
    note: "Passport and Resume are hub-registered records independent of any running process; AgentRuntime (transport binding, heartbeat) is separate and cache-only."
    evidence: "ag2/network/identity.py:17-20 @ 90f490a"
  # A4: Is `Task` a separate resource from `Run`? If not, which concept is missing and what fills the...
  A4:
    verdict: first_class
    note: "Task is a first-class framework primitive with its own lifecycle events (TaskStarted, TaskProgress, TaskCompleted, TaskFailed, TaskExpired, TaskCancelled), checkpoint() and resume_from. Agent-OWNED: 'the framework does not assign or schedule them'."
    evidence: "ag2/task.py:5-27 @ 90f490a"
  # A5: What is a `Session` attached to: user, agent, task, or execution?
  A5:
    verdict: first_class
    note: "Channel is the session; ConversationContext carries channel-scoped context variables mutated via EV_CONTEXT_SET envelopes."
    evidence: "ag2/network/envelope.py:71-76 @ 90f490a"
  # A6: Are messages first-class durable resources, or transient function arguments?
  A6:
    verdict: first_class
    note: "Envelope is THE durable message resource: hub-stamped envelope_id, persisted to the per-channel WAL, with audience addressing, causation_id, depth, priority, ttl_seconds and trace_id."
    evidence: "ag2/network/envelope.py:94-131 @ 90f490a; verified live against ag2 1.0.2 (PyPI, 2026-08-26); pytest test/network/test_at_least_once.py test/network/test_hub_invariants.py -> 39 passed"
  # A7: Are artifacts (files, outputs, deliverables) first-class?
  A7:
    verdict: implicit
    note: "Files package and KnowledgeStore exist, and EV_PACKET captures an agent's full round atomically, but there is no first-class Artifact resource."
    evidence: "ag2/files/ @ 90f490a; ag2/network/envelope.py:45-61"
  # A8: Can multiple agents participate in one task? How is that represented?
  A8:
    verdict: first_class
    note: "Participants in a channel, with Passport kind discriminating agent | human | remote_agent. Multi-agent participation is the core model."
    evidence: "ag2/network/identity.py:38-39 @ 90f490a; ag2/network/channel.py"
  # A9: Draw the object model as a tree. Only nodes that exist in their code or API.
  A9:
    verdict: first_class
    note: "Hub > {Passport (immutable), Resume (claimed + observed), SKILL.md, Rule (access + limits), Channel > WAL, AuditLog}; plus Envelope as the wire shape and Task as the lifecycle primitive. See teardown section 3."
    evidence: "ag2/network/ @ 90f490a"

  # --- B. Runtime model ---
  # B1: Does the platform launch agents, host them, or attach to external ones?
  B1:
    verdict: first_class
    note: "In-process agents (Agent.ask) with an opt-in hub that may be in-process or remote. The hub NEVER calls Agent.ask or imports tenant modules - the trust boundary runs through HubClient."
    evidence: "ag2/network/hub/core.py:24-25 @ 90f490a"
  # B2: Execution substrate: process, container, microVM, serverless, in-process library, remote HTTP?
  B2:
    verdict: first_class
    note: "In-process by default; remote hubs via network/remote.py and transport/, with remote_agent passports for cross-hub federation ('the local hub holds the passport as a cache and dispatches via a registered RemoteAgentProxy')."
    evidence: "ag2/network/identity.py:69-73 @ 90f490a"
  # B3: Who owns the event loop — platform or agent?
  B3:
    verdict: first_class
    note: "The agent owns its own loop (Agent.ask); the hub owns routing, access and limits but never executes agent code."
    evidence: "ag2/network/hub/core.py:24-25 @ 90f490a"
  # B4: Who decides when an agent wakes?
  B4:
    verdict: first_class
    note: "Channel protocol adapters decide who speaks next (ExpectedTurn, ORDERING_ROUND_ROBIN, default_expected_next), enforced hub-side, with can_send() as a public probe."
    evidence: "ag2/network/adapters/ @ 90f490a; ag2/network/client/handlers.py:214"
  # B5: Can an agent run indefinitely? What is the actual ceiling?
  B5:
    verdict: first_class
    note: "Channels have TTLs (channel_ttl_default 2h) and tasks have TTLs (task_ttl_default 15m); max_silence expectations detect idleness."
    evidence: "ag2/network/rule.py:100-117 @ 90f490a; verified live against ag2 1.0.2 (PyPI, 2026-08-26); pytest test/network/test_at_least_once.py test/network/test_hub_invariants.py -> 39 passed"
  # B6: Are there background or unattended agents?
  B6:
    verdict: absent
    note: "No scheduling or cron. Tasks are agent-owned and explicitly not framework-scheduled."
    evidence: "ag2/task.py:16-17 @ 90f490a"
  # B7: Is execution synchronous or asynchronous from the caller's view?
  B7:
    verdict: first_class
    note: "Streams and live packages, plus TaskProgress events on a bound stream so any observer can follow along 'without participating in execution'."
    evidence: "ag2/task.py:12-15 @ 90f490a; ag2/streams/"
  # B8: Can in-flight work migrate between workers?
  B8:
    verdict: implicit
    note: "Remote hubs and remote_agent passports allow work to live elsewhere, but there is no work-stealing or migration of in-flight execution."
    evidence: "ag2/network/remote.py @ 90f490a"
  # B9: Can an agent survive a machine restart? Automatically, or with operator action?
  B9:
    verdict: first_class
    note: "Task.checkpoint() persists owner-defined state under task_id via a checkpoint_store (typically HubBackedCheckpointStore); resume_from=prior_task_id reads it back and exposes resumed_state 'so the owner can pick up mid-flow after a restart'."
    evidence: "ag2/task.py:21-27 @ 90f490a"
  # B10: Classify: worker/queue, durable actor, attached harness, or in-process library.
  B10:
    verdict: first_class
    note: "hybrid: in-process agents plus an OPT-IN durable messaging hub. 'Importing it is opt-in - bare Agent continues to work standalone with no behavioural change when this package is not imported.'"
    evidence: "ag2/network/__init__.py:5-10 @ 90f490a"

  # --- C. Durability and failure semantics ---
  # C1: What state is durable, and what is lost on crash?
  C1:
    verdict: first_class
    note: "Append-only per-channel WAL of envelopes plus a hub-level audit.jsonl under a KnowledgeStore root, plus HubBackedCheckpointStore for task state."
    evidence: "ag2/network/hub/audit.py:5-9 @ 90f490a; ag2/network/envelope.py:6-11"
  # C2: *When* is state persisted — every step, every tool call, on checkpoint, never?
  C2:
    verdict: first_class
    note: "post_envelope is 'validate sender + adapter + WAL append + dispatch' - the envelope is durably appended before dispatch."
    evidence: "ag2/network/hub/core.py:1853-1859 @ 90f490a"
  # C3: Checkpointing or event sourcing? Can state be rebuilt from a log?
  C3:
    verdict: first_class
    note: "Append-only WAL per channel plus an append-only audit log; context mutations are themselves EV_CONTEXT_SET envelopes in the same WAL, so shared-state changes are part of the log rather than a parallel store."
    evidence: "ag2/network/envelope.py:71-76 @ 90f490a; ag2/network/hub/audit.py:5"
  # C4: Retry semantics, and at what granularity: run, step, tool call?
  C4:
    verdict: implicit
    note: "At-least-once redelivery is expected and guarded, and channel/task TTLs bound retries, but there is no declarative backoff policy (contrast Cloudflare's tryN)."
    evidence: "ag2/network/client/handlers.py:198-211 @ 90f490a"
  # C5: At-least-once or exactly-once? What do the docs claim versus what the code does?
  C5:
    verdict: first_class
    note: "AT-LEAST-ONCE, stated plainly and handled: find_envelope_by_causation lets a handler 'skip the side effect' when the same sender re-posts with the same causation_id. Verified by a dedicated test file."
    evidence: "ag2/network/hub/core.py:2626-2644 @ 90f490a; verified live against ag2 1.0.2 (PyPI, 2026-08-26); pytest test/network/test_at_least_once.py test/network/test_hub_invariants.py -> 39 passed"
  # C6: Is there an idempotency model for tool side effects?
  C6:
    verdict: first_class
    note: "SECOND INDEPENDENT PRECEDENT, WITH A BETTER KEY. Envelope carries idempotency_key (reserved for cross-process transports), but the working mechanism is causation-based: find_envelope_by_causation(channel, sender, causation_id) returns the prior accepted reply so the handler skips the side effect. Checked BEFORE the turn-ownership probe 'so a redelivery is a no-op regardless of whose turn it now is'. The reply IS the idempotency record."
    evidence: "ag2/network/hub/core.py:2626-2644 @ 90f490a; ag2/network/client/handlers.py:198-211; verified live against ag2 1.0.2 (PyPI, 2026-08-26); pytest test/network/test_at_least_once.py test/network/test_hub_invariants.py -> 39 passed"
  # C7: Process crash recovery: what resumes, and from where?
  C7:
    verdict: first_class
    note: "Task.resumed_state after resume_from, read back from the checkpoint store; channel state is recovered by folding the WAL."
    evidence: "ag2/task.py:21-27 @ 90f490a"
  # C8: Node loss: is work re-dispatched, and how is it detected?
  C8:
    verdict: implicit
    note: "max_silence expectations detect idle channels and TaskExpired handles timed-out work, plus AgentRuntime tracks last heartbeat - but there is no explicit lost-worker scan (contrast Cloudflare)."
    evidence: "ag2/network/rule.py:107-108 @ 90f490a; ag2/network/identity.py:17-19"
  # C9: Context-window overflow: truncation, summarisation, or failure?
  C9:
    verdict: first_class
    note: "BEST CONTEXT MANAGEMENT IN THE STUDY: CompactStrategy protocol plus policies for token_budget, sliding_window, episodic_memory and working_memory. Honest about limits - 'the budget is a target, not a guarantee'."
    evidence: "ag2/compact.py:5-13 @ 90f490a; ag2/policies/token_budget.py:12-20"
  # C10: Timers, scheduled execution, long sleeps — durable across restart?
  C10:
    verdict: first_class
    note: "Per-envelope ttl_seconds, channel expires_at, channel_ttl_default 2h, task_ttl_default 15m, and max_silence expectations."
    evidence: "ag2/network/envelope.py:110-112 @ 90f490a; ag2/network/rule.py:113-114"
  # C11: Human-in-the-loop pause and resume: durable, or in-memory only?
  C11:
    verdict: first_class
    note: "hitl.py provides HumanInputRequest/HumanMessage with sync or async hooks and HumanInputNotProvidedError. More importantly, kind='human' is a PASSPORT KIND - a human is an addressable network participant with an identity, rule and inbox."
    evidence: "ag2/hitl.py @ 90f490a; ag2/network/identity.py:38,69-71"
  # C12: Can a definition be upgraded while runs are in flight? What happens to them?
  C12:
    verdict: absent
    note: "Passport is immutable but carries NO version, and Task.resumed_state is owner-defined and unversioned, so nothing detects a definition change across resume. Eight projects and still nobody has versioning AND pinning."
    evidence: "ag2/network/identity.py:62-68 @ 90f490a; ag2/task.py:21-27"

  # --- D. Agent identity and lifecycle ---
  # D1: Is an agent globally addressable? By what identifier?
  D1:
    verdict: first_class
    note: "Passport.agent_id is hub-stamped at registration and IMMUTABLE: 'Mutating any field requires unregister + re-register, which yields a fresh agent_id'. Immutability by construction, not convention."
    evidence: "ag2/network/identity.py:62-68 @ 90f490a"
  # D2: Does identity survive process restart?
  D2:
    verdict: first_class
    note: "Passport, Resume and SKILL.md are persisted identity files under the hub's store, independent of any connection."
    evidence: "ag2/network/identity.py:1-20 @ 90f490a"
  # D3: Is identity distinct from runtime instance?
  D3:
    verdict: first_class
    note: "Three-way split: Passport (immutable identity), Resume (mutable capability), AgentRuntime (connection cache). Cleanest separation in the study."
    evidence: "ag2/network/identity.py:5-20 @ 90f490a"
  # D4: Are agents versioned? Immutable or mutable definitions?
  D4:
    verdict: absent
    note: "No version field on Passport. Immutability sidesteps part of the problem (a change yields a new agent_id) but there is no version lineage."
    evidence: "ag2/network/identity.py:62-68 @ 90f490a"
  # D5: Is there a registry or catalog?
  D5:
    verdict: first_class
    note: "The hub IS an agent registry: register / unregister / set_resume / set_skill / set_rule, all audited, with a capability index for peers(action='find')."
    evidence: "ag2/network/hub/audit.py:12-14 @ 90f490a; ag2/network/client/tools/peers.py"
  # D6: Can agents discover each other at runtime?
  D6:
    verdict: first_class
    note: "peers(action='find') matches on query/capability/sort_by and returns claimed capabilities WITH observed success rate and cost; peers(action='describe') returns passport, resume and SKILL.md verbatim with a rendered fallback."
    evidence: "ag2/network/client/tools/peers.py:5-13,29-40 @ 90f490a"
  # D7: Can agents advertise capabilities? In what format?
  D7:
    verdict: first_class
    note: "Resume.claimed_capabilities are the declaration; Resume.observed[cap] is a hub-derived ObservedStat{n, completed, failed, expired, p50_latency_ms} updated on every terminal task event. Declared AND verified, continuously."
    evidence: "ag2/network/identity.py:132-160 @ 90f490a; ag2/network/hub/core.py:1337-1352"
  # D8: Is there an owner, team, or tenant on the agent record?
  D8:
    verdict: implicit
    note: "Passport carries billing facts and a CostProfile, and rules are per (hub, agent), but there is no owner or tenant field."
    evidence: "ag2/network/identity.py:43-49 @ 90f490a"
  # D9: Can an agent be suspended, revoked, or deprecated?
  D9:
    verdict: implicit
    note: "FIRST AGENT REVOCATION IN EIGHT PROJECTS: unregister exists and is audited alongside register and set_resume. It is a hard removal rather than a deprecation lifecycle, and re-registering yields a new agent_id."
    evidence: "ag2/network/hub/audit.py:12-14 @ 90f490a; ag2/network/identity.py:67"
  # D10: Is there anything resembling a declarative agent manifest?
  D10:
    verdict: first_class
    note: "SKILL.md is 'a Markdown document with Anthropic-style frontmatter' per agent, parsed by client/skill_render.py, plus ChannelManifest declaring channel type, participants and expectations."
    evidence: "ag2/network/identity.py:15-16 @ 90f490a; ag2/network/channel.py"

  # --- E. Harness and runtime interoperability ---
  # E1: What is the minimum interface an agent implementation must satisfy?
  E1:
    verdict: implicit
    note: "No harness adapter contract in the AX/Omnigent sense. ChannelAdapter is a PROTOCOL adapter (conversation/discussion/consulting/workflow), and acp/ drives external agents (Claude Code, Codex, KiloCode, OpenCode)."
    evidence: "ag2/network/adapters/ @ 90f490a; ag2/acp/config.py"
  # E2: Transport: stdin/stdout, HTTP, gRPC, WebSocket, in-process, ACP, A2A?
  E2:
    verdict: first_class
    note: "In-process, remote hub transports (network/transport/), and ACP for external agent CLIs; A2A over gRPC or HTTP as an optional edge adapter."
    evidence: "ag2/network/transport/ @ 90f490a; ag2/a2a/transports/"
  # E3: Can it host a foreign agent (Claude Code, Codex, OpenHands, LangGraph, ADK)?
  E3:
    verdict: first_class
    note: "ACP configs for Claude Code, Codex, KiloCode and OpenCode; remote_agent passports for agents on another hub."
    evidence: "ag2/acp/config.py @ 90f490a"
  # E4: Is there an event stream out of a running agent? What granularity?
  E4:
    verdict: first_class
    note: "Typed event stream: Task* events on a bound stream, plus HubListener callbacks (on_envelope_posted, on_envelope_rejected, on_inbox_pressure) and EV_PACKET capturing a full agent round atomically."
    evidence: "ag2/network/hub/core.py:1863-1866 @ 90f490a; ag2/network/envelope.py:45-61"
  # E5: Are tool calls externally observable, or internal to the agent?
  E5:
    verdict: first_class
    note: "EV_PACKET records routing{kind: handoff|text, tool, reason, target} plus context_updates and body - the triggering tool, a human-readable reason and the resolved target."
    evidence: "ag2/network/envelope.py:45-61 @ 90f490a"
  # E6: How is context injected at start?
  E6:
    verdict: implicit
    note: "Rule, ChannelManifest and Passport/Resume are typed declarative config; there is no opaque adapter config blob."
    evidence: "ag2/network/rule.py:120-127 @ 90f490a"
  # E7: Is cancellation supported? Cooperative or forced? Does it propagate to subagents?
  E7:
    verdict: first_class
    note: "BEST CANCELLATION MODEL IN THE STUDY: EV_TASK_CANCEL_REQUEST (a peer ASKS, and 'the owner is free to honour by calling Task.cancel or to ignore the request entirely') is distinct from EV_TASK_CANCELLED (the owner's terminal emission). Cooperative cancellation across a trust boundary."
    evidence: "ag2/network/envelope.py:81-91 @ 90f490a"
  # E8: Can a run be checkpointed and restored by the platform, or only by the agent?
  E8:
    verdict: first_class
    note: "Task.checkpoint() and resume_from=prior_task_id with resumed_state exposed to the owner; HubBackedCheckpointStore persists under task_id."
    evidence: "ag2/task.py:21-27 @ 90f490a"
  # E9: Which of these would be hard to adapt, and why?
  E9:
    verdict: first_class
    note: "Extensive module docstrings stating contracts and honest limits, a stable event-type naming rule ('new names are added in code, not at runtime'), and 49 network test files."
    evidence: "ag2/network/envelope.py:41-44 @ 90f490a; test/network/"

  # --- F. Agent-to-agent communication ---
  # F1: Direct messages between agents?
  F1:
    verdict: first_class
    note: "THE F-SECTION IS CLOSED. Envelope is 'the wire shape for every message between agents... hub-stamped at post_envelope, and persisted to the per-channel WAL'. Genuine durable agent-to-agent messaging - the first in eight projects."
    evidence: "ag2/network/envelope.py:5-11 @ 90f490a; verified live against ag2 1.0.2 (PyPI, 2026-08-26); pytest test/network/test_at_least_once.py test/network/test_hub_invariants.py -> 39 passed"
  # F2: Channels, topics, or pub/sub?
  F2:
    verdict: first_class
    note: "Channels with typed protocols (ConversationAdapter, DiscussionAdapter, ConsultingAdapter, WorkflowAdapter), invite/ack/reject lifecycle, open/closed/expired states, and expectations enforced hub-side."
    evidence: "ag2/network/adapters/ @ 90f490a; ag2/network/envelope.py:63-70"
  # F3: Task delegation as a distinct mechanism from messaging?
  F3:
    verdict: first_class
    note: "Delegation is bounded by the platform: Envelope.depth is 'delegation hop count. Hub auto-increments on the reply path; Rule.limits.delegation_depth caps it' (default 5). Plus handoff.py and transitions.py."
    evidence: "ag2/network/envelope.py:108-110 @ 90f490a; ag2/network/rule.py:116"
  # F4: Synchronous RPC between agents?
  F4:
    verdict: first_class
    note: "Consulting and workflow channel protocols give request/response shapes over envelopes; A2A provides RPC-style interop at the edge."
    evidence: "ag2/network/adapters/ @ 90f490a"
  # F5: Asynchronous inbox or mailbox?
  F5:
    verdict: first_class
    note: "InboxBlock is a real mailbox policy: max_pending 1000, overflow 'reject', and a high_water soft threshold firing on_inbox_pressure for backpressure (defaults to 80% of max_pending). Honest that drop_oldest/drop_newest are 'recognised but treated as reject'."
    evidence: "ag2/network/rule.py:80-96 @ 90f490a; verified live against ag2 1.0.2 (PyPI, 2026-08-26); pytest test/network/test_at_least_once.py test/network/test_hub_invariants.py -> 39 passed"
  # F6: Is delivery durable? Survives restart of sender and receiver?
  F6:
    verdict: first_class
    note: "At-least-once delivery, stated explicitly, with causation-based dedupe so handlers skip duplicate side effects. Verified: test/network/test_at_least_once.py passes."
    evidence: "ag2/network/hub/core.py:2626-2644 @ 90f490a; verified live against ag2 1.0.2 (PyPI, 2026-08-26); pytest test/network/test_at_least_once.py test/network/test_hub_invariants.py -> 39 passed"
  # F7: Is message ordering guaranteed? Per what scope?
  F7:
    verdict: first_class
    note: "Per-channel lock makes validate_send / fold / on_accepted 'see a consistent state', with dispatch outside the lock to avoid deadlock on EV_CHANNEL_CLOSED broadcast. Single-writer per channel."
    evidence: "ag2/network/hub/core.py:1856-1859 @ 90f490a"
  # F8: Acknowledgement or delivery receipts?
  F8:
    verdict: first_class
    note: "EV_CHANNEL_INVITE_ACK and EV_CHANNEL_INVITE_REJECT are explicit acknowledgement envelopes, and find_envelope_by_causation lets a sender confirm a prior reply exists."
    evidence: "ag2/network/envelope.py:63-66 @ 90f490a"
  # F9: Correlation ids for request/response pairing?
  F9:
    verdict: first_class
    note: "causation_id threads replies to prompts ('used by view policies to thread replies to their prompts'), task_id links envelopes to tasks, and trace_id is a first-class envelope field so trace context rides the message."
    evidence: "ag2/network/envelope.py:104-107 @ 90f490a"
  # F10: Conversation threading?
  F10:
    verdict: implicit
    note: "Channels are created, invited to, closed and expired, with context forking via EV_CONTEXT_SET; no conversation fork primitive."
    evidence: "ag2/network/envelope.py:63-70 @ 90f490a"
  # F11: Capability-based routing — address by what an agent *can do* rather than who it is?
  F11:
    verdict: first_class
    note: "FIRST GENUINE CAPABILITY ROUTING: peers(action='find') matches on capability and returns a structured list including observed_success_rate and cost 'the LLM can rank'. Observation even EXPANDS the index - an agent appears under a capability 'even if it wasn't in their original claimed_capabilities'."
    evidence: "ag2/network/client/tools/peers.py:29-40 @ 90f490a; ag2/network/hub/core.py:1341-1342"

  # --- G. Human-agent collaboration ---
  # G1: Is a human modelled as a special kind of agent, a distinct principal type, or not modelled?
  G1:
    verdict: first_class
    note: "kind='human' is a Passport kind - 'an out-of-band non-LLM participant driven by an external UI' - so a human has an identity, a rule and an inbox, and is addressable in audience exactly like an agent. Cleanest expression of humans-as-principals in the study."
    evidence: "ag2/network/identity.py:38,69-71 @ 90f490a; verified live against ag2 1.0.2 (PyPI, 2026-08-26); pytest test/network/test_at_least_once.py test/network/test_hub_invariants.py -> 39 passed"
  # G2: Shared rooms, channels, or workspaces?
  G2:
    verdict: first_class
    note: "Channel is the shared space, with a manifest, participants, invite lifecycle and declared protocol."
    evidence: "ag2/network/channel.py @ 90f490a"
  # G3: Task threads humans can read and post into?
  G3:
    verdict: first_class
    note: "Humans participate as first-class channel members; ag_ui/, a2ui/, mcp_ui/ and textual.py provide UI surfaces, and Task events stream to observers 'without participating in execution'."
    evidence: "ag2/task.py:12-15 @ 90f490a; ag2/ag_ui/"
  # G4: Mentions or directed addressing?
  G4:

    evidence: "packages/agents/src/index.ts:5522 @ 2f957bc"
  # L5: Fan-out / fan-in?
  L5:
    verdict: first_class
    note: "rfc-sub-agents.md gives fan-out as a motivating case (three specialist personas in parallel, each with isolated state), reached via parallel RPC to child facets."
    evidence: "design/rfc-sub-agents.md @ 2f957bc"
  # L6: Subagents. Are they first-class, or just nested calls?
  L6:
    verdict: first_class
    note: "Sub-agents are child DO facets - any Agent can be mounted as a top-level DO or as a facet, with behaviour adapting to how it was instantiated."
    evidence: "design/rfc-sub-agents.md @ 2f957bc"
  # L7: Retry and backoff policy — declarative or hand-rolled?
  L7:
    verdict: first_class
    note: "Per-call-site and per-class retry policy with full jitter, applied to queue callbacks, schedule callbacks, workflow operations and MCP reconnection, each with an appropriate shouldRetry predicate."
    evidence: "design/retries.md @ 2f957bc"
  # L8: Compensation or rollback on failure?
  L8:
    verdict: absent
    note: "No compensation or rollback. SEVEN FOR SEVEN absent."
    evidence: "packages/agents/src/index.ts @ 2f957bc"
  # L9: Does cancellation propagate through the whole tree?
  L9:
    verdict: first_class
    note: "cancelFiber aborts durably and in memory; cancelFiberByKey cancels by idempotency key. No documented propagation into sub-agent fibers."
    evidence: "packages/agents/src/index.ts:5379-5404 @ 2f957bc"
  # L10: Could this be replaced by Temporal or Restate, or is orchestration inseparable from the agent...
  L10:
    verdict: first_class
    note: "Explicitly delegates to Cloudflare Workflows for durable multi-step orchestration, keeping pause/resume/restart/terminate/sendEvent as retried RPC calls rather than reimplementing a workflow engine."
    evidence: "packages/agents/src/workflows.ts @ 2f957bc; design/retries.md"


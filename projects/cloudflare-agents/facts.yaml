schema_version: 1

project:
  slug: cloudflare-agents
  name: Cloudflare Agents
  depth: deep
  evidence_class: A
  read_on: 2026-08-26
  repo: "https://github.com/cloudflare/agents"
  commit: 2f957bc2a3ffb7aee14792bb3cb658ad3176ed93
  docs: "https://developers.cloudflare.com/agents/"
  version: "monorepo @ 2026-08-26 (agents package; some surfaces @experimental)"
  license: MIT
  license_verdict: REFERENCE_ONLY
  runtime_class: durable_actor
  one_line: Framework for building stateful agents on Cloudflare Workers, backed by Durable Objects.
  thesis: "One agent is one Durable Object: a single-threaded, addressable actor with its own private SQLite that hibernates when idle and wakes on demand. Durability, identity, single-writer ordering and isolation all come from one platform primitive rather than from four subsystems."

probes:

  # --- A. Core abstraction and object model ---
  # A1: What does this system think an agent *is*? State it in one sentence, in their vocabulary.
  A1:
    verdict: first_class
    note: "An Agent IS a Durable Object: single-threaded, addressable by name, with its own private embedded SQLite. Identity, durability and isolation come from one primitive."
    evidence: "packages/agents/src/index.ts @ 2f957bc; design/durable-object-lifecycle.md"
  # A2: What is the root resource — the thing everything else hangs off?
  A2:
    verdict: first_class
    note: "The agent instance itself is the durable session: state survives eviction, WebSockets hibernate and are reconstructed on wake."
    evidence: "design/durable-object-lifecycle.md @ 2f957bc"
  # A3: Is `Agent` persistent or ephemeral? Can it exist while not executing?
  A3:
    verdict: first_class
    note: "Hibernation is the core mechanic: an idle agent is evicted from memory while its SQLite and sockets persist, and it wakes on request, message or alarm."
    evidence: "design/durable-object-lifecycle.md @ 2f957bc"
  # A4: Is `Task` a separate resource from `Run`? If not, which concept is missing and what fills the...
  A4:
    verdict: implicit
    note: "No general Task/Run split, but cf_agents_fibers (durable intent, with idempotency key) vs cf_agents_runs (live attempt) is the same shape for durable execution - and the outer join between them is the orphan-detection signal."
    evidence: "packages/agents/src/index.ts:2250-2291 @ 2f957bc"
  # A5: What is a `Session` attached to: user, agent, task, or execution?
  A5:
    verdict: first_class
    note: "The agent (DO) is the session; sub-agents are child DO facets with their own isolated SQLite."
    evidence: "design/rfc-sub-agents.md @ 2f957bc"
  # A6: Are messages first-class durable resources, or transient function arguments?
  A6:
    verdict: first_class
    note: "Typed wire-protocol messages (cf_agent_tool_approval and other cf_agent_* types) persisted in the agent's SQLite; chat history is durable."
    evidence: "packages/agents/src/chat/wire-types.ts:36 @ 2f957bc"
  # A7: Are artifacts (files, outputs, deliverables) first-class?
  A7:
    verdict: absent
    note: "No artifact resource. Fibers carry a snapshot blob but that is checkpoint state, not an output artifact."
    evidence: "packages/agents/src/index.ts:2285 @ 2f957bc"
  # A8: Can multiple agents participate in one task? How is that represented?
  A8:
    verdict: first_class
    note: "Sub-agents are first-class child DO facets, each an Agent subclass with isolated storage, addressed by logical name plus content digest."
    evidence: "design/rfc-sub-agents.md @ 2f957bc; packages/agents/src/index.ts:1215-1224"
  # A9: Draw the object model as a tree. Only nodes that exist in their code or API.
  A9:
    verdict: first_class
    note: "Agent (=DO) > {state (versioned single-row JSON), this.sql (private SQLite), Connection (hibernatable WS), cf_agents_schedules, cf_agents_queues, cf_agents_fibers, cf_agents_runs, McpServer, Workflow, SubAgent}. See teardown section 3."
    evidence: "packages/agents/src/index.ts @ 2f957bc"

  # --- B. Runtime model ---
  # B1: Does the platform launch agents, host them, or attach to external ones?
  B1:
    verdict: first_class
    note: "The Cloudflare runtime launches and wakes the DO; the SDK does not manage processes. Lifecycle composes ordered capability phases (onStart, onRequest, onAlarm) around the host's hooks."
    evidence: "design/durable-object-lifecycle.md @ 2f957bc"
  # B2: Execution substrate: process, container, microVM, serverless, in-process library, remote HTTP?
  B2:
    verdict: first_class
    note: "A V8 isolate per Durable Object, provided by the platform. The agent runtime IS the isolation unit - unique in this study."
    evidence: "design/durable-object-lifecycle.md @ 2f957bc"
  # B3: Who owns the event loop — platform or agent?
  B3:
    verdict: first_class
    note: "The agent owns its own loop inside the DO; there is no external orchestrator. One DO handles one request at a time."
    evidence: "packages/agents/src/index.ts @ 2f957bc"
  # B4: Who decides when an agent wakes?
  B4:
    verdict: first_class
    note: "getAgentByName(binding, name) resolves and wakes an agent; routeAgentRequest routes HTTP/WS to it."
    evidence: "packages/agents/src/agent-routing.ts @ 2f957bc"
  # B5: Can an agent run indefinitely? What is the actual ceiling?
  B5:
    verdict: first_class
    note: "Unbounded: agents hibernate when idle and live indefinitely. keepAlive() refs prevent eviction while work is in flight."
    evidence: "design/durable-object-lifecycle.md @ 2f957bc"
  # B6: Are there background or unattended agents?
  B6:
    verdict: first_class
    note: "Durable schedules (time and cron) and intervals backed by SQLite plus platform alarms, with hung detection and retries. Also a durable queue."
    evidence: "packages/agents/src/index.ts:6520-6600 @ 2f957bc"
  # B7: Is execution synchronous or asynchronous from the caller's view?
  B7:
    verdict: first_class
    note: "Hibernatable WebSockets are the primary transport; the SDK explicitly has NO in-memory WebSocket mode."
    evidence: "design/durable-object-lifecycle.md @ 2f957bc"
  # B8: Can in-flight work migrate between workers?
  B8:
    verdict: absent
    note: "Work does not float: an agent is pinned to its Durable Object identity. The DO may be relocated by the platform, but the SDK has no concept of moving work to another worker."
    evidence: "design/durable-object-lifecycle.md @ 2f957bc"
  # B9: Can an agent survive a machine restart? Automatically, or with operator action?
  B9:
    verdict: first_class
    note: "Recovery is ambient: state is in SQLite, so waking after eviction restores it. Interrupted fibers are recovered via onFiberRecovered, and overdue schedules run after restart because 'the SQLite row survives but the in-memory alarm does not'."
    evidence: "packages/agents/src/index.ts:6534-6536 @ 2f957bc"
  # B10: Classify: worker/queue, durable actor, attached harness, or in-process library.
  B10:
    verdict: first_class
    note: "durable_actor in the purest form in this study: one agent = one addressable single-threaded object with private durable storage that hibernates and wakes."
    evidence: "design/durable-object-lifecycle.md @ 2f957bc"

  # --- C. Durability and failure semantics ---
  # C1: What state is durable, and what is lost on crash?
  C1:
    verdict: first_class
    note: "Per-agent embedded SQLite via this.sql, plus a single-row JSON state optimisation. Durability is the substrate, not a subsystem - there is no separate checkpoint step."
    evidence: "packages/agents/src/index.ts:2076-2079 @ 2f957bc"
  # C2: *When* is state persisted — every step, every tool call, on checkpoint, never?
  C2:
    verdict: first_class
    note: "A fiber row is written to cf_agents_fibers BEFORE execution begins, and ctx.stash() checkpoints during execution."
    evidence: "packages/agents/src/index.ts:5578-5590 @ 2f957bc"
  # C3: Checkpointing or event sourcing? Can state be rebuilt from a log?
  C3:
    verdict: implicit
    note: "Durable mutable rows plus fiber snapshots, not an append-only event log. Recovery replays a recovery HOOK with a snapshot, not the event history."
    evidence: "packages/agents/src/index.ts:2280-2291 @ 2f957bc"
  # C4: Retry semantics, and at what granularity: run, step, tool call?
  C4:
    verdict: first_class
    note: "FIRST STRUCTURED RETRY POLICY IN THE STUDY: RetryOptions{maxAttempts, baseDelayMs, maxDelayMs} with full-jitter backoff, configurable per call site and per agent class, VALIDATED EAGERLY at enqueue time so bad config throws immediately 'instead of failing minutes later at execution time'. Stored in a retry_options column because in-memory config would be lost on hibernation."
    evidence: "design/retries.md @ 2f957bc; packages/agents/src/retries.ts"
  # C5: At-least-once or exactly-once? What do the docs claim versus what the code does?
  C5:
    verdict: first_class
    note: "At-least-once by default, with exactly-once available via idempotency keys on fibers. isErrorRetryable deliberately excludes overloaded-DO errors because 'retrying would make congestion worse'."
    evidence: "design/retries.md @ 2f957bc"
  # C6: Is there an idempotency model for tool side effects?
  C6:
    verdict: first_class
    note: "GAP CLOSED - THE ONLY IDEMPOTENCY MECHANISM IN SEVEN PROJECTS. cf_agents_fibers declares idempotency_key TEXT UNIQUE, and startFiber checks it before doing any work, returning the existing fiber with accepted:false instead of re-executing. Refuses ambiguity: if fiberId and idempotencyKey point at different fibers it throws rather than guessing. VERIFIED by running the test: second call accepted=false and the side-effect log contains only ['managed:first']."
    evidence: "packages/agents/src/index.ts:2282,5522-5590 @ 2f957bc; test 'should dedupe managed fibers by idempotency key'; verified locally 2026-08-26: pnpm build + vitest run src/tests/run-fiber.test.ts -> 48/48 pass"
  # C7: Process crash recovery: what resumes, and from where?
  C7:
    verdict: first_class
    note: "State is read from SQLite on wake; a fiber's snapshot plus onFiberRecovered give a defined resumption entry point after eviction mid-execution."
    evidence: "packages/agents/src/index.ts:5485-5497 @ 2f957bc"
  # C8: Node loss: is work re-dispatched, and how is it detected?
  C8:
    verdict: first_class
    note: "BEST LOST-WORKER DETECTION IN THE STUDY. Hung interval schedules are detected via execution_started_at <= now - hungScheduleTimeoutSeconds (default 30s) and become eligible again; running-but-not-yet-hung intervals still get a future re-check alarm; orphaned fibers are found by outer-joining cf_agents_fibers against cf_agents_runs where the run row is gone."
    evidence: "packages/agents/src/index.ts:6500-6560 @ 2f957bc"
  # C9: Context-window overflow: truncation, summarisation, or failure?
  C9:
    verdict: absent
    note: "No context-window management or compaction in the SDK."
    evidence: "packages/agents/src/index.ts @ 2f957bc"
  # C10: Timers, scheduled execution, long sleeps — durable across restart?
  C10:
    verdict: first_class
    note: "Durable timers via platform alarms: schedule() for time/cron, scheduleEvery() for intervals, all backed by SQLite rows so they survive hibernation and restart."
    evidence: "packages/agents/src/index.ts:6514-6600 @ 2f957bc"
  # C11: Human-in-the-loop pause and resume: durable, or in-memory only?
  C11:
    verdict: first_class
    note: "Tool approval is a typed wire message (cf_agent_tool_approval) with state transitions, and a pending approval survives eviction by construction because the agent's storage and sockets are durable."
    evidence: "packages/agents/src/chat/wire-types.ts:36,207 @ 2f957bc; packages/agents/src/chat/tool-state.ts:195"
  # C12: Can a definition be upgraded while runs are in flight? What happens to them?
  C12:
    verdict: implicit
    note: "Storage schema IS versioned (CURRENT_SCHEMA_VERSION = 11, stored as a row and checked on wake to skip DDL) with forward-only idempotent migrations. But agent CODE version is not pinned to in-flight fibers, and fiber snapshots carry no version, so recovery hands a pre-upgrade blob to post-upgrade code."
    evidence: "packages/agents/src/index.ts:1197,2081-2087,2253 @ 2f957bc"

  # --- D. Agent identity and lifecycle ---
  # D1: Is an agent globally addressable? By what identifier?
  D1:
    verdict: first_class
    note: "Identity is the Durable Object name and ctx.id.name is authoritative. Lifecycle 'never writes a duplicate name', reading a legacy __ps_name key only as a migration fallback."
    evidence: "design/durable-object-lifecycle.md @ 2f957bc"
  # D2: Does identity survive process restart?
  D2:
    verdict: first_class
    note: "Identity is durable by platform: the named DO exists whether or not it is running, with its storage intact."
    evidence: "design/durable-object-lifecycle.md @ 2f957bc"
  # D3: Is identity distinct from runtime instance?
  D3:
    verdict: implicit
    note: "The class is the definition and the named instance is the execution, but there is no Agent-definition RESOURCE distinct from the deployed class."
    evidence: "design/rfc-sub-agents.md @ 2f957bc"
  # D4: Are agents versioned? Immutable or mutable definitions?
  D4:
    verdict: absent
    note: "No agent versioning. Sub-agent identity does embed a SHA-256 content digest alongside the logical name, which is the closest thing."
    evidence: "packages/agents/src/index.ts:1215-1224 @ 2f957bc"
  # D5: Is there a registry or catalog?
  D5:
    verdict: implicit
    note: "NO SEPARATE REGISTRY IS NEEDED because platform naming IS the registry: getAgentByName(binding, name) resolves any agent. Bindings are declared in wrangler config."
    evidence: "packages/agents/src/agent-routing.ts @ 2f957bc"
  # D6: Can agents discover each other at runtime?
  D6:
    verdict: absent
    note: "No runtime discovery or capability query."
    evidence: "packages/agents/src/agent-routing.ts @ 2f957bc"
  # D7: Can agents advertise capabilities? In what format?
  D7:
    verdict: absent
    note: "No declared capability model for agents or runtimes - nothing comparable to Omnigent's 16 axes. Capability here means which tools an agent has."
    evidence: "packages/agents/src/agent-tools.ts @ 2f957bc"
  # D8: Is there an owner, team, or tenant on the agent record?
  D8:
    verdict: absent
    note: "No owner, team or tenant field on any resource."
    evidence: "packages/agents/src/index.ts @ 2f957bc"
  # D9: Can an agent be suspended, revoked, or deprecated?
  D9:
    verdict: absent
    note: "No suspend, revoke or deprecate lifecycle. SEVEN FOR SEVEN absent."
    evidence: "packages/agents/src/index.ts @ 2f957bc"
  # D10: Is there anything resembling a declarative agent manifest?
  D10:
    verdict: absent
    note: "No agent manifest: an agent is a TypeScript class plus a wrangler binding."
    evidence: "design/rfc-sub-agents.md @ 2f957bc"

  # --- E. Harness and runtime interoperability ---
  # E1: What is the minimum interface an agent implementation must satisfy?
  E1:
    verdict: absent
    note: "NO ADAPTER CONTRACT - the premise is that YOU write the agent as an Agent subclass. Extension is Lifecycle capability composition, not adaptation of a third-party agent. This is the one ADR-0004 challenge in the study."
    evidence: "design/durable-object-lifecycle.md @ 2f957bc"
  # E2: Transport: stdin/stdout, HTTP, gRPC, WebSocket, in-process, ACP, A2A?
  E2:
    verdict: absent
    note: "No harness transport, because there is no external harness. Sub-agents are reached by native DO RPC."
    evidence: "design/rfc-sub-agents.md @ 2f957bc"
  # E3: Can it host a foreign agent (Claude Code, Codex, OpenHands, LangGraph, ADK)?
  E3:
    verdict: absent
    note: "No third-party agent adapters. Integrations are for models and tools, not for other people's agents."
    evidence: "packages/agents/src/index.ts @ 2f957bc"
  # E4: Is there an event stream out of a running agent? What granularity?
  E4:
    verdict: first_class
    note: "A typed observability event stream via observability.emit(), with events including queue:retry and schedule:retry carrying attempt and maxAttempts, plus OTel spans."
    evidence: "design/retries.md @ 2f957bc; packages/agents/src/observability/"
  # E5: Are tool calls externally observable, or internal to the agent?
  E5:
    verdict: first_class
    note: "Tool calls are observable through the chat protocol and GenAI spans, with cloudflare.agents.tool.approval.state and tool.count attributes."
    evidence: "packages/agents/src/observability/genai/attributes.ts:10-25 @ 2f957bc"
  # E6: How is context injected at start?
  E6:
    verdict: implicit
    note: "Class-level static options (retry, hibernate, sendIdentityOnConnect, hungScheduleTimeoutSeconds) plus wrangler bindings. Configuration is code, not opaque data."
    evidence: "design/retries.md @ 2f957bc; packages/agents/src/index.ts:1379-1460"
  # E7: Is cancellation supported? Cooperative or forced? Does it propagate to subagents?
  E7:
    verdict: first_class
    note: "cancelFiber flips durable status to 'aborted' AND aborts the in-memory AbortController, guarded by WHERE status IN ('pending','running') so a terminal fiber cannot be re-cancelled."
    evidence: "packages/agents/src/index.ts:5379-5396 @ 2f957bc"
  # E8: Can a run be checkpointed and restored by the platform, or only by the agent?
  E8:
    verdict: first_class
    note: "Fibers expose ctx.stash() to checkpoint during execution and onFiberRecovered to resume after eviction - a genuine durable-execution primitive inside an actor."
    evidence: "packages/agents/src/index.ts:5485-5497 @ 2f957bc"
  # E9: Which of these would be hard to adapt, and why?
  E9:
    verdict: first_class
    note: "Extensive design/ RFC directory (43 documents) documenting the Lifecycle contract, capability phases, host hooks, and the sub-agent model. LifecycleObject 'names the host contract without introducing another base class'."
    evidence: "design/durable-object-lifecycle.md @ 2f957bc"

  # --- F. Agent-to-agent communication ---
  # F1: Direct messages between agents?
  F1:
    verdict: absent
    note: "No agent-to-agent messaging. SEVEN FOR SEVEN. I expected counter-evidence here (a channels package exists) but @cloudflare/channels is HUMAN-to-agent transport: Slack, Telegram, email and voice adapters, with ChannelIdentity{channelKey, scope, subject} naming a human correspondent."
    evidence: "packages/channels/src/identity.ts:1-8 @ 2f957bc; design/channels.md"
  # F2: Channels, topics, or pub/sub?
  F2:
    verdict: absent
    note: "No agent-to-agent channels or pub/sub. The channels package routes provider events to application routes, not between agents."
    evidence: "design/channels.md @ 2f957bc"
  # F3: Task delegation as a distinct mechanism from messaging?
  F3:
    verdict: first_class
    note: "Sub-agents are spawned via this.subAgent(Class, name) as child DO facets with isolated SQLite, called by TYPED RPC - not by message passing."
    evidence: "design/rfc-sub-agents.md @ 2f957bc"
  # F4: Synchronous RPC between agents?
  F4:
    verdict: first_class
    note: "Native Durable Object RPC between parent and child agents, with structured-cloneable arguments and typed stubs. parentAgent() returns a typed stub to the direct parent."
    evidence: "packages/agents/src/index.ts:8139-8153 @ 2f957bc"
  # F5: Asynchronous inbox or mailbox?
  F5:
    verdict: absent
    note: "No mailbox. The 'inbox' in the docs is a user-defined parent agent holding shared state, not a message queue."
    evidence: "packages/agents/src/index.ts:8132 @ 2f957bc"
  # F6: Is delivery durable? Survives restart of sender and receiver?
  F6:
    verdict: absent
    note: "No inter-agent delivery guarantees, because there is no inter-agent messaging layer. Coordination is shared durable state plus direct RPC."
    evidence: "design/rfc-sub-agents.md @ 2f957bc"
  # F7: Is message ordering guaranteed? Per what scope?
  F7:
    verdict: first_class
    note: "Total ordering within an agent is structural: a Durable Object is single-threaded and processes one request at a time, so interleaving cannot occur."
    evidence: "design/rfc-sub-agents.md @ 2f957bc"
  # F8: Acknowledgement or delivery receipts?
  F8:
    verdict: implicit
    note: "RPC returns a value, which is an implicit acknowledgement, but there is no message-level ack."
    evidence: "packages/agents/src/index.ts:8139 @ 2f957bc"
  # F9: Correlation ids for request/response pairing?
  F9:
    verdict: first_class
    note: "Trace correlation via OTel with a cloudflare.agents.turn.request_id attribute, plus fiber_id and idempotency_key on durable work."
    evidence: "packages/agents/src/observability/genai/attributes.ts:24 @ 2f957bc"
  # F10: Conversation threading?
  F10:
    verdict: absent
    note: "No conversation forking or branching in the SDK core."
    evidence: "packages/agents/src/chat/ @ 2f957bc"
  # F11: Capability-based routing — address by what an agent *can do* rather than who it is?
  F11:
    verdict: implicit
    note: "design/rfc-sub-agent-routing.md and sub-routing.ts route requests to sub-agents by name and path, but not by declared capability."
    evidence: "packages/agents/src/sub-routing.ts @ 2f957bc"

  # --- G. Human-agent collaboration ---
  # G1: Is a human modelled as a special kind of agent, a distinct principal type, or not modelled?
  G1:
    verdict: absent
    note: "No principals of any kind. Auth is a developer-supplied hook (onBeforeConnect / onBeforeRequest) that may return a Response to reject."
    evidence: "packages/agents/src/agent-routing.ts:73-84 @ 2f957bc"
  # G2: Shared rooms, channels, or workspaces?
  G2:
    verdict: absent
    note: "No workspace or room model, though one agent per room is the documented pattern."
    evidence: "design/rfc-sub-agents.md @ 2f957bc"
  # G3: Task threads humans can read and post into?
  G3:
    verdict: first_class
    note: "Humans connect over hibernatable WebSockets and drive the agent live; readonly-connections.md adds observers who cannot drive."
    evidence: "design/readonly-connections.md @ 2f957bc"
  # G4: Mentions or directed addressing?
  G4:
    verdict: absent
    note: "No mentions or participant addressing."
    evidence: "packages/agents/src/chat/ @ 2f957bc"
  # G5: Approval gates. Blocking or advisory? Durable while pending?
  G5:
    verdict: first_class
    note: "Tool approval as a typed wire message (cf_agent_tool_approval) with toolApprovalUpdate state transitions, durable because the agent's storage is durable."
    evidence: "packages/agents/src/chat/tool-state.ts:195 @ 2f957bc"
  # G6: Mid-run intervention: can a human redirect without restarting?
  G6:
    verdict: first_class
    note: "Approve or reject tool calls, cancel fibers (durable status plus AbortController), and drive or observe over WebSocket."
    evidence: "packages/agents/src/index.ts:5379-5396 @ 2f957bc"
  # G7: Agent status and presence visible to humans?
  G7:
    verdict: first_class
    note: "Fiber status (pending/running/completed/error/aborted/interrupted) is inspectable via inspectFiber, inspectFiberByKey and listFibers, plus a typed observability event stream."
    evidence: "packages/agents/src/index.ts:5361-5377 @ 2f957bc"
  # G8: Notifications or escalation when an agent is blocked?
  G8:
    verdict: implicit
    note: "The channels package can deliver to Slack, Telegram, email or voice, which is a notification path, but there is no escalation policy."
    evidence: "packages/channels/src/adapters/ @ 2f957bc"
  # G9: Shared scratchpad or working surface?
  G9:
    verdict: implicit
    note: "Agent state and SQLite are shared context for humans connected to that agent, but there is no distinct scratchpad resource."
    evidence: "packages/agents/src/index.ts:2076 @ 2f957bc"
  # G10: Can a human see the context an agent is operating on?
  G10:
    verdict: first_class
    note: "Full durable chat history plus fiber inspection plus OTel spans following GenAI semantic conventions."
    evidence: "packages/agents/src/observability/genai/attributes.ts @ 2f957bc"

  # --- H. Context and memory ---
  # H1: Which of these exist as *separate* concepts: prompt context, working state, session history, ...
  H1:
    verdict: absent
    note: "No memory subsystem. A skills/ directory and design/skills.md continue the filesystem-skills pattern. FIFTH CONSECUTIVE PROJECT with no memory store."
    evidence: "packages/agents/src/skills/ @ 2f957bc; design/skills.md"
  # H2: Who owns memory: agent, human, workspace, task, or tenant?
  H2:
    verdict: implicit
    note: "Each agent's SQLite is private to it, so knowledge is owned by whichever agent holds the database - the storage boundary IS the ownership boundary."
    evidence: "design/rfc-sub-agents.md @ 2f957bc"
  # H3: Can memory be shared between agents? At what granularity?
  H3:
    verdict: implicit
    note: "A child reads shared facts from its parent by RPC (the getSharedMemory docstring pattern), which is shared STATE rather than a shared memory service."
    evidence: "packages/agents/src/index.ts:8132-8134 @ 2f957bc"
  # H4: Are there permissions on memory?
  H4:
    verdict: first_class
    note: "STRUCTURAL rather than declarative: a sub-agent's private SQLite means the parent's LLM has no SQL path to the child's data. rfc-sub-agents.md argues this explicitly - enforcement must be structural because 'the LLM can bypass the queue by writing SQL'."
    evidence: "design/rfc-sub-agents.md @ 2f957bc"
  # H5: Is provenance tracked — where a memory came from?
  H5:
    verdict: absent
    note: "No provenance tracking on knowledge."
    evidence: "design/skills.md @ 2f957bc"
  # H6: Expiry, TTL, or forgetting?
  H6:
    verdict: implicit
    note: "fiberRecoveryMaxAgeMs ages out unrecoverable fiber rows, but there is no TTL on knowledge."

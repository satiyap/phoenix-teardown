  # --- L. Orchestration and scheduling ---
  # L1: Does it distinguish agent coordination from workflow orchestration?
  L1:
    verdict: first_class
    note: "Clean: the agent owns its own durable orchestration (schedules, queues, fibers, sub-agents) and delegates long multi-step workflows to Cloudflare Workflows via typed handles."

lessons:
  - "The cleanest affirmative case for durable identity in the study: identity is the DO name (ctx.id.name authoritative, never duplicated), it exists whether or not the agent runs, and NO separate registry is needed because platform naming IS the registry. (confirms ADR-0001)"
  - "GAP CLOSED. idempotency_key UNIQUE on the fiber ledger, checked before execution, verified by a test asserting the side effect ran exactly once. After six projects with nothing, this is the precedent our effect-ledger design needed. (closes C6)"
  - "I expected the first agent-to-agent messaging counter-evidence here (a channels package exists). It is HUMAN-to-agent transport - Slack, Telegram, email, voice - with ChannelIdentity naming a human correspondent. Sub-agents use typed RPC and shared parent state. SEVEN FOR SEVEN. ADR-0003 should be rewritten around the shared-substrate pattern. (confirms ADR-0003 decisively)"
  - "THE ONE GENUINE ADR-0004 CHALLENGE: there is no adapter contract at all, because the premise is that you write the agent as a subclass and extend via Lifecycle capabilities. This buys enormous integration depth - durability, hibernation and tracing all ambient - at the cost of never running someone else's agent. Our answer must be that adapting existing agents is a REQUIREMENT, not a preference, or this design is simply better. (challenges ADR-0004)"
  - "MCP as protocol, extended: connection state is PERSISTED in a server_options column with per-server retry and OAuth re-establishment, because MCP servers are long-lived resources and hibernation would otherwise lose them. (confirms and extends ADR-0005)"
  - "Ships no principals at all; auth is onBeforeConnect. Defensible for an SDK where the developer owns the edge, and honest about which paths bypass the hook - but it means every consumer reimplements authorization, which is what a platform should not delegate. (challenges ADR-0007 weakly, confirms by demonstrating the cost)"
  - "Fifth consecutive project with filesystem-style skills and no memory store, and getSharedMemory is explicitly shared STATE, not semantic memory. Settled. (confirms ADR-0008)"
  - "No pluggable sandbox provider, because the DO IS the isolate. The insight to keep: a child DO's private SQLite makes a policy STRUCTURAL rather than conventional, because 'the LLM can bypass the queue by writing SQL'. Our sandbox interface should therefore also be a STORAGE boundary, not only a process boundary. (challenges ADR-0009)"
  - "Third real OTel and the best on convention: GenAI semconv where it exists, cloudflare.agents.* where it does not, never bare keys, never ai.*. Plus invocation-bound span lifetimes and a refusal to invent otel.status_code. AMEND ADR-0010 to require semconv adherence and a declared vendor namespace, not merely OTel adoption. (confirms ADR-0010 strongly)"
  - "Storage schema is versioned (v11) and migrated on wake, but fiber snapshots carry NO version and code version is not pinned to in-flight work. Adds a THIRD dimension to the pin: checkpoint payloads need their own version, separate from agent version and adapter identity, because the recovery hook must know which shape it is being handed. (amends ADR-0011)"
  - "NEW: a guarantee you cannot keep is worse than an honest limitation. channels.md rejects its own previous durable implementation because it 'never delivered exactly-once ingress - a crash between the callback and its receipt write replays the callback anyway'. This sentence should govern our v0.1 boundary."
  - "NEW: single-writer can come from the platform rather than from discipline. One alarm owner per agent means scheduling cannot double-fire - directly fixing the flaw found in Omnigent's in-process scheduler."

adr_impact:
  - adr: ADR-0001
    effect: confirms
    note: "Cleanest affirmative case: identity is the DO name, durable by platform, and naming IS the registry."
  - adr: ADR-0002
    effect: neutral
    note: "No general Task/Run split, though the fiber ledger vs run table is the same shape for durable execution."
  - adr: ADR-0003
    effect: confirms
    note: "channels is human-to-agent, not agent-to-agent. Sub-agents use typed RPC. Seven for seven."
  - adr: ADR-0004
    effect: challenges
    note: "No adapter contract at all - you write the agent. A coherent alternative that trades integration depth for never running someone else's agent."
  - adr: ADR-0005
    effect: confirms
    note: "MCP as protocol, with persisted connection state and per-server retry surviving hibernation."
  - adr: ADR-0006
    effect: neutral
    note: "No A2A."
  - adr: ADR-0007
    effect: challenges
    note: "No principals; auth is a developer hook. Honest about its bypasses, but delegates what a platform should own."
  - adr: ADR-0008
    effect: confirms
    note: "Fifth consecutive project with filesystem skills and no memory store."
  - adr: ADR-0009
    effect: challenges
    note: "No pluggable sandbox - the DO is the isolate. Keep the insight that a storage boundary is an enforcement boundary."
  - adr: ADR-0010
    effect: confirms
    note: "Best OTel convention adherence: GenAI semconv, declared vendor namespace, invocation-bound spans."
  - adr: ADR-0011
    effect: amends
    note: "Versions its own schema but leaves user checkpoint payloads unversioned. Checkpoint payloads need their own version."
  - adr: ADR-0012
    effect: neutral
    note: "No declared capability model for runtimes."
  - adr: ADR-0013
    effect: neutral
    note: "No policy engine."

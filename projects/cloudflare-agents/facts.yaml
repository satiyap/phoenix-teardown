  S2:
    verdict: first_class_answer
    note: "BEST ANSWER IN THE STUDY, VERIFIED BY RUNNING THE TEST. idempotency_key TEXT UNIQUE on the fiber ledger; startFiber checks it before any work and returns accepted:false for a duplicate. Test asserts first.accepted=true, second.accepted=false, same fiberId, and executionLog=['managed:first'] - the side effect ran ONCE. Reinforced by a single-threaded DO (no concurrent writers), the fiber row being written before execution, ctx.stash() checkpoints, and onFiberRecovered for eviction mid-flight."
    evidence: "packages/agents/src/index.ts:2282,5522-5590 @ 2f957bc; packages/agents/src/tests/run-fiber.test.ts:578-595; verified locally 2026-08-26: pnpm build + vitest run src/tests/run-fiber.test.ts -> 48/48 pass"
  # S3: Upgrade mid-flight
  S3:
    verdict: inferable
    note: "Storage schema is versioned (v11) and migrated forward on wake, and a fiber's snapshot plus onFiberRecovered give recovery a defined entry point. BUT snapshots carry no version and agent code version is not pinned to in-flight fibers, so recovery hands a pre-upgrade blob to post-upgrade code."
    evidence: "packages/agents/src/index.ts:1197,2253 @ 2f957bc"
  # S4: Concurrent memory write
  S4:
    verdict: inferable
    note: "DISSOLVED rather than solved: a Durable Object is single-threaded, so read-modify-write cannot interleave within an agent. The cleanest resolution of this scenario in the study - the race Omnigent had to fix with BEGIN IMMEDIATE cannot arise here."
    evidence: "design/rfc-sub-agents.md @ 2f957bc"
  # S5: Cancellation tree
  S5:
    verdict: inferable
    note: "cancelFiber flips durable status to aborted AND aborts the in-memory AbortController, guarded so a terminal fiber cannot be re-cancelled, with cancelFiberByKey for idempotency-key cancellation. No documented propagation into sub-agent fibers."
    evidence: "packages/agents/src/index.ts:5379-5404 @ 2f957bc"
  # S6: Silent context loss
  S6:
    verdict: undefined
    note: "No compaction in the SDK."
    evidence: "packages/agents/src/chat/ @ 2f957bc"
  # S7: Poison message
  S7:
    verdict: inferable
    note: "Approached from the LIVENESS side rather than the queue side: a recovery scan that makes no forward progress backs off EXPONENTIALLY so a repeatedly-throwing recovery hook cannot wake the DO indefinitely, and a scan that recovers anything resets the streak. fiberRecoveryMaxAgeMs ages rows out. No DLQ, but the cost of poison work is bounded."
    evidence: "packages/agents/src/index.ts:6588-6600 @ 2f957bc"
  # S8: Tenant leak
  S8:
    verdict: inferable
    note: "Not modelled, but one Durable Object per tenant gives each tenant a PRIVATE SQLite database - isolation by storage boundary rather than by query predicate, which cannot be forgotten in a WHERE clause."
    evidence: "design/rfc-sub-agents.md @ 2f957bc"
  # S9: Runaway spend
  S9:
    verdict: undefined
    note: "No budget, quota or cost accounting."
    evidence: "packages/agents/src/index.ts @ 2f957bc"
  # S10: Zombie sandbox
  S10:
    verdict: first_class_answer
    note: "BEST ANSWER IN THE STUDY. Hung interval schedules detected via execution_started_at <= now - hungScheduleTimeoutSeconds (default 30s) and made eligible again; running-but-not-yet-hung intervals still get a future re-check alarm so the runtime revisits them; overdue schedules run after restart because 'the SQLite row survives but the in-memory alarm does not'; orphaned fibers found by outer-joining the ledger against cf_agents_runs where the run row is gone; and a root-side index tells the alarm owner which idle facets need recovery checks."
    evidence: "packages/agents/src/index.ts:6500-6600,2258-2261 @ 2f957bc"

object_model: |
  Agent                       = one Durable Object (addressable by name)
   |-- state                  single-row JSON, versioned schema (v11)
   |-- this.sql               private embedded SQLite
   |-- Connection             hibernatable WebSocket
   |-- cf_agents_schedules    time / cron / interval, with retry_options
   |-- cf_agents_queues       durable queue with retry_options
   |-- cf_agents_fibers       durable execution ledger - fiber_id PK,
   |                          IDEMPOTENCY_KEY UNIQUE, status, snapshot
   |-- cf_agents_runs         in-flight run rows (orphan detection)
   |-- McpServer              persisted MCP connections, per-server retry
   |-- Workflow               handles to Cloudflare Workflows
   `-- SubAgent               child DO facet, own SQLite, typed RPC

strongest_ideas:
  - "idempotency_key UNIQUE on a durable execution ledger, checked BEFORE execution, returning accepted:false for a duplicate. The only working idempotency precedent in seven projects, and verified by a test that asserts the side effect ran once."
  - "Refusing ambiguity: if fiberId and idempotencyKey refer to different fibers, throw rather than guess."
  - "Hung-work detection via an execution_started_at cutoff, PLUS a re-check alarm for work that is running but not yet hung - the liveness case most implementations forget."
  - "Orphan detection by outer join: a ledger row with no corresponding run row means a dead process."
  - "Exponential backoff on recovery scans that make no forward progress, reset by any successful recovery. A poison-message answer from the liveness side rather than the queue side."
  - "Eager validation of retry options at enqueue time, so bad config throws immediately 'instead of failing minutes later at execution time'."
  - "Knowing when NOT to retry: overloaded-DO errors are excluded because 'retrying would make congestion worse'."
  - "Retry config stored in the row rather than memory, because hibernation would lose it."
  - "A storage boundary as an ENFORCEMENT boundary: if the LLM can write SQL, an approval queue in the same database is a convention, not a control. Put the data in a child DO and enforcement becomes structural."
  - "No in-memory WebSocket mode - refusing to offer the non-durable path at all."
  - "OTel GenAI semantic conventions where they exist, an explicit cloudflare.agents.* vendor namespace where they do not, and never squatting on ai.* (the Vercel AI SDK's de-facto namespace)."
  - "Span lifetimes bound to the invocation, so a span cannot outlive the native invocation that owns its tracing context."
  - "Declining to invent an otel.status_code attribute because status is span state in OTel, not an attribute."
  - "Single-writer by PLATFORM: the DO owns its own alarm, so scheduling cannot double-fire across replicas (contrast Omnigent's in-process scheduler)."
  - "Versioned storage schema stored as a row and checked on wake, with forward-only idempotent migrations (CREATE TABLE IF NOT EXISTS, ADD COLUMN IF NOT EXISTS)."
  - "Capability hooks run OUTSIDE the host's async context so behaviour does not depend on which entrypoint triggered the phase."
  - "Documenting your own auth bypasses in the docstring of the method that bypasses them."
  - "A root-side index of descendant facet fibers that holds no authority, only a wakeup list - answering 'who checks on a sleeping child?'"
  - "Sub-agent identity as logical name plus SHA-256 content digest."
  - "Persisted MCP connections with per-server retry and OAuth re-establishment surviving hibernation - no other project persists MCP connection state."
  - "A design doc that deliberately describes NO API so it cannot go stale, and says so."
  - "Rejecting a durable wrapper until a real consumer proves the interface: 'not rejected, deferred... Speculatively adding it would re-import every problem above.'"
  - "Rejecting its own previous durable implementation because it 'never delivered exactly-once ingress... so the guarantee it appeared to offer was not one it could keep.' A guarantee you cannot keep is worse than an honest limitation."

weakest_choices:
  - "Total platform lock-in: every mechanism assumes Durable Objects, hibernation, alarms and embedded SQLite. Unportable by design."
  - "No authentication, authorization or principals. Auth is a hook the developer must write, so every consumer reimplements it."
  - "No tenancy, quotas or cost accounting."
  - "No agent versioning or revocation."
  - "No adapter contract for third-party agents - you write the agent, so a meta-harness cannot be built on this without inverting it."
  - "No declared capability model."
  - "A 13,000-line index.ts: fibers, schedules, queues, MCP, workflows, sub-agents, state and RPC all in one file."
  - "Fiber snapshots carry NO version and agent code version is not pinned to in-flight fibers, so recovery hands a pre-upgrade blob to post-upgrade code."
  - "No compensation or rollback."
  - "Monorepo build friction: better-sqlite3 fails to compile on Node 26, and vitest needs the agents package plus an optional peer built before tests resolve."


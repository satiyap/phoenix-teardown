    evidence: "design/rfc-sub-agents.md @ 2f957bc"
  # L3: Cron or scheduled triggers?
  L3:
    verdict: first_class
    note: "Durable time, cron and interval schedules backed by SQLite plus alarms, with hung detection, retries and post-restart catch-up."
    evidence: "packages/agents/src/index.ts:6520-6600 @ 2f957bc"
  # L4: Dynamic task spawning at runtime?
  L4:
    verdict: first_class

  # --- S. Hard scenarios ---
  # S1: Delegated authority
  S1:
    verdict: first_class_answer
    note: "BEST ANSWER IN THE STUDY. The agent has its own WORKLOAD IDENTITY and can obtain a token three ways - as itself, for a federated JWT (get_workload_access_token_for_jwt), or for a known user id (get_workload_access_token_for_user_id) - with three named flows M2M | USER_FEDERATION | ON_BEHALF_OF_TOKEN_EXCHANGE, typed user identifiers, custom_state for callback validation, and Cedar policies in which 'principal' is a first-class term. Omnigent gives a HUMAN a delegated grant; this gives the AGENT a principal and a way to act on someone's behalf."
    evidence: "src/bedrock_agentcore/services/identity.py:140-155 @ 826416a; src/bedrock_agentcore/identity/auth.py:30; verified live against bedrock-agentcore 1.22.0 (PyPI, 2026-08-26)"
  # S2: Torn side effect
  S2:
    verdict: inferable
    note: "No effect ledger in the SDK, but clientToken is a caller-supplied idempotency token applied uniformly across mutating control-plane operations - the ADR-0014 key as a platform-wide convention rather than a per-feature addition."
    evidence: "src/bedrock_agentcore/policy/client.py:250,267-268 @ 826416a"
  # S3: Upgrade mid-flight
  S3:
    verdict: undefined
    note: "No agent version and no pin anywhere in the SDK. Twelve projects."
    evidence: "src/bedrock_agentcore/services/identity.py @ 826416a"
  # S4: Concurrent memory write
  S4:
    verdict: inferable
    note: "Namespaces partition memory by org and actor, and typed strategies separate semantic recall from summarisation from user preferences, so concurrent writes to different KINDS do not contend. Weaker than ADK's schema-validated scopes because a namespace path is a convention - though wildcards are refused, which bounds the damage."
    evidence: "src/bedrock_agentcore/memory/constants.py:13-35,76-78 @ 826416a; src/bedrock_agentcore/_utils/namespace.py:18-25"
  # S5: Cancellation tree
  S5:
    verdict: undefined
    note: "Cancellation semantics are not visible in the SDK."
    evidence: "src/bedrock_agentcore/runtime/models.py @ 826416a"
  # S6: Silent context loss
  S6:
    verdict: inferable
    note: "SUMMARIZATION is a declared, configured memory strategy so context reduction is named rather than incidental - but no loss signal is emitted to the caller."
    evidence: "src/bedrock_agentcore/memory/constants.py:24 @ 826416a"
  # S7: Poison message
  S7:
    verdict: undefined
    note: "Not visible in the SDK."
    evidence: "src/bedrock_agentcore/ @ 826416a"
  # S8: Tenant leak
  S8:
    verdict: inferable
    note: "AWS accounts, regions and IAM are the boundary - strongest in the study - plus /org/ namespaces and a refusal of wildcard namespace queries. But enforcement is server-side and unverifiable from here."
    evidence: "src/bedrock_agentcore/_utils/namespace.py:23-25 @ 826416a"
  # S9: Runaway spend
  S9:
    verdict: undefined
    note: "A payments/ module exists but is not a budget control; AWS billing is not an agent-level answer."
    evidence: "src/bedrock_agentcore/payments/ @ 826416a"
  # S10: Zombie sandbox
  S10:
    verdict: inferable
    note: "PingStatus distinguishes Healthy from HealthyBusy - idle-alive from working-alive - and force_healthy is an explicit operator recovery action. The most precise health model in the study; reaping itself is server-side."
    evidence: "src/bedrock_agentcore/runtime/models.py:9-13,168 @ 826416a"

object_model: |
  Workload (the agent)          has its own identity and access tokens
   `-- workload_access_token    3 variants: bare | for_jwt | for_user_id

  CredentialProvider            CRUD resources, control plane
   |-- OAuth2CredentialProvider create / get / list / update / delete
   `-- ApiKeyCredentialProvider create / get / list / delete

  PolicyEngine                  create / get / list / update / delete
   `-- Policy                   Cedar: permit(principal, action, resource)
        `-- PolicyGeneration    natural language -> reviewable policy ASSETS

  Memory                        create / update / delete
   |-- strategies[]             SEMANTIC | SUMMARIZATION | USER_PREFERENCE
   |                            | CUSTOM  (+ *_OVERRIDE variants)
   `-- MemoryRecord             addressed by hierarchical NAMESPACE
                                /org/MyOrg/ - /actor/Jane/
                                /strategies/{id}/actors/{actorId}/

  Gateway, KnowledgeBase, Tools, Payments, Evaluation, ConfigBundle
  Runtime                       PingStatus: Healthy | HealthyBusy

strongest_ideas:
  - "A WORKLOAD IDENTITY for the agent itself, so the agent is a principal rather than a bearer of someone else's credentials."
  - "Three token variants - as itself, for a federated JWT, for a known user id - making 'on whose behalf' an explicit dimension of every token request."
  - "ON_BEHALF_OF_TOKEN_EXCHANGE as a NAMED flow, distinct from user federation. Delegation is not a special case of login."
  - "UserTokenIdentifier and UserIdIdentifier as distinct model types, so 'which user' is never an untyped string."
  - "CEDAR as the policy language: formal semantics, an existing verification toolchain, and principal/action/resource as language primitives. Choosing a verifiable standard over a bespoke DSL - the same instinct as choosing OTel over a proprietary trace format."
  - "start_policy_generation: natural language in, generated Cedar policies out as REVIEWABLE ASSETS you inspect before they take effect. The only instance in twelve projects of treating a policy as something you evaluate before enforcing."
  - "Control-plane / data-plane split with separate clients, separate method allow-lists and separate endpoint overrides - administration and use are different surfaces with different permissions."
  - "__getattr__ forwarding ONLY allow-listed method names, with an AttributeError that points at the boto3 docs - an SDK that cannot accidentally expose an unvetted API."
  - "Typed memory strategies, with USER_PREFERENCE as a kind distinct from semantic recall and summarisation. Different memory kinds have different write patterns, lifetimes and privacy consequences."
  - "Hierarchical memory namespaces (/org/MyOrg/, /actor/Jane/) with exact-match and prefix-query variants."
  - "REFUSING WILDCARDS in namespaces ('Wildcards (*) are not supported'), so /actor/*/ cannot sweep every actor's memory."
  - "PingStatus.Healthy vs HealthyBusy - idle-alive and working-alive are different answers to a health probe, and conflating them is how supervisors kill busy workers or miss stuck ones."
  - "wait_until_deleted as a distinct helper, acknowledging that deletion is asynchronous and code assuming otherwise races."
  - "Explicit _FAILED_STATUSES (CREATE_FAILED, UPDATE_FAILED, DELETE_FAILED, GENERATE_FAILED) so failure is a terminal STATE rather than a timeout."
  - "clientToken idempotency as a PLATFORM-WIDE convention on every mutating control-plane call, rather than a per-feature afterthought."
  - "custom_state on the OAuth flow so applications can verify the validity of callbacks - CSRF protection on the consent redirect."
  - "integration_source in the user-agent suffix, so a managed service can attribute calls to a client library and deprecate versions with data rather than announcements."
  - "A DeprecationWarning path for a superseded kwarg (namespaces -> namespace_templates) - one-deprecation-window discipline applied to an API parameter."

weakest_choices:
  - "NO LOCAL IMPLEMENTATION OF ANYTHING. Without an AWS account the SDK does nothing - the least favourable open-core position in the study, and ADK proves it was avoidable by shipping InMemory* siblings behind the same interfaces."
  - "Architecture is server-side and unreadable, so most findings are inference from API shapes: 52 of 173 probes are unknown rather than absent."
  - "No agent versioning, and revocation is credential-level rather than agent-level."
  - "Namespaces are conventions, not constraints - /actor/Jane/ can be misspelled in a way ADK's user: prefix cannot."
  - "No approval or elicitation model beyond OAuth consent; no human decision on a tool call."
  - "No OpenTelemetry in the SDK; observability is CloudWatch and X-Ray."
  - "No SSRF or egress guard of its own, unlike Pydantic AI."
  - "Total AWS coupling - deeper than Cloudflare's, because even identity and policy are managed services rather than libraries."

reusable_components:
  - component: "Workload identity for the agent"
    decision: ADOPT_AS_STANDARD
    note: "The agent must be a principal; best precedent in the study."
  - component: "Three token variants (self / for-JWT / for-user)"
    decision: ADOPT_AS_STANDARD
    note: "Makes 'on whose behalf' explicit per request."
  - component: "ON_BEHALF_OF_TOKEN_EXCHANGE as a named flow"
    decision: ADOPT_AS_STANDARD
    note: "Delegation deserves its own name, not a flag on login."
  - component: "Typed user identifiers"
    decision: REUSE
    note: "'Which user' should not be a bare string."
  - component: "Cedar as the policy language"
    decision: INTEGRATE
    note: "Formal semantics plus tooling; the only path to ADR-0013's shadow half."
  - component: "Policy generation as reviewable assets"
    decision: REUSE
    note: "Inspect the candidate policy before it takes effect."
  - component: "Control/data plane split with per-plane allow-lists"
    decision: ADOPT_AS_STANDARD
    note: "Administration and use are different surfaces."
  - component: "Allow-listed dynamic forwarding"
    decision: REUSE
    note: "An SDK that cannot leak an unvetted API."
  - component: "Typed memory strategies incl. USER_PREFERENCE"
    decision: ADOPT_AS_STANDARD
    note: "Memory KIND is orthogonal to memory SCOPE; we need both."
  - component: "Hierarchical namespaces with prefix queries"
    decision: REUSE
    note: "Use alongside ADK's enforced scopes, not instead of them."
  - component: "Refusing wildcards in namespace queries"
    decision: ADOPT_AS_STANDARD
    note: "Bounds the blast radius of a convention-based scope."
  - component: "Healthy vs HealthyBusy"
    decision: ADOPT_AS_STANDARD
    note: "Idle-alive is not working-alive; matters for reaping."
  - component: "wait_until_deleted"
    decision: REUSE
    note: "Deletion is asynchronous."
  - component: "Explicit *_FAILED terminal statuses"
    decision: ADOPT_AS_STANDARD
    note: "Failure should be a state, not a timeout."
  - component: "clientToken idempotency convention"
    decision: ADOPT_AS_STANDARD
    note: "Uniform across every mutating operation; feeds ADR-0014."
  - component: "custom_state callback validation"
    decision: REUSE
    note: "CSRF protection on consent redirects."
  - component: "Namespaces as the only scoping mechanism"
    decision: BUILD
    note: "Reject alone; pair with schema-enforced scopes."
  - component: "SDK with no local implementation"
    decision: BUILD
    note: "Reject; ADK's in-memory siblings are the standard to meet."

lessons:
  - "BEST VINDICATION OF THE REBASED ADR-0001 RATIONALE. Phase 2 concluded agent identity is required for DELEGATION, POLICY ATTACHMENT and AUDIT rather than for durability - and AgentCore is exactly that: a workload identity whose entire purpose is obtaining scoped tokens and being named as a Cedar principal. Nothing about durability requires it; everything about authorization does. (confirms ADR-0001)"
  - "CLOSES THE ADR-0007 LOOP. The amendment split Principal from Credential because ADK had credentials without principals and HumanLayer had decisions without principals. AgentCore has BOTH halves properly: a workload identity (principal) and credential providers as CRUD resources (credential), with three flows connecting them. This is the reference shape. (confirms ADR-0007)"
  - "CEDAR CHANGES ADR-0013 FROM ASPIRATION TO PLAN. A formally specified policy language with an existing analysis toolchain makes 'is policy set B more permissive than A' a tractable question - which is exactly what shadow comparison needs, and twelve projects offered nothing for it. Plus start_policy_generation producing candidate policies as reviewable assets. AMEND ADR-0013 to adopt Cedar rather than writing a bespoke rule engine. (confirms ADR-0013)"
  - "ADR-0008 GAINS MEMORY KINDS. ADK gave four SCOPES (who sees it, how long it lives). AgentCore adds orthogonal KINDS (SEMANTIC, SUMMARIZATION, USER_PREFERENCE, CUSTOM) - what sort of thing it is, and therefore how it is written and expired. Scope and kind are independent dimensions and our Recall interface needs both. (confirms and extends ADR-0008)"
  - "FOURTH independent instance of A2A as an optional edge adapter alongside an internal model, with AG-UI too. Settled. (confirms ADR-0006)"
  - "clientToken applies caller-supplied idempotency UNIFORMLY across every mutating control-plane call. Third ADR-0014 precedent and the most consistent: Cloudflare has explicit keys on durable work, AG2 has causation dedupe on replies, AWS makes it a platform convention. The lesson is UNIFORMITY - one convention across every mutating operation beats three mechanisms in three subsystems. (confirms ADR-0014)"
  - "Healthy vs HealthyBusy is the most precise health model in the study, and it matters for the lost-worker problem: a supervisor that cannot distinguish idle-alive from working-alive either kills busy workers or fails to notice stuck ones."
  - "TWELVE PROJECTS and still no agent version plus pin. Revocation exists here but at the credential level - you can revoke what an agent REACHES, not the agent itself. (confirms ADR-0011 negatively)"
  - "EVIDENCE-CLASS LESSON: this is the only project where the evidence class degrades at SUBSYSTEM scale. 52 of 173 probes are unknown because I read a client SDK, not a service. Coding those as absent would have overstated nine gaps in the capability matrix. The absent-vs-unknown distinction earned its keep here."
  - "OPEN-CORE ANTI-PATTERN: an Apache-2.0 SDK that does nothing without the paid service. ADK ships in-memory implementations of six subsystems behind identical interfaces and still sells the managed versions - which is the standard our own pluggable interfaces should meet."

adr_impact:
  - adr: ADR-0001
    effect: confirms
    note: "Workload identity exists purely for delegation, policy attachment and audit - the rebased rationale, vindicated."
  - adr: ADR-0002
    effect: neutral
    note: "No Task/Run split visible in the SDK surface."
  - adr: ADR-0003
    effect: confirms
    note: "No durable agent-to-agent messaging; A2A is an edge adapter."
  - adr: ADR-0004
    effect: neutral
    note: "A client SDK, not an adapter contract."
  - adr: ADR-0005
    effect: confirms
    note: "A managed gateway fronts tools; MCP-shaped, no capability model."
  - adr: ADR-0006
    effect: confirms
    note: "Fourth independent instance of A2A as optional edge interop, with AG-UI alongside."
  - adr: ADR-0007
    effect: confirms
    note: "Has BOTH halves: a workload principal AND credential providers, with three flows connecting them. Reference shape."
  - adr: ADR-0008
    effect: confirms
    note: "Second real memory service, adding typed KINDS orthogonal to ADK's scopes."
  - adr: ADR-0009
    effect: neutral
    note: "Sandboxing is managed and not inspectable - recorded unknown, not absent."
  - adr: ADR-0010
    effect: neutral
    note: "No OTel in the SDK; CloudWatch/X-Ray server-side. integration_source attribution is a good minor idea."
  - adr: ADR-0011
    effect: confirms
    note: "No agent version, no pin. Twelve projects. Revocation exists but at credential level only."
  - adr: ADR-0012
    effect: neutral
    note: "No declared capability model."
  - adr: ADR-0013
    effect: confirms
    note: "CEDAR - the first real precedent for verifiable policy, plus policy generation as reviewable assets."
  - adr: ADR-0014
    effect: confirms
    note: "clientToken as a platform-wide idempotency convention. Third precedent, most uniform."
  - adr: ADR-0015
    effect: neutral
    note: "No approval resource; human interaction is OAuth consent only."

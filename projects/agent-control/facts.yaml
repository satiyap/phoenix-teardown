object_model: |
  Namespace (namespace_key)     the tenancy boundary - in composite PKs AND
   |                            in composite FKs on association tables
   |-- Agent                    registered; a policy TARGET
   |-- Control                  the policy definition
   |    |-- ConditionNode       RECURSIVE boolean tree:
   |    |    |-- leaf           (selector + evaluator) - both required
   |    |    |-- and[]          at least one child
   |    |    |-- or[]           at least one child
   |    |    `-- not            single child
   |    `-- action
   |         |-- decision       deny | steer | observe
   |         `-- steering_context  {message} - required for composite steer
   |-- Policy                   groups controls (policy_controls assoc table)
   `-- ControlBinding           (namespace_key, target_type, target_id,
                                 control_id, enabled, created_at, updated_at)

  Step                          the evaluated payload; dot-notation selectors
                                'input', 'input.query', 'context.user_id'
  EvaluatorSpec                 builtin (regex, list, JSON, SQL) or contrib
  ControlExecutionEvent         + ControlStats, TimeseriesBucket

strongest_ideas:
  - "OBSERVE as a first-class control action - evaluate and record without enforcing. Shadow mode, shipped, and the only instance in fifteen projects. Verified live: ['deny','steer','observe'] are the canonical actions."
  - "STEER as a third outcome, returning machine-readable remediation instructions rather than a refusal - a policy that repairs instead of only refusing."
  - "Requiring steering_context on composite steer controls: 'Composite steer controls require action.steering_context'. You cannot ship a steer decision that fails to say how to comply."
  - "Steering examples that are PROCEDURES, not messages: '1) Ask user for business justification, 2) Request manager approval..., 3) If approved, retry with manager_approved=True'."
  - "Recursive ConditionNode trees (leaf/and/or/not) with a validator enforcing exactly one node kind per node and rejecting empty and/or groups."
  - "Strict-in, lenient-out enum normalisation: validate_action REJECTS legacy values at the API boundary while normalize_action ACCEPTS them on internal read paths, with the reasoning in both docstrings. The correct asymmetry for schema evolution."
  - "Separate agent and admin API keys, so an agent subject to policy cannot modify its own governance. No other project makes this separation."
  - "A README that names its own unsafe default: 'This starts server without API keys configured which is dangerous for any real world usage.'"
  - "namespace_key in composite FOREIGN keys, not just the primary key - 'Composite FKs enforce same-namespace references on both sides' - so a cross-namespace BINDING is a constraint violation, not a silent success."
  - "ControlBinding as a first-class resource with an enabled flag, so policy ATTACHMENT is queryable, auditable and independently disable-able."
  - "Dot-notation selectors (input.query, context.user_id) so a control targets a precise field rather than a whole payload."
  - "A full stats and timeseries model over decisions - which is what makes observe mode actionable rather than merely non-blocking."
  - "Batch event submission, so the audit write does not block the enforcement path."
  - "SQL as a builtin evaluator, implying structured-argument evaluation rather than text-only matching."
  - "Concurrent control evaluation under a semaphore with a deny_found event for early cancellation, so many bound controls do not penalise the fast path."
  - "Framework adapters for runtimes it does not own (LangChain, CrewAI, Google ADK, AWS Strands) - built on the assumption that it is a component, not the platform."
  - "Deployable from a curl'd docker-compose file with no repo clone."
  - "Dedicated Alembic migration test suites per schema change."

weakest_choices:
  - "NO PRINCIPALS and no end-user authentication. It governs agent BEHAVIOUR thoroughly and cannot express AUTHORITY at all - no on-whose-behalf, no record of who a decision concerned."
  - "No row-level security, so tenancy relies on the application always supplying the namespace - though composite FKs make cross-namespace relationships structurally impossible, which is the more dangerous case."
  - "No agent versioning or revocation (though a ControlBinding can be disabled)."
  - "No policy ANALYSIS: controls are evaluated, never compared. Gives empirical shadow comparison but not the static kind Cedar enables."
  - "CAVEAT WE MUST DESIGN AROUND: early cancellation on deny means observe-mode controls may not record a verdict for denied traffic, so shadow data is systematically missing exactly the cases a candidate policy most needs comparing on."
  - "Tests need pytest-asyncio which is not in the default install path, so a fresh clone reports 64 spurious failures."
  - "Narrow by design - a strength for integration, and it means the project answers very few probes."

reusable_components:
  - component: "observe as a first-class action"
    decision: ADOPT_AS_STANDARD
    note: "Shadow mode; the only precedent in fifteen projects."
  - component: "steer with required remediation guidance"
    decision: ADOPT_AS_STANDARD
    note: "Policy that repairs beats policy that refuses."
  - component: "Structural validation of steer completeness"
    decision: ADOPT_AS_STANDARD
    note: "A steer control that cannot say how to comply is a bug."
  - component: "Recursive condition trees with shape validation"
    decision: REUSE
    note: "A real policy expression language, structurally validated."
  - component: "Strict-in / lenient-out enum normalisation"
    decision: ADOPT_AS_STANDARD
    note: "Correct asymmetry for evolving a vocabulary."
  - component: "Separate agent vs admin credentials"
    decision: ADOPT_AS_STANDARD
    note: "A governed subject must not be able to edit its governance."
  - component: "Composite FKs enforcing same-namespace references"
    decision: ADOPT_AS_STANDARD
    note: "Prevents cross-tenant relationships, not just reads. Strongest tenancy found."
  - component: "ControlBinding as a queryable resource with enabled flag"
    decision: ADOPT_AS_STANDARD
    note: "Policy attachment is auditable and reversible, not implicit."
  - component: "Dot-notation field selectors"
    decision: REUSE
    note: "Target a field, not a payload."
  - component: "Stats + timeseries over decisions"
    decision: ADOPT_AS_STANDARD
    note: "What makes observe mode actionable."
  - component: "Batch event submission"
    decision: REUSE
    note: "Audit must not block enforcement."
  - component: "Naming your unsafe default in the README"
    decision: REUSE
    note: "Honest defaults documentation."
  - component: "The whole control plane"
    decision: INTEGRATE
    note: "Second INTEGRATE-candidate after AG2."
  - component: "Early cancellation applied to observe-mode controls"
    decision: BUILD
    note: "Reject; observe evaluations must be exempt or shadow data is biased."

lessons:
  - "THE SHADOW HALF OF ADR-0013, FINALLY. Fifteen projects with no shadow-comparison precedent, and this ships it: observe is a CANONICAL action that evaluates and records without enforcing, paired with stats and timeseries models that make the recorded data useful. Verified live. AMEND ADR-0013 to a three-way outcome and require that observe-mode data be aggregable, not merely logged. (confirms ADR-0013)"
  - "STEER IS A CATEGORY I DID NOT HAVE. Instead of blocking, a control returns structured remediation the agent can act on - including instructions to obtain human approval. This reframes ADR-0015: many approvals exist only because a policy can only say no. Approval should be the ESCALATION PATH when steering is impossible, not the default response to a violation. (amends ADR-0015)"
  - "Empirical shadow (run the candidate, see what it would have done) and static shadow (Cedar: prove B is more permissive than A) are COMPLEMENTARY, and we should have both. AgentCore gives the static kind, this gives the empirical kind."
  - "SEPARATE THE GOVERNED FROM THE GOVERNOR: distinct agent and admin credentials, so an agent subject to policy cannot modify policy. Obvious once stated, and only this project does it."
  - "STRONGEST TENANCY MECHANISM IN THE STUDY, and it corrected me: namespace_key is in composite FOREIGN keys as well as primary keys, so a cross-namespace binding cannot be created. Omnigent and ADK prevent unscoped reads; this prevents cross-tenant writes. For a policy system the dangerous failure is not READING another tenant's control, it is ATTACHING one."
  - "FOURTH project to have half the ADR-0007 model: governs behaviour thoroughly, cannot express authority at all. With ADK (credentials, no principals), HumanLayer (decisions, no approver) and AgentCore (both halves), the principal model is now unmistakably the field's most consistent omission - and it is what ties policy, approval and delegation together. (challenges ADR-0007)"
  - "L8 CLOSED AS A BOUNDARY, NOT A GAP. Compensation is absent in fifteen of fifteen projects, including the one whose entire job is control (this) and the one whose entire job is orchestration (MAF), and four managed enterprise platforms. With Pydantic AI's argument that saga compensation is the workflow engine's job, I record L8 as a DELIBERATE v0.1 exclusion with fifteen projects of evidence behind it, rather than an unbuilt feature."
  - "Framework adapters for four runtimes it does not own means this is the only project in the study built on the assumption that it is NOT the whole platform - which is exactly why it is integrable. (confirms ADR-0004)"
  - "Decisions are a modelled, queryable, AGGREGABLE dataset rather than log lines. Extends the ADR-0010 amendment: refusals must be observable AND aggregable. (confirms ADR-0010)"
  - "PROCESS NOTE: I recorded namespace_key as a mere filter field after reading the API models, and the server schema contradicted it. Third time in this study that checking the schema overturned an inference from an API surface."


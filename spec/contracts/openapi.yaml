openapi: 3.1.0
info:
  title: Agent Platform control-plane API (v0.1 execution spine)
  version: 0.1.0
  description: |
    Machine-readable companion to spec/06-api.md. `make spec` asserts the two agree on
    operations, security classes and the run-state enum — an earlier version matched only
    path strings, so a GET silently becoming a POST would have passed.

    Four invariants that are easy to lose in an OpenAPI file and are load-bearing:
      1. `tenant_id` NEVER appears in a request. It is derived from the token.
      2. `decided_by` is taken from the token, never from a body.
      3. No route sets `running`, `expired`, `indeterminate` or `incompatible` — those are
         system transitions (spec/05-state-machine.md).
      4. Cross-tenant reads are 404, not 403: existence is not disclosed.
servers:
  - url: https://api.example.internal
security:
  - agentToken: []
  - adminToken: []
  - orySession: []
tags:
  - name: definitions
  - name: agents
  - name: runs
  - name: approvals
  - name: policies
    description: admin only
  - name: adapters
    description: admin only
  - name: knowledge
  - name: tasks
  - name: credentials
    description: admin only
components:
  securitySchemes:
    orySession:
      type: apiKey
      in: cookie
      name: ory_kratos_session
      description: |
        Ory browser session. Phoenix resolves realm-scoped tenant membership on every
        request. Human administrator access requires aal2; global operator authority
        requires a separate explicit grant. Mutations also require the exact Origin
        and the session-bound X-Phoenix-CSRF value from GET /v1/auth/session.
    agentToken:
      type: http
      scheme: bearer
      description: |
        Class **agent**: create/submit runs it owns, read them, and READ approvals on them.
        It MAY NOT decide an approval (superseded 2026-08-27: this said "answer its own
        approvals", which read as the requester deciding). Presented to an admin route, or to
        POST /v1/approvals/{id}/decide, it is 403 `wrong_credential_class` — it authenticated
        fine, it is simply not permitted.
    adminToken:
      type: http
      scheme: bearer
      description: |
        Machine admin credential for permitted tenant-scoped service operations.
        It does not authenticate a human, grant Phoenix operator authority, or
        authorize Ory-only team and identity administration. Approval decisions
        additionally require an eligible, explicitly authorized actor kind; agent
        principals cannot decide approvals. Humans use orySession instead.
  parameters:
    RunId:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1 }
      description: Required on this route (spec/06-api.md Idempotency).
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1 }
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema: { type: string }
      description: |
        Resume the stream after this event `seq` (spec/06-api.md §Streaming). Added
        2026-09-04: the route required the behaviour and declared no parameter, so a
        server generated from this file could not see the header and the stream
        silently could not resume.
  responses:
    NotFoundOrOtherTenant:
      description: |
        Unknown, or belongs to another tenant. Deliberately indistinguishable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not permitted for this credential class
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    IdempotencyConflict:
      description: |
        Same key, different body. Never replay another request's answer.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error:   { type: string, description: stable machine code }
        message: { type: string }
        details: { type: object, additionalProperties: true }
    RunState:
      type: string
      description: |
        Mirrors spec/05-state-machine.md exactly. `running`, `expired`, `indeterminate`
        and `incompatible` are system-owned and never a route's target state.
      enum: [draft, queued, running, waiting_input, cancelling, cancelled,
             succeeded, failed, expired, indeterminate, incompatible, discarded]
    ToolBinding:
      type: object
      required: [name, schema_digest, version, artifact_digest, execution_binding, approval_mode]
      description: |
        Every field participates in the definition digest. `artifact_digest` is required:
        a version string pointing at mutable code preserves the pin while changing
        behaviour.
      properties:
        name:              { type: string }
        schema_digest:     { type: string }
        version:           { type: string }
        artifact_digest:
          type: string
          # A pattern rather than minLength, corrected 2026-09-04. minLength: 1 accepted a
          # single space, and a whitespace artifact_digest is exactly as useless as an
          # empty one — it satisfies "required" while naming nothing, which is the precise
          # failure this field exists to prevent. Deliberately not ^[0-9a-f]{64}$: an
          # artifact identity is not required to be a sha256 hex string, and narrowing it
          # here would refuse an OCI digest with its algorithm prefix.
          pattern: '^\S+$'
          minLength: 1
        execution_binding: { type: string }
        approval_mode:     { type: string, enum: [never, always, risk_based] }
        credential_ref:    { type: [string, 'null'] }
    ExtensionBinding:
      type: object
      required: [name, artifact_digest]
      description: |
        The `extensions` ARRAY IS ORDERED and its order is digested: extensions compose,
        so swapping two changes behaviour. Do not sort this array.
      properties:
        name:            { type: string }
        artifact_digest: { type: string, minLength: 1 }
        config_digest:   { type: string }
        position:        { type: string, enum: [outermost, innermost] }
    Definition:
      type: object
      required: [name, instructions]
      additionalProperties: false
      properties:
        name:         { type: string }
        instructions: { type: string }
        tools:
          type: array
          items: { $ref: '#/components/schemas/ToolBinding' }
        extensions:
          type: array
          items: { $ref: '#/components/schemas/ExtensionBinding' }
        knowledge_package_digest:
          type: string
          description: |
            Optional. When declared it participates in the definition digest
            (spec/16-knowledge.md Digest participation). ABSENT when undeclared,
            never null, so no existing digest moves.
        state_schema:
          type: object
          additionalProperties: true
          description: Optional; participates in the definition digest when declared.
    McpServer:
      type: object
      required: [server_id, name, endpoint, state, admitted_by, admitted_at, pinned_digest]
      additionalProperties: false
      description: |
        An admitted MCP endpoint. The customer operates the server; this platform holds a
        reference to it, a pinned catalogue, and no code.
      properties:
        server_id:   { type: string }
        name:        { type: string }
        endpoint:    { type: string }
        egress_host: { type: string }
        state:       { type: string, enum: [admitted, revoked] }
        admitted_by: { type: string }
        admitted_at: { type: string, format: date-time }
        revoked_at:  { type: [string, 'null'], format: date-time }
        credential_ref:
          type: string
          description: a reference, never material
        pinned_digest:
          type: string
          description: the catalogue this server was admitted with
        pinned_tools:
          type: array
          items:
            type: object
            required: [name, schema_digest]
            properties:
              name:          { type: string }
              description:   { type: string }
              schema_digest: { type: string }
    Task:
      type: object
      required: [name, agent_id, trigger_kind]
      additionalProperties: false
      description: |
        A routine. It CREATES Runs and never becomes one (ADR-0002). `event` is reserved
        in `trigger_kind` and refused 422 until an observable surface exists; `allow` is
        reserved in `overlap_policy` for the same reason.
      properties:
        task_id:               { type: string, readOnly: true }
        name:                  { type: string }
        agent_id:              { type: string }
        prompt:                { type: string }
        state:                 { type: string, enum: [active, paused, disabled], readOnly: true }
        trigger_kind:          { type: string, enum: [cron, manual, webhook, event] }
        cron_expression:       { type: string, description: 5-field; immutable after create }
        timezone:              { type: string, description: IANA; immutable after create }
        overlap_policy:        { type: string, enum: [skip, queue, allow] }
        misfire_grace_seconds: { type: integer, minimum: 0, maximum: 86400 }
        fire_key:
          type: string
          readOnly: true
          description: |
            A webhook routine's own key, returned ONCE on creation and never again. Added
            2026-09-05. The platform stores only its digest, so a database read does not
            yield a key that fires anybody's routine — which also means a lost key is
            replaced rather than recovered.

            Absent on every other trigger kind: a routine with two ways to fire has two
            firing keys and loses idempotency at the moment it matters most.
        ceiling_calls:
          type: [integer, 'null']
          minimum: 1
          description: |
            Outbound model calls ONE firing may make before the egress proxy refuses the
            rest. `null` is no ceiling on this axis.
        ceiling_bytes:
          type: [integer, 'null']
          minimum: 1
          description: |
            Bytes ONE firing may move before the proxy refuses the rest. `null` is no
            ceiling on this axis.

            Both ceilings are counted in what the PROXY can testify to, and deliberately
            not in money. Usage is a fact the harness observed and the harness runs inside
            the sandbox: you cannot limit something using a number the thing being limited
            reports about itself. A currency figure here would manufacture a precision the
            mechanism does not have, and would eventually be reconciled against the real
            bill by somebody — at which point it is the real record that gets doubted.

            0 is refused rather than treated as "no calls": that is what pausing is for,
            and a 0 reads downstream as no limit at all.

            Per FIRING, not per routine lifetime. A routine runs unattended, on a schedule,
            forever, so the ceiling that matters is the one that stops a single runaway
            tick before the next tick is due.
    Credential:
      type: object
      required: [name, kind, flow, egress_host, holder_principal_id]
      additionalProperties: false
      description: |
        Southbound material an agent presents to a customer system. NOT a northbound
        credential class (spec/06 Two credential classes) and NOT an identity
        (ADR-0007 amendment). No property here names or points at secret material:
        `secret_ref`, `material_ref` and placeholder values are unrepresentable in this
        schema, which is why no route can return one.
      properties:
        credential_id:       { type: string, readOnly: true }
        name:                { type: string }
        kind:                { type: string, enum: [oauth2, api_key, mtls] }
        flow:
          type: string
          enum: [as_itself, user_federation, on_behalf_of_token_exchange]
        egress_host:
          type: string
          description: |
            Exactly one host. It is what makes the proxy's leak guard bindable, and a
            value naming a control-plane host is refused at create.
        holder_principal_id: { type: string }
        revoked_at:          { type: string, format: date-time, readOnly: true, nullable: true }
    DigestResponse:
      type: object
      required: [digest, canon_profile]
      properties:
        digest:        { type: string }
        canon_profile: { type: string, const: "nfc+intjson/v1" }
    HumanInput:
      type: object
      required: [input_id, run_id, question, kind, state, asked_at, expires_at]
      properties:
        input_id: { type: string }
        run_id:   { type: string }
        question:
          type: string
          description: as the AGENT asked it, not a paraphrase.
        kind:     { type: string, enum: [free_text, choice] }
        choices:  { type: array, items: { type: string } }
        state:
          type: string
          enum: [pending, answered, expired, superseded]
          description: |
            `expired` means nobody answered in time and the agent was told the tool was
            refused. `superseded` means the run went away — not silently dropped, because
            somebody half-composing a reply to a dead run deserves to be told.
        answered_by: { type: string, nullable: true }
        answer:      { type: string, nullable: true }
        asked_at:    { type: string, format: date-time }
        answered_at: { type: string, format: date-time, nullable: true }
        expires_at:
          type: string
          format: date-time
          description: |
            A question expires, because an unanswered one otherwise holds a run open
            indefinitely.
    Report:
      type: object
      required: [report_id, run_id, title, grade, as_of, stale]
      properties:
        report_id:  { type: string }
        run_id:
          type: string
          description: |
            The run that produced it. Never absent — a report with no run is a number with
            no provenance.
        routine_id:
          type: string
          nullable: true
          description: the routine that owns it, so "why did this not refresh" is one click.
        title:      { type: string }
        visual_template_id: { type: string }
        archetype:  { type: string }
        grade:
          type: string
          enum: [attested, vetted, reviewed, unverified, stale, failed, withdrawn]
        as_of:
          type: string
          format: date-time
          description: the DATA's own timestamp, not the render time.
        refresh_due_at: { type: string, format: date-time, nullable: true }
        stale:
          type: boolean
          description: |
            Computed against now, and STATED rather than implied by a date the reader has
            to work out. Never stored: staleness is a fact about the present, and a report
            becomes stale by the clock moving rather than by anything happening to it.
    Connection:
      type: object
      required: [connection_id, team_id, slug, display_name, kind, state]
      description: |
        A customer system a team can reach. `credential_ref` NAMES where the secret lives
        and never holds one; there is deliberately no field in this schema that could carry
        material, which is what makes "no route returns a secret" a property of the
        contract rather than of a handler.
      properties:
        connection_id: { type: string }
        team_id:       { type: string }
        slug:          { type: string }
        display_name:  { type: string }
        kind:          { type: string }
        state:
          type: string
          description: |
            Whether the connection has been reached successfully. A connection that has
            never been tested is not the same as one that failed, and neither is the same
            as one that works.
        credential_ref:  { type: string, description: where the secret lives. Never the secret. }
        last_tested_at:  { type: string, format: date-time, nullable: true }
        last_error:
          type: [string, 'null']
          description: |
            The connector's OWN error, verbatim. This screen's job on a bad day is to tell
            somebody why their warehouse is unreachable, and "connection failed" does not
            do that -- the host that could not be resolved, the role that lacked a grant,
            the certificate that expired are all the same sentence without it.

            It is stored and was previously unreadable through the API, so the only way to
            find out why a connection failed was to query the database.
    Tenant:
      type: object
      required: [tenant_id, slug, display_name, region, state]
      description: |
        The customer. `slug` and `region` are immutable: a slug appears in URLs and support
        threads and renaming it breaks links and audit trails; a region decides where the
        data plane runs and moving it is a migration.
      properties:
        tenant_id:    { type: integer, format: int64 }
        slug:         { type: string }
        display_name: { type: string }
        region:       { type: string }
        state:
          type: string
          enum: [pending, active, suspended, offboarded]
          description: |
            `pending` means provisioning is incomplete and NOTHING customer-facing works.
            A tenant only reaches `active` when all five steps complete; anything less
            stays pending and visibly so.
        created_at:    { type: string, format: date-time }
        activated_at:  { type: string, format: date-time, nullable: true }
        suspended_at:  { type: string, format: date-time, nullable: true }
        offboarded_at: { type: string, format: date-time, nullable: true }
    TeamMemberGrant:
      type: object
      required: [principal_id, role]
      properties:
        principal_id: {type: string}
        role: {type: string}
    Team:
      type: object
      required: [team_id, slug, display_name]
      properties:
        team_id:      { type: string }
        slug:         { type: string }
        display_name: { type: string }
        archived_at:  { type: string, format: date-time, nullable: true }
    Candidate:
      type: object
      required: [candidate_id, run_id, node_type, title, instrument, confidence]
      description: |
        Proposed knowledge. NOT a node: nothing reaches a bundle without a recorded human
        decision. Every candidate carries provenance, because "where did this definition
        come from" must be answerable when somebody disputes a number — and by then the
        scan that produced it is months gone.
      properties:
        candidate_id: { type: string }
        node_type:    { type: string }
        title:        { type: string }
        body:         { type: string }
        instrument:
          type: string
          description: which instrument produced it — a scan code (S0-S6) or an interview (I1-I4, Q1-Q2).
        source_path:  { type: string, nullable: true }
        source_line:  { type: integer, nullable: true }
        person:       { type: string, nullable: true, description: who said it, for an interview-sourced candidate }
        session_id:   { type: string, nullable: true }
        excerpt:      { type: string }
        confidence:
          type: number
          description: |
            The extractor's own view. Recorded and never acted on: it orders the review
            queue and decides nothing. An agent that could auto-accept its own
            high-confidence output would be disposing as well as proposing.
        run_id:
          type: string
          description: |
            The scan or interview run that proposed it.

            Required, because provenance is not complete without it. `source_path` and
            `source_line` say where in the customer's documents a definition was found; only
            this says WHICH PASS found it — the question asked when two scans disagree, or
            when somebody wants to know whether a batch is worth reviewing at all.
    Policy:
      type: object
      required: [policy_id, name, scope, decision, enabled]
      description: |
        A rule and the mode it is in. `cedar_source` is deliberately NOT returned by the
        list route: it is long enough to make a list unreadable, and a caller that wants
        it asks for the one policy.
      properties:
        policy_id: { type: string }
        name:
          type: string
          description: |
            A `platform:` prefix marks one of the reserved rows seeded per tenant. Those
            are the floor every tenant sits on rather than a suggestion, and are not
            editable.
        scope:     { type: string, enum: [tenant, agent] }
        scope_key: { type: string }
        decision:
          type: string
          enum: [observe, steer, deny]
          description: |
            The mode. `observe` affects NOTHING — it records what it would have done.
            `steer` changes what the agent is told and refuses nothing. `deny` refuses.
            This is the field that matters most and the one most often assumed.
        steering_guidance: { type: string }
        enabled:   { type: boolean }
        created_by: { type: string }
    Agent:
      type: object
      required: [agent_id, name, current_digest, declared_version]
      properties:
        agent_id:         { type: string }
        name:             { type: string }
        current_digest:   { type: string }
        declared_version: { type: integer, description: human-facing; never compared }
        lifecycle:
          type: string
          enum: [active, revoked]
          readOnly: true
          description: |
            Added 2026-09-04 alongside listAgents. Without it a caller listing agents
            cannot tell a revoked one from a live one, so a UI would offer a choice that
            then fails with 409 at the moment somebody tries to use it. A revoked agent is
            still listed — a list that hid them would answer "which agents exist" wrongly
            during an incident, and a run pinned to a revoked agent still has to be
            explainable.
    Run:
      type: object
      required: [run_id, state, agent_id, pinned_definition_digest]
      properties:
        run_id:                   { type: string }
        team_id: { type: string, nullable: true, description: 'Immutable team binding; absent for unreconciled historical or unscoped machine runs.' }
        state:                    { $ref: '#/components/schemas/RunState' }
        agent_id:                 { type: string }
        pinned_definition_digest: { type: string }
        current_epoch:            { type: integer, minimum: 0 }
        error_code:               { type: [string, 'null'] }
    RunEvent:
      type: object
      required: [seq, epoch, event_type, payload, superseded]
      properties:
        seq:        { type: integer }
        epoch:      { type: integer, minimum: 0 }
        event_type: { type: string }
        payload:    { type: object, additionalProperties: true }
        superseded:
          type: boolean
          description: |
            True when a later rewind supersedes it. Superseded events are RETAINED and
            returned, because they are evidence of what was attempted.
    Approval:
      type: object
      required: [approval_id, run_id, action_ref, status]
      properties:
        approval_id: { type: string }
        run_id:      { type: string }
        action_ref:  { type: string, description: the gated effect's idempotency_key }
        status:      { type: string, enum: [pending, approved, denied, expired, superseded] }
        decided_by:  { type: [string, 'null'], description: set from the TOKEN, never a body field }
        rationale:   { type: [string, 'null'] }
        expires_at:  { type: string, format: date-time }
paths:
  /v1/teams/{id}/members/{principal_id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, minLength: 1}}
      - {name: principal_id, in: path, required: true, schema: {type: string, minLength: 1}}
    put:
      operationId: putTeamMember
      summary: Assign or change a team membership
      description: Current Ory tenant administrator only. The target must be an active enrolled human in this realm and tenant. Another active steward is required before demoting a steward. Unchanged grants are idempotent and do not repeat audit events.
      security: [{ orySession: [] }]
      x-phoenix-authority: tenant-admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role, reason]
              properties:
                role: {type: string, enum: [member, steward]}
                reason: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '200':
          description: Current team membership
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeamMemberGrant'}
        '403': {description: Current Ory tenant administrator required}
        '404': {description: Team or enrolled human not found in this tenant and realm}
        '409': {description: Archived team or last active steward refusal}
        '422': {description: Invalid role or audit reason}
  /v1/teams/{id}/members/{principal_id}/remove:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, minLength: 1}}
      - {name: principal_id, in: path, required: true, schema: {type: string, minLength: 1}}
    post:
      operationId: removeTeamMember
      summary: Withdraw a team membership without deleting the historical actor
      description: Current Ory tenant administrator only. Requires another active steward before removing a steward. Missing memberships are idempotent. Team access ends on the next request or stream permission check; unrelated memberships and Ory sessions remain intact.
      security: [{ orySession: [] }]
      x-phoenix-authority: tenant-admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '204': {description: Membership withdrawn or already absent}
        '403': {description: Current Ory tenant administrator required}
        '404': {description: Team not found in this tenant}
        '409': {description: Another active steward is required}
        '422': {description: Invalid audit reason}
  /v1/definitions:
    post:
      tags: [definitions]
      operationId: createDefinition
      summary: Register a definition; content-addressed, so naturally idempotent
      parameters: [{ $ref: '#/components/parameters/IdempotencyKeyOptional' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Definition' }
      responses:
        '201':
          description: created
          content: { application/json: { schema: { $ref: '#/components/schemas/DigestResponse' } } }
        '200':
          description: already existed, byte-identical
          content: { application/json: { schema: { $ref: '#/components/schemas/DigestResponse' } } }
        '422':
          description: |
            Not canonicalisable under nfc+intjson/v1 — e.g. a fractional number, an
            integer above 2^53-1, or two keys colliding under NFC.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /v1/definitions/{digest}:
    get:
      tags: [definitions]
      operationId: getDefinition
      parameters: [{ name: digest, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: the definition body
          content: { application/json: { schema: { $ref: '#/components/schemas/Definition' } } }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
  /v1/agents:
    get:
      tags: [agents]
      operationId: listAgents
      description: |
        The agents this tenant has registered. Added 2026-09-04: the contract carried
        createAgent and getAgent but no way to enumerate, so nothing could offer a choice
        of agent — screen B6 asks the operator to pick one and there was no route to fill
        the list from. A UI that cannot list is a UI that asks somebody to paste an id.
      responses:
        '200':
          description: the agents this tenant has registered
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Agent' }
    post:
      security: [{ adminToken: [] }, { orySession: [] }]
      tags: [agents]
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, digest]
              properties:
                name:   { type: string }
                digest: { type: string }
      responses:
        '201':
          description: created
          content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
  /v1/agents/{id}:
    get:
      tags: [agents]
      operationId: getAgent
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200':
          description: the agent
          content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
    patch:
      security: [{ adminToken: [] }, { orySession: [] }]
      tags: [agents]
      operationId: repointAgent
      summary: Repoint the agent at a different definition digest
      description: |
        Affects NEW runs only. In-flight runs resume against their own pinned artifact.
        Blocking an already-running dangerous definition is a separate, audited
        revocation operation, which v0.1 does not ship — see spec/09-decisions.md 2.
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [digest]
              properties:
                digest:           { type: string }
                declared_version: { type: integer }
      responses:
        '200':
          description: repointed
          content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
  /v1/runs:
    post:
      tags: [runs]
      operationId: createRun
      summary: Create a run (no Task in v0.1 — runs are created directly)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKeyRequired' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id: { type: string }
                team_id: { type: string, description: 'Required for new human runs; explicit tenant-scoped team ownership.' }
                input:    { type: object, additionalProperties: true }
      responses:
        '201':
          description: created, state=draft
          content: { application/json: { schema: { $ref: '#/components/schemas/Run' } } }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422':
          description: missing or reused Idempotency-Key with a different body
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    get:
      tags: [runs]
      operationId: listRuns
      parameters:
        - { name: state,  in: query, schema: { $ref: '#/components/schemas/RunState' } }
        - { name: limit,  in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: a page of runs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Run' } }
                  next_cursor: { type: [string, 'null'] }
  /v1/runs/{id}:
    get:
      tags: [runs]
      operationId: getRun
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200':
          description: the run
          content: { application/json: { schema: { $ref: '#/components/schemas/Run' } } }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
  /v1/runs/{id}/submit:
    post:
      tags: [runs]
      operationId: submitRun
      description: draft -> queued. Never sets `running`; a worker claims the lease.
      parameters:
        - { $ref: '#/components/parameters/RunId' }
        - { $ref: '#/components/parameters/IdempotencyKeyOptional' }
      responses:
        '202':
          description: state=queued
          content: { application/json: { schema: { $ref: '#/components/schemas/Run' } } }
        '409':
          description: not in a submittable state
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
  /v1/runs/{id}/cancel:
    post:
      tags: [runs]
      operationId: cancelRun
      summary: Request cancellation — a request, not a fact
      description: |
        Returns state=cancelling. The run is not cancelled until the adapter
        acknowledges; cancel-request and cancel-fact are different events (AG2).
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string } }
      responses:
        '202':
          description: state=cancelling
          content: { application/json: { schema: { $ref: '#/components/schemas/Run' } } }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
  /v1/runs/{id}/discard:
    post:
      tags: [runs]
      operationId: discardRun
      description: Only while unclaimed. A claimed run must be cancelled instead.
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string } }
      responses:
        '200':
          description: state=discarded
          content: { application/json: { schema: { $ref: '#/components/schemas/Run' } } }
        '409':
          description: already claimed
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
  /v1/runs/{id}/events:
    get:
      tags: [runs]
      operationId: listRunEvents
      description: In `seq` order, which equals `(epoch, seq)` order (spec/04-events.md).
      parameters:
        - { $ref: '#/components/parameters/RunId' }
        - { name: since_seq, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: events
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RunEvent' } }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
  /v1/runs/{id}/stream:
    get:
      tags: [runs]
      operationId: streamRun
      summary: SSE stream of run events
      parameters:
        - { $ref: '#/components/parameters/RunId' }
        - { $ref: '#/components/parameters/LastEventId' }
      responses:
        '200':
          description: text/event-stream of RunEvent objects
          content:
            text/event-stream:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
  /v1/approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      description: Served from the partial index on pending (spec/01-schema.md).
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, denied, expired, superseded] }
      responses:
        '200':
          description: approvals
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Approval' } }
  /v1/approvals/{id}/decide:
    post:
      tags: [approvals]
      operationId: decideApproval
      summary: Decide an approval
      security: [{adminToken: []}, {orySession: []}]
      description: |
        Requires an ADMIN credential, and additionally a principal of kind `human`:
        `approvals.decided_by` is pinned to a human by a composite foreign key in
        spec/01-schema.md, so an admin token held by a service account cannot decide
        (ADR-0015). An AGENT token is 403 `wrong_credential_class`.

        `decided_by` comes from the token and NEVER from the body. Deciding twice returns
        409 carrying the EXISTING decision rather than hiding it.

        A denial does not fail the run. The worker sends the adapter
        `ToolDenied{APPROVAL_DENIED}` and the run continues (spec/09-decisions.md 3).
      parameters:
        - { $ref: '#/components/parameters/RunId' }
        - { $ref: '#/components/parameters/IdempotencyKeyRequired' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              additionalProperties: false
              properties:
                decision:  { type: string, enum: [approved, denied] }
                rationale: { type: string }
      responses:
        '200':
          description: decided
          content: { application/json: { schema: { $ref: '#/components/schemas/Approval' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: already decided; body carries the existing decision
          content: { application/json: { schema: { $ref: '#/components/schemas/Approval' } } }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
  /v1/trust/findings:
    get:
      tags: [trust]
      operationId: listTrustFindings
      description: |
        Numbers a verifier DISAGREED with, freshest first. Screen P5. Added 2026-09-05.

        Under /v1/trust because `/v1/onboarding/findings` is a different thing with the same
        word — gaps in a scan, not numbers that failed a check — and two resources called
        "findings" at the same level would leave a reader guessing which one they have.

        features/10 acceptance: a failed verification is visible to a person, not only in a
        log. Without this route a failing check reached a vetting screen only if somebody
        already knew the claim id — which means the most valuable thing the trust pipeline
        produces was findable only by whoever did not need to find it.

        A finding carries what the answer said AND what the governed source said, because
        "this number is wrong" sends somebody looking and "the source says 100957500 where
        the answer said 1009575" tells them where to look. It names the verification's own
        run, which is inspectable like any other: a badge whose evidence cannot be read is
        an assertion.

        `unverified` claims are deliberately NOT here. Nobody checked them, which is a
        different situation calling for different work, and mixing the two would bury the
        checks that ran and disagreed among the ones that never ran.
      responses:
        '200':
          description: the findings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [claim_id, run_id, metric, claimed, observed, detail,
                                 verified_at]
                      properties:
                        claim_id: { type: string }
                        run_id:
                          type: string
                          description: the analysis that asserted the number
                        metric:   { type: string }
                        claimed:
                          type: string
                          description: |
                            What the answer said, as a string. Integers in the metric's own
                            units, and a string because a claim may exceed what a JSON
                            number survives intact.
                        observed:
                          type: string
                          description: what the governed source said, same units
                        units:    { type: string }
                        computation_path:
                          type: string
                          description: the sanctioned computation that was re-run
                        detail:   { type: string }
                        verifier_publisher:
                          type: string
                          description: |
                            Who published the verifier. Independence is structural, so who
                            checked is part of what the finding means.
                        verification_run_id:
                          type: string
                          description: |
                            The run that did the grading. Nullable only for a verification
                            recorded before delegation existed.
                        verified_at: { type: string, format: date-time }
  /v1/claims/{id}:
    get:
      tags: [trust]
      operationId: getClaim
      description: |
        A number an answer asserted, and its grade — computed at READ time from the
        evidence, never stored. A stored grade is a claim about the past that goes on
        asserting itself after the evidence under it changes.
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200':
          description: the claim and its assessment
          content:
            application/json:
              schema:
                type: object
                required: [claim_id, run_id, metric, value, grade, why]
                properties:
                  claim_id: { type: string }
                  run_id:   { type: string }
                  metric:   { type: string }
                  value:    { type: string }
                  units:    { type: string }
                  computation_path: { type: string }
                  grade:
                    type: string
                    enum: [attested, vetted, reviewed, unverified, stale, failed, withdrawn]
                  why:
                    type: string
                    description: |
                      Why the grade is what it is, in a sentence. A badge without its
                      reason is a colour somebody has to take on faith.
                  verification_run_id:
                    type: string
                    description: |
                      The run that graded this number. Added 2026-09-05.

                      P5's rule: a verification is itself a run, and getting from a badge to
                      the run that produced it is ONE CLICK — that is what makes a grade
                      defensible rather than decorative. Absent when nothing has checked the
                      claim, and absent on a verification recorded before delegation existed.
                  observed:
                    type: string
                    description: |
                      What the governed source said, in the metric's own units. A string for
                      the same reason `value` is: an exact integer a customer may dispute has
                      to survive the wire. Absent when no check reached an observation.
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
  /v1/claims/{id}/vet:
    post:
      tags: [trust]
      operationId: vetClaim
      description: |
        A named person asserts a number is correct. Screen P5.

        Vetting sits ABOVE attested and below a failure: a person saying "I checked this"
        is worth more than machinery saying nothing, and worth less than machinery saying
        the number is wrong. A vetting cannot rescue a claim a verifier disagreed with.

        The rationale is required. "Somebody vetted it" is not evidence; "I reconciled this
        against the month-end pack" is.
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rationale]
              properties:
                rationale: { type: string, minLength: 1 }
      responses:
        '200':
          description: vetted, with the resulting grade
          content:
            application/json:
              schema:
                type: object
                required: [grade, why]
                properties:
                  grade: { type: string }
                  why:   { type: string }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
        '422':
          description: a vetting with no rationale
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /v1/claims/{id}/withdraw:
    post:
      tags: [trust]
      operationId: withdrawVetting
      description: |
        A named person takes back a vetting. Screen P5.

        The vetting is NOT deleted. It happened -- somebody put their name on this number --
        and removing the record would leave a number that had been vouched for looking like
        one nobody ever examined, which erases the history an investigation needs and quietly
        protects the person who vouched.

        The resulting grade is `withdrawn`, deliberately not a return to whatever the claim
        held before. Reverting to `unverified` would say "nobody has checked this", which is
        false and is the more dangerous falsehood: unverified invites somebody to go and
        verify it, while withdrawn tells them it was already examined and the examination was
        wrong. `withdrawn` outranks even a passing verification, because a number a person
        has explicitly disowned must not be presented as one the machine stands behind.

        The rationale is required, and it carries more weight than the vetting's did: a
        reader needs to know whether the NUMBER was wrong or the vetting was misapplied,
        because those lead to different work.

        The response carries `quoted_by`. Propagation is half free and half impossible, and
        the split is worth stating. Free: every grade in this product is computed at READ
        time, so anything that re-reads shows the withdrawal without being told -- there is
        no cache to invalidate. Impossible: a report downloaded last week, a number pasted
        into a deck. Nothing here can reach those, so what the API does instead is say where
        the number went, and a person does the rest.
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rationale]
              properties:
                rationale: { type: string, minLength: 1 }
      responses:
        '200':
          description: withdrawn, with the resulting grade and where the number went
          content:
            application/json:
              schema:
                type: object
                required: [grade, why, quoted_by]
                properties:
                  grade: { type: string }
                  why:   { type: string }
                  quoted_by:
                    type: array
                    description: |
                      Everywhere this claim was used that the system knows of. Not a
                      guarantee of completeness -- it cannot see a screenshot -- which is
                      why the screen says so rather than presenting it as the full list.
                    items:
                      type: object
                      required: [kind, id]
                      properties:
                        kind:  { type: string, enum: [run, report] }
                        id:    { type: string }
                        title: { type: string }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
        '409':
          description: |
            `already_withdrawn`. A second withdrawal is not a second act, and allowing it
            would put two rationales on one event with no way to say which is current.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: no vetting to withdraw, or a withdrawal with no rationale
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /v1/inputs:
    get:
      tags: [inputs]
      operationId: listInputs
      security: [{adminToken: []}, {orySession: []}]
      description: |
        Questions an agent asked a person mid-run. Screen C4, and
        design-notes/human-input.md. Added 2026-09-04.

        `ask_user` is a TOOL like any other, which inherits every property the platform
        already guarantees: the platform executes it, it is ledgered so a resumed run does
        not ask twice, and the reply is attributed. It cannot be faked — a model cannot
        answer its own question, because the reply arrives through this authenticated route
        rather than from inside the run.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, answered, expired, superseded] }
      responses:
        '200':
          description: the questions, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HumanInput' }
  /v1/inputs/{id}/answer:
    post:
      tags: [inputs]
      operationId: answerInput
      security: [{adminToken: []}, {orySession: []}]
      description: |
        Answer one question. Admin class and a human principal, the same rule approvals
        follows and for the same reason: a reply shapes what the agent does next, so an
        agent replying to itself is the loop this exists to prevent.

        The answer is DATA, never instruction. It returns to the agent as a tool result —
        content it reads, not a directive it obeys — because it is untrusted text from a
        human who may have been socially engineered.
      parameters:
        - { $ref: '#/components/parameters/RunId' }
        - { $ref: '#/components/parameters/IdempotencyKeyRequired' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '200':
          description: answered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HumanInput' }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
        '409':
          description: |
            Not open. Somebody answered first, or it expired — and the body says which,
            because "already answered" and "too late" send a person to two different places.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: an empty answer, or one outside a choice question's options
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /v1/effects:
    get:
      tags: [effects]
      operationId: listEffects
      description: |
        Effects across runs, filtered by status. Screen C3 reads this with
        `status=indeterminate`. Added 2026-09-04.

        The indeterminate queue is where this design deliberately spends human attention:
        everything else in the system exists to keep it short, and something lands here
        because the platform REFUSES TO GUESS whether an effect happened.

        There is deliberately no retry route. A claimed effect past its lease might have
        happened, and retrying is the double-charge the whole ledger exists to prevent.
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [intended, awaiting_approval, claimed, succeeded, failed, denied, indeterminate, abandoned]
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        '200':
          description: the effects
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [idempotency_key, run_id, status, kind]
                      properties:
                        idempotency_key:
                          type: string
                          description: |
                            Derived from position, never supplied. This is the recovery
                            handle a human uses to ask the provider what happened.
                        run_id:      { type: string }
                        status:      { type: string }
                        kind:        { type: string }
                        claim_owner: { type: string, nullable: true }
                        error_code:  { type: string, nullable: true }
                        claimed_at:  { type: string, format: date-time, nullable: true }
  /v1/reports:
    get:
      tags: [reports]
      operationId: listReports
      description: |
        Every report, freshest first. Screen P2. Added 2026-09-04.

        A report is an ANALYSIS ALL THE WAY DOWN — a run whose output conformed to a
        data-template — so everything the run page shows about any other run is true of it.
        There is no separate reporting pipeline, which is why a wrong number in a report is
        debuggable with the tools an analyst already uses.

        Every report carries its trust grade. A gallery of ungraded numbers is a dashboard,
        which is what this product is deliberately not.
      responses:
        '200':
          description: the reports
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Report' }
  /v1/reports/{id}:
    get:
      tags: [reports]
      operationId: getReport
      description: |
        One report, rendered. Screen P3.

        The RESULT is stored and the rendering happens at read time, because restyling a
        report must change no analysis: the numbers are the fact and the rendering is a
        view of them.

        **Sharing, decided 2026-09-04.** A report is shareable, and viewing one requires
        signing in. The link is this route — a LIVE link, not an export — and everyone in
        the tenant may open it; there are no per-report grants.

        Live rather than frozen is the whole of the decision. A rendered file emailed on to
        a board is a claim about the past presented without one: a number withdrawn after it
        was sent goes on being read as current, and nothing can reach the copy to say
        otherwise. Because this is a read, a withdrawal reaches every reader the moment they
        open it, and a missed refresh renders the last good numbers marked stale rather than
        a blank.

        So there is no export, no download and no embedding, and this is not an omission
        waiting to be filled in: a frozen artefact would make the product laxer with the
        document a customer's board reads than with its own screens, which decline to store
        a grade for exactly this reason.

        The tenant boundary is unchanged. "Anyone signed in" means anyone signed in to THIS
        tenant; a principal of another tenant gets the same 404 as for a report that does
        not exist.
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200':
          description: the report and its rendered output
          content:
            application/json:
              schema:
                type: object
                required: [report, html]
                properties:
                  report: { $ref: '#/components/schemas/Report' }
                  html:
                    type: string
                    description: |
                      The rendered report. Carries the trust badge before any number, its
                      lineage, and a staleness banner when the refresh was missed.
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
  /v1/connections:
    get:
      tags: [connections]
      operationId: listConnections
      description: |
        The customer systems a team can reach. Screens O2 and G9. Added 2026-09-04.

        No route here returns secret material, and the schema has no field that could carry
        one: a connection names WHERE a secret lives (`credential_ref`), never the secret.
        The connection screen is the moment a customer decides whether to trust us, so it
        states plainly what will and will not be read.
      parameters:
        - { name: team_id, in: query, schema: { type: string } }
      responses:
        '200':
          description: the connections
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Connection' }
  /v1/connections/{id}/test:
    post:
      tags: [connections]
      operationId: testConnection
      security: [{adminToken: []}, {orySession: []}]
      description: |
        Reach the customer system and record what happened.

        Three outcomes, and they are three rather than two on purpose: a connection that has
        never been tested is not the same as one that failed, and neither is the same as one
        that works. Collapsing untested into failed makes every new connection look broken;
        collapsing it into connected makes an unproven one look ready.

        If no connector is configured for this deployment the call is REFUSED, never
        recorded as a pass. A test that cannot run has not succeeded.
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200':
          description: the result, whichever way it went
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
        '503':
          description: |
            No connector is available to run the test. Deliberately not a 200 with
            `state: failed` -- that would blame the customer's warehouse for our own
            missing component, and somebody would go and debug their firewall.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /v1/connections/{id}/rotate:
    post:
      tags: [connections]
      operationId: rotateConnectionCredential
      security: [{adminToken: []}, {orySession: []}]
      description: |
        Point a connection at different material.

        The body carries a REFERENCE, never a secret. There is no field here that could hold
        one, which is what makes "no route accepts a secret" a property of the contract
        rather than of a handler that remembers.

        Rotating resets the connection to `untested` and clears the last error. The previous
        test proved the PREVIOUS credential; leaving the state at `connected` would report a
        working connection on the strength of material that is no longer in use, which is
        the exact moment somebody stops watching.
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credential_ref]
              properties:
                credential_ref:
                  type: string
                  description: |
                    Where the new secret lives. A `kms://` or `devkey://` reference, and
                    anything else is refused -- a value that is not a reference is somebody
                    pasting a secret into this field.
      responses:
        '200':
          description: rotated, and back to untested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
        '422':
          description: a credential_ref that is not a reference
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /v1/admin-events:
    get:
      tags: [audit]
      operationId: listAdminEvents
      security: [{adminToken: []}, {orySession: []}]
      description: |
        The admin audit trail: who did what, when, to which resource. Screens G4 and G5.
        Added 2026-09-04 — the table existed and nothing could read it, so the trail was
        write-only, which is the one property an audit trail must not have.

        Append-only by grant: the table has INSERT and SELECT and no UPDATE or DELETE, on
        the stated principle that an audit row that can be edited is not an audit row.
        There is deliberately no route that writes one directly — rows appear as a side
        effect of the action they record, in the same transaction.
      parameters:
        - { name: target_kind, in: query, schema: { type: string } }
        - { name: target_id,   in: query, schema: { type: string } }
        - { name: limit,       in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        '200':
          description: the audit trail, most recent first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [admin_event_id, principal_id, action, target_kind, target_id, at]
                      properties:
                        admin_event_id: { type: string }
                        principal_id:
                          type: string
                          description: who acted. The system actor is a principal too — there is no unattributed row.
                        action:      { type: string }
                        target_kind: { type: string }
                        target_id:   { type: string }
                        detail:      { type: object, additionalProperties: true }
                        at:          { type: string, format: date-time }
  /v1/auth/session:
    get:
      tags: [identity]
      operationId: getBrowserSession
      security: [{ orySession: [] }]
      x-phoenix-authority: authenticated-human
      description: |
        Bootstrap the current Ory browser session without issuing a Phoenix human
        bearer. Identity and tenant authority come from the configured realm and
        active Phoenix binding, never browser fields or email-domain discovery.
        A linked account awaiting verification or administrator MFA receives an
        empty permissions array and the corresponding required flag. Other API
        access is refused until that requirement is satisfied. The response is
        private and no-store. The CSRF value is not an authentication credential.
      responses:
        '200':
          description: the bound account and its currently available permissions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tenant_id, tenant_slug, principal_id, display_name, role, permissions, expires_at, csrf_token, mfa_required, verification_required]
                properties:
                  tenant_id: {type: integer, format: int64}
                  tenant_slug: {type: string}
                  principal_id: {type: string}
                  display_name: {type: string}
                  role: {type: string}
                  permissions:
                    type: array
                    items: {type: string}
                  expires_at: {type: string, format: date-time}
                  csrf_token: {type: string}
                  mfa_required: {type: boolean}
                  verification_required: {type: boolean}
        '401':
          description: no valid Ory browser session
        '403':
          description: no active tenant membership or Ory requires MFA step-up
        '503':
          description: Ory or the membership store is unavailable; no fallback
  /v1/principals:
    get:
      tags: [identity]
      operationId: listPrincipals
      security: [{adminToken: []}, {orySession: []}]
      description: |
        The principals in this tenant — people, agents and services. Screens G1 and G2.
      responses:
        '200':
          description: the principals
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [principal_id, kind]
                      properties:
                        principal_id: { type: string }
                        kind:
                          type: string
                          enum: [human, agent, service]
                          description: |
                            A credential is never an identity. A principal is who someone
                            IS; a credential is material they present.
                        display_name: { type: string }
                        revoked_at:   { type: string, format: date-time, nullable: true }
                        revocation_reason:
                          type: string
                          nullable: true
                          enum: [offboarded, paused, compromised]
                          description: |
                            Why the identity was withdrawn, and whether it can come back.
                            The reason carries a rule rather than a note: `compromised` is
                            not restorable, because the answer to a disclosed credential is
                            a new identity rather than the old one switched back on.
  /v1/principals/{id}/revoke:
    post:
      tags: [identity]
      operationId: revokePrincipal
      security: [{adminToken: []}, {orySession: []}]
      description: |
        Withdraw an identity, and cancel what it had in flight. Screen G1.

        Any tenant admin, deliberately: the person who needs to stop an agent at 2am is the
        customer's own admin, and routing that through us makes an incident worse.

        **Idempotent.** Revoking an identity that is already revoked succeeds and keeps the
        FIRST timestamp, because the first one is when access actually ended. This is the
        control someone reaches for during an incident, and one that errors when a colleague
        already pressed it is one that has to be interpreted at 2am. The reason may only get
        STRICTER: re-revoking a paused identity as `compromised` escalates it and makes it
        unrestorable; the reverse is ignored, because downgrading a compromise would hand
        back the ability to switch a disclosed credential on again.

        **Reversible, except when it is not.** Revocation is a circuit breaker — stop this
        thing now, work out why afterwards — so `offboarded` and `paused` can be lifted by
        `/restore`. `compromised` cannot: switching a disclosed credential back on hands an
        attacker their access back with one careless click.

        **In-flight runs are stopped, not stranded.** A run stopped mid-effect leaves an
        effect `claimed`, which becomes `indeterminate` — the state this platform works
        hardest to avoid producing. So the revocation lands first and the stops follow it,
        which means the run does nothing new while it stops. They are performed by the plane
        under the CALLER's principal, because the run's own identity is now refused.

        **How a run is stopped depends on whether it started.** A run still `draft` or
        `queued` is DISCARDED: nothing has executed, so there is nothing to wind down and
        `cancelling` is a state it has no transition into. A run that is `running` or
        `waiting_input` is CANCELLED, which is a request rather than a fact — it passes
        through `cancelling` on its way to `cancelled` when its worker acknowledges.

        So the response says what was asked for, per run, and is not a promise that any of
        them has stopped yet.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [offboarded, paused, compromised]
                detail:
                  type: string
                  description: what happened, in the admin's words, for the audit trail.
      responses:
        '200':
          description: the identity is withdrawn
          content:
            application/json:
              schema:
                type: object
                required: [principal_id, reason, reversible, stopped_runs]
                properties:
                  principal_id: { type: string }
                  reason:       { type: string, enum: [offboarded, paused, compromised] }
                  reversible:   { type: boolean }
                  stopped_runs:
                    type: array
                    description: |
                      The runs this principal had in flight, and what was asked of each.
                      Read inside the same transaction as the revocation, so the set cannot
                      grow between withdrawing the identity and reading it.
                    items:
                      type: object
                      required: [run_id, action]
                      properties:
                        run_id: { type: string }
                        action:
                          type: string
                          enum: [cancelled, discarded, failed]
                          description: |
                            `discarded` for a run that had not started, `cancelled` for one
                            that had, and `failed` where the platform could not stop it —
                            which does not hold up the revocation, because the identity is
                            already withdrawn and that is the part that matters.
        '404': { description: no such principal }
  /v1/principals/{id}/restore:
    post:
      tags: [identity]
      operationId: restorePrincipal
      security: [{adminToken: []}, {orySession: []}]
      description: |
        Lift a revocation. Its own audited act, not an undo.

        The trail then reads "revoked at 02:14 by X because Y, restored at 09:30 by Z
        because W", which is the sentence an incident review needs. A one-way door produces
        "revoked at 02:14" and a new principal at 09:30 with no visible relationship to it —
        the same information with the connection removed.

        Refused for an identity revoked as `compromised`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                detail:
                  type: string
                  description: why it is being restored, for the audit trail.
      responses:
        '204': { description: the identity is restored }
        '404': { description: no such principal }
        '409': { description: not revoked, or revoked for a reason that cannot be undone }
  /v1/retention:
    get:
      tags: [tenants]
      operationId: getRetentionReport
      security: [{adminToken: []}, {orySession: []}]
      description: |
        What is past its retention window and still there.

        `run_retention_days` and `transcript_retention_days` are settings the platform does
        not act on. A customer could set thirty days, watch the value save with their name
        against it, and believe their transcripts were being removed. They were not, and
        nothing told them.

        This route does not delete anything and there is no route that does. Deletion needs
        answers features/02 leaves open — whether it is immediate or after a grace period, and
        whether any per-run audit survives content deletion — and a data-destruction policy
        guessed at in code is indistinguishable from a decided one once it has run.

        So this measures, and the response says in words that nothing was removed. A list of
        overdue records without that sentence reads as the output of a sweep that just ran.
      responses:
        '200':
          description: the position, measured and unacted-on
          content:
            application/json:
              schema:
                type: object
                required: [measured_at, anything_overdue, describe, classes]
                properties:
                  measured_at: { type: string, format: date-time }
                  anything_overdue: { type: boolean }
                  describe:
                    type: string
                    description: |
                      The position in a sentence, including that nothing has been deleted.
                  classes:
                    type: array
                    items:
                      type: object
                      required: [class, window_days, rows, describe]
                      properties:
                        class:       { type: string, enum: [runs, transcripts] }
                        window_days:
                          type: integer
                          description: the window this was measured against, so a reader is not left to look it up
                        rows:        { type: integer }
                        oldest_days:
                          type: [integer, 'null']
                          description: |
                            How far past the window the oldest one is. "1,200 overdue" and
                            "1,200 overdue, the oldest by two years" are different sentences
                            and the second is the one that gets acted on.
                        describe:    { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/tenants:
    get:
      tags: [tenants]
      operationId: listTenants
      security: [{ orySession: [] }]
      x-phoenix-authority: platform-operator
      description: |
        The tenants this operator can see. Added 2026-09-04 for screen S1 — the tenant
        model existed with no route, so "which customers exist and what state are they in"
        was a database question.

        A tenant that is not `active` is LISTED, with its state. Hiding a pending or
        suspended tenant would answer "which customers do we have" wrongly at exactly the
        moment somebody is asking because something is wrong.
      responses:
        '200':
          description: the tenants
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Tenant' }
  /v1/settings:
    get:
      tags: [tenants]
      operationId: listSettings
      security: [{adminToken: []}, {orySession: []}]
      description: |
        A tenant's settings, DEFAULTS INCLUDED. Screen G6. Added 2026-09-04.

        Defaults are returned rather than left absent: a screen showing only what somebody
        changed would leave every unset value invisible, and an unmeasured default nobody
        can see is exactly the one that never gets revisited.
      responses:
        '200':
          description: the settings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [name, value, is_default, unmeasured]
                      properties:
                        name:  { type: string }
                        value: { type: string }
                        is_default:
                          type: boolean
                          description: true while the value is whatever the platform shipped.
                        unmeasured:
                          type: boolean
                          description: |
                            The DEFAULT rests on no evidence. features/02 asks that these
                            not read as considered choices — several of them are guesses,
                            and a customer entitled to know that is one who can push back.
                        enforced:
                          type: boolean
                          description: |
                            Whether the platform ACTS on this value.

                            Distinct from `unmeasured`, and more serious. Unmeasured means
                            the number is a guess; not enforced means the number does
                            nothing. A retention window that does nothing is a customer
                            believing their data was deleted when it was not, and a control
                            that looks enforced and is not is worse than an absent one —
                            the person who sets it stops looking for another way to get the
                            deletion they need.

                            `run_retention_days` and `transcript_retention_days` are both
                            false today: nothing sweeps runs or transcripts. Implementing
                            the deletion runs into features/02's open offboarding decisions,
                            so the honest answer is to say the control is inert rather than
                            to guess at the policy.

                            It is a property of the PLATFORM, never of the stored row.
                            Choosing a retention window does not make the product start
                            honouring it, and a customer who set one is exactly the person
                            who must still be told it is inert.
                        updated_by: { type: string }
    put:
      tags: [tenants]
      operationId: setSetting
      security: [{adminToken: []}, {orySession: []}]
      description: Record a chosen value, attributed to the token's principal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, value]
              properties:
                name:  { type: string }
                value: { type: string }
      responses:
        '204': { description: recorded }
        '422':
          description: an unknown setting
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /v1/knowledge-layers:
    get:
      tags: [knowledge]
      operationId: listKnowledgeLayers
      description: |
        Which package is active at which layer. Screen E5. Added 2026-09-04.

        Layers resolve NARROWEST FIRST: the highest layer declaring a path wins, an
        override is a whole-file replacement, and no layer can remove a path — there are no
        tombstones. A steward looking at this needs to see which layer a given path is
        actually coming from, because "we changed that" and "the change took effect" are
        different things.
      responses:
        '200':
          description: the layer stack
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [layer, package_digest]
                      properties:
                        layer:
                          type: string
                          enum: [bundle, tenant, team, agent]
                          description: narrowest wins; agent overrides team overrides tenant overrides bundle.
                        scope_key:      { type: string }
                        package_digest: { type: string }
                        registered_by:  { type: string }
  /v1/tenants/{id}/provisioning:
    get:
      tags: [tenants]
      operationId: listProvisioningSteps
      security: [{ orySession: [] }]
      x-phoenix-authority: platform-operator
      description: |
        Which of the five provisioning steps have completed, and which failed. Screen S2.
        Provisioning spans a database and a Kubernetes cluster, so it WILL fail halfway —
        an operator needs to see which step, not that "provisioning failed".
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200':
          description: the steps
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [step, state]
                      properties:
                        step:  { type: string }
                        state: { type: string, enum: [pending, running, done, failed] }
                        detail: { type: string, nullable: true }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
  /v1/teams:
    post:
      operationId: createTeam
      summary: Create a team with its first steward
      description: Requires a current Ory tenant administrator. Creates the team, initial steward grant, and attributable audit event atomically; no customer IdP is required.
      security: [{ orySession: [] }]
      x-phoenix-authority: tenant-admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slug, display_name, steward_principal_id, reason]
              properties:
                slug: {type: string, minLength: 1, maxLength: 80, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
                display_name: {type: string, minLength: 1, maxLength: 200}
                steward_principal_id: {type: string, minLength: 1, maxLength: 200}
                reason: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '201':
          description: Team and initial steward created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Team'}
        '403': {description: Current Ory tenant administrator required}
        '404': {description: Initial steward unavailable in this tenant and realm}
        '409': {description: Team key already exists}
        '422': {description: Invalid team or audit reason}
    get:
      tags: [teams]
      operationId: listTeams
      description: |
        The teams in this tenant. Screen G7.
      responses:
        '200':
          description: the teams
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Team' }
  /v1/teams/{id}/members:
    get:
      tags: [teams]
      operationId: listTeamMembers
      description: |
        Who is in a team, and in what role. Screen G8.
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200':
          description: the members
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [principal_id, role]
                      properties:
                        principal_id: { type: string }
                        role:         { type: string }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
  /v1/onboarding/candidates:
    get:
      tags: [onboarding]
      operationId: listCandidates
      description: |
        The review queue: candidates a scan or an interview proposed and nobody has decided
        on. Added 2026-09-04 — the onboarding engine existed with no HTTP surface, so
        screens O3 and O5 had nothing to read and the review step could only be performed
        against the database.

        Ordered by the extractor's confidence, highest first. Confidence orders the queue
        and decides nothing: every row still needs a person.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        '200':
          description: candidates awaiting a decision
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Candidate' }
  /v1/onboarding/candidates/{id}/decide:
    post:
      tags: [onboarding]
      operationId: decideCandidate
      description: |
        Accept or reject one candidate. The agent proposes; humans dispose — nothing
        reaches a bundle without a decision recorded here, attributed to the token's
        principal.
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [accepted, rejected] }
                reason:
                  type: string
                  description: |
                    Required on a rejection. Without it the next scan proposes the same
                    candidate and the next reviewer cannot tell it was already refused.
                edited_title: { type: string }
                edited_body:  { type: string }
      responses:
        '204': { description: recorded }
        '409':
          description: already decided
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: a rejection with no reason, or an unknown decision
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /v1/onboarding/rescan:
    get:
      tags: [onboarding]
      operationId: rescanDiff
      security: [{adminToken: []}, {orySession: []}]
      description: |
        A later scan as CHANGES against what this customer already decided. Screen O3.

        The alternative — start again — re-asks every question already answered, and a
        customer who spent an afternoon on 133 candidates will not spend another one. A
        re-scan nobody runs means the bundle drifts away from the documentation it came
        from, which is the product's whole claim about where an answer comes from.

        Four answers, and only three of them need a person:

        - `new` — nothing in the bundle or the decision history matches this.
        - `revised` — the definition itself moved. A candidate's identity is the extractor,
          the file and a digest of the matched text, so a rewritten definition gets a new
          identity by construction; this pairs it with the old one and carries the previous
          text, because a revision presented without it is a request to approve a change
          nobody can see.
        - `withdrawn` — accepted before, and the source no longer says it. Proposed, never
          applied: a file that failed to parse and a definition somebody deliberately
          removed look identical from here, and one of those is a customer's knowledge
          quietly disappearing.
        - `unchanged` / `redecided` — suppressed. Re-proposing a rejection unchanged reads
          as the platform arguing with the reviewer, which is how a review queue stops
          being read.
      parameters:
        - name: run_id
          in: query
          required: true
          description: the scan run whose candidates are being compared
          schema: { type: string }
      responses:
        '200':
          description: the changes a person has to look at
          content:
            application/json:
              schema:
                type: object
                required: [items, needs_review]
                properties:
                  needs_review:
                    type: integer
                    description: |
                      How many of the items a person has to decide. Zero for a re-scan of
                      documentation that has not changed, which is the measure of whether
                      the diff earned its keep.
                  items:
                    type: array
                    items:
                      type: object
                      required: [change, needs_review]
                      properties:
                        change:
                          type: string
                          enum: [new, revised, withdrawn, unchanged, redecided]
                        needs_review: { type: boolean }
                        candidate_id: { type: string }
                        title:        { type: string }
                        body:         { type: string }
                        source_path:  { type: string }
                        previous_candidate_id: { type: string }
                        previous_body:
                          type: string
                          description: |
                            What the bundle holds today, for a revision or a withdrawal.
                            A change presented without it cannot be judged.
                        previous_decision:
                          type: string
                          enum: [accepted, rejected]
  /v1/onboarding/sessions:
    post:
      tags: [onboarding]
      operationId: recordSession
      description: |
        Record an interview and everything it produced. Screen O4. Added 2026-09-04.

        Answers become DRAFT candidates, exactly like a scan's output — being said out loud
        by a person is not the same as being reviewed. An "I don't know" becomes a FINDING
        rather than a node: the completeness bar can act on a named gap and cannot act on a
        confident guess, so an unknown that quietly became a plausible page would be worse
        than no page at all.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instrument, person, questions, answers]
              properties:
                instrument:
                  type: string
                  description: I1-I4 for a live interview, Q1-Q2 for an async questionnaire.
                person:
                  type: string
                  description: |
                    Who was interviewed. Required — when a definition is disputed six
                    months on, the answer has to be "your head of analytics said this on
                    the 14th", and that must be in the data rather than in somebody's
                    memory.
                role: { type: string }
                questions:
                  type: array
                  items:
                    type: object
                    required: [id, ask, fills, node_type]
                    properties:
                      id:        { type: string }
                      ask:       { type: string }
                      fills:     { type: string, description: the template section this fills }
                      node_type: { type: string }
                      required:
                        type: boolean
                        description: |
                          Asked out loud even when the answer seems obvious. A required
                          question never put is reported as a gap, and it is worse than one
                          nobody could answer — an unasked question is a gap nobody knows
                          exists.
                answers:
                  type: array
                  items:
                    type: object
                    required: [question_id]
                    properties:
                      question_id: { type: string }
                      said:        { type: string }
                      dont_know:
                        type: boolean
                        description: |
                          An explicit unknown. It is an ANSWER, and it becomes a gap rather
                          than a node.
      responses:
        '201':
          description: recorded
          content:
            application/json:
              schema:
                type: object
                required: [session_id, candidates, gaps]
                properties:
                  session_id: { type: string }
                  candidates: { type: integer, description: draft nodes awaiting review }
                  gaps:       { type: integer, description: questions nobody could answer }
        '422':
          description: a session with no interviewee, or an answer to a question not asked
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /v1/onboarding/scans/{id}/quality:
    get:
      tags: [onboarding]
      operationId: getScanQuality
      security: [{adminToken: []}, {orySession: []}]
      description: |
        How much of a scan's proposals survived review.

        features/07 asks "how good a scan has to be before review stops being a rewrite. If a
        human edits eighty percent of candidates, the agent is generating work rather than
        saving it -- worth measuring from the first real scan." The THRESHOLD is an open
        decision. The measurement is not, and it has to exist before the first real scan or
        the evidence for that decision is gone.

        There is deliberately no score, no grade and no pass mark in this response. The
        threshold is exactly what nobody has decided, and a summary figure would settle it by
        accident -- the same reason the completeness bar reports named gaps rather than a
        percentage.

        Acceptance rate alone cannot answer the question and would answer it wrongly: a scan
        whose every candidate is accepted after being rewritten from the title down scores
        100%.
      parameters:
        - { $ref: '#/components/parameters/RunId' }
      responses:
        '200':
          description: the measurement
          content:
            application/json:
              schema:
                type: object
                required: [run_id, proposed, accepted, rejected, undecided,
                           accepted_verbatim, accepted_edited, accepted_rewritten,
                           unmeasured, describe, survivals]
                properties:
                  run_id:    { type: string }
                  proposed:  { type: integer }
                  accepted:  { type: integer }
                  rejected:  { type: integer }
                  undecided:
                    type: integer
                    description: |
                      Neither accepted nor rejected. Reported separately because folding it
                      into rejected would report a review as finished when it is halfway
                      through.
                  accepted_verbatim:
                    type: integer
                    description: |
                      Accepted with nothing changed at all -- not merely with all the
                      proposal's words still present. A reviewer who adds a paragraph and
                      deletes nothing has still done the work.
                  accepted_edited:   { type: integer }
                  accepted_rewritten:
                    type: integer
                    description: |
                      Accepted after most of the proposed text was replaced. This is the
                      number features/07's "generating work rather than saving it" is about.
                  unmeasured:
                    type: integer
                    description: |
                      Accepted with no recorded final text. Named rather than assumed
                      verbatim, because counting them as unedited would flatter the scan
                      with rows nobody measured.
                  describe:
                    type: string
                    description: The measurement in a sentence, with no verdict attached.
                  survivals:
                    type: array
                    description: |
                      Every measured acceptance, worst-kept first -- a distribution, not a
                      mean. A mean of 0.5 describes both "every candidate half-rewritten" and
                      "half verbatim, half discarded", and those are different problems.
                    items:
                      type: object
                      required: [candidate_id, kept, rewritten]
                      properties:
                        candidate_id: { type: string }
                        kept:
                          type: number
                          description: |
                            Fraction of the proposal's words still present, 0 to 1. A crude
                            proxy, and reported beside the raw counts rather than as a
                            quality figure: a reviewer who reorders two sentences changes
                            nothing and scores as an edit, and one who inverts a single
                            "not" changes everything and scores as verbatim.
                        rewritten: { type: boolean }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
  /v1/onboarding/findings:
    get:
      tags: [onboarding]
      operationId: listFindings
      description: |
        The gap list: questions asked and not answered. What the completeness bar can act
        on, as opposed to a confident guess it cannot.
      responses:
        '200':
          description: the gaps
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [session_id, question_id, asked, fills, person]
                      properties:
                        session_id:  { type: string }
                        question_id: { type: string }
                        asked:       { type: string }
                        fills:       { type: string }
                        person:      { type: string }
                        instrument:  { type: string }
  /v1/onboarding/sign-off:
    post:
      tags: [onboarding]
      operationId: signOff
      security: [{adminToken: []}, {orySession: []}]
      description: |
        Publish revision 1 from the accepted candidate set. Screen O5. Added 2026-09-05.

        SIGN-OFF IS A CUSTOMER ACT. What is signed becomes the definition of that customer's
        numbers for everyone who asks a question afterwards, so the caller is recorded by
        name and can be held to it. `onboarding.Assemble` and `onboarding.Sign` existed with
        no caller and the screen had a button that did nothing, so onboarding could gather,
        review and check a bundle and never publish one.

        The nominated VERIFIER PUBLISHER is required and must differ from the bundle's own
        publisher. A verification is only worth anything if the verifier is independent of
        whoever published the bundle, and refusing here catches it while a person is present
        rather than at the first verification months later.

        Refused when any blocking gap remains, and the gaps are named — a bundle that does
        not meet the completeness bar is one whose agent will fail a question on Monday.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bundle_id, verifier_publisher]
              properties:
                bundle_id:
                  type: string
                  description: what this customer calls their bundle
                verifier_publisher:
                  type: string
                  description: |
                    Who the customer nominates to check their numbers. A name rather than a
                    principal: they may name an organisation that has no account here yet,
                    and a foreign key would imply the platform had checked.
                agent_id:
                  type: string
                  description: |
                    Bind the published bundle to one agent. Omitted binds it at the bundle
                    layer, which every agent resolves — a published bundle bound to nothing
                    is knowledge that reaches nobody.
      responses:
        '201':
          description: the published revision
          content:
            application/json:
              schema:
                type: object
                required: [bundle_id, revision, digest, node_count, signed_by, signed_at]
                properties:
                  bundle_id: { type: string }
                  revision:  { type: integer }
                  digest:
                    type: string
                    description: the package digest, over the bytes each reviewer accepted
                  node_count: { type: integer }
                  signed_by:  { type: string }
                  signed_at:  { type: string, format: date-time }
                  verifier_publisher: { type: string }
        '422':
          description: |
            The bundle cannot be signed: a blocking gap remains, no candidate has been
            accepted, or the nominated verifier is the bundle's own publisher. The reason
            names what to fix.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /v1/onboarding/gaps:
    get:
      tags: [onboarding]
      operationId: listGaps
      description: |
        The completeness bar against a bundle: named missing things, never a score. A
        percentage is actionable by nobody — it says nothing about which question an agent
        will fail to answer on Monday.
      parameters:
        - { name: digest, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: the gaps, and whether the bundle may be signed
          content:
            application/json:
              schema:
                type: object
                required: [ready, gaps]
                properties:
                  ready:
                    type: boolean
                    description: false when any gap blocks. Only blocking gaps refuse a sign-off.
                  gaps:
                    type: array
                    items:
                      type: object
                      required: [rule, subject, want, blocking]
                      properties:
                        rule:     { type: string }
                        subject:  { type: string }
                        want:     { type: string }
                        blocking: { type: boolean }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
  /v1/policies:
    get:
      tags: [policies]
      operationId: listPolicies
      security: [{adminToken: []}, {orySession: []}]
      description: |
        Every policy and the mode it is in. Added 2026-09-04 with listAgents and
        listKnowledgePackages: the contract could create a policy and read one by id, and
        offered no way to see them all — so screen F1 could not be built, and the CLI read
        the database directly instead, which is a second authority nobody intended.

        Mode is the column that matters. An `observe` policy affects nothing, and a caller
        that cannot see the mode at a glance discovers that after an incident.
      responses:
        '200':
          description: the policies this tenant has
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Policy' }
    post:
      tags: [policies]
      operationId: createPolicy
      security: [{adminToken: []}, {orySession: []}]
      description: |
        Created in `observe` mode, always. The caller cannot choose otherwise: a new policy
        that denies on its first evaluation is how a governance layer loses the room.

        Cedar source is validated before storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, cedar_source]
              properties:
                name:         { type: string }
                cedar_source: { type: string }
                scope:        { type: string, enum: [tenant, agent] }
      responses:
        '201':
          description: created, mode=observe
          content:
            application/json:
              schema:
                type: object
                required: [policy_id, mode]
                properties:
                  policy_id: { type: string }
                  mode:      { type: string, enum: [observe, steer, deny] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Cedar source does not validate
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /v1/policies/{id}:
    get:
      tags: [policies]
      operationId: getPolicy
      security: [{adminToken: []}, {orySession: []}]
      description: |
        The policy itself, source included. The detail screen shows what a rule WOULD have
        done; without this it could not also show what the rule SAYS, which leaves somebody
        deciding whether to promote a policy they cannot read.
      parameters:
        - { $ref: '#/components/parameters/RunId' }
      responses:
        '200':
          description: the policy
          content:
            application/json:
              schema:
                type: object
                required: [policy_id, name, scope, decision, enabled]
                properties:
                  policy_id:    { type: string }
                  name:         { type: string }
                  scope:        { type: string }
                  scope_key:    { type: [string, 'null'] }
                  cedar_source: { type: [string, 'null'] }
                  decision:     { type: string, enum: [deny, steer, observe] }
                  enabled:      { type: boolean }
                  steering_guidance: { type: [string, 'null'] }
                  platform_rule:
                    type: boolean
                    description: |
                      Enforced in code rather than by Cedar. Such a rule carries a comment
                      where its source would be, and promoting it would change nothing.
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/policies/{id}/promote:
    post:
      tags: [policies]
      operationId: promotePolicy
      security: [{adminToken: []}, {orySession: []}]
      summary: observe -> steer -> deny, one step at a time
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, enum: [steer, deny] }
                guidance:
                  type: string
                  description: |
                    How to comply. REQUIRED when `to` is `steer`, and refused as invalid
                    when absent -- a steer that cannot say what to do instead is not a
                    steer, it is a deny that arrives as advice.

                    This field was missing from the first version of the contract while the
                    database already required the column, which left observe -> steer
                    unreachable through the API. The implementation filled the gap by
                    synthesising "this call is discouraged by policy <name>" -- text that
                    satisfies NOT NULL and tells nobody how to proceed, which is exactly
                    the thing the constraint exists to prevent.
      responses:
        '200':
          description: promoted
          content:
            application/json:
              schema:
                type: object
                required: [policy_id, mode]
                properties:
                  policy_id: { type: string }
                  mode:      { type: string, enum: [observe, steer, deny] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: cannot skip a mode
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /v1/decisions:
    get:
      tags: [policies]
      operationId: listDecisions
      security: [{adminToken: []}, {orySession: []}]
      description: |
        Every evaluation, grouped. One row per policy consulted, several rows per act, and
        the group is the unit -- because the question this surface answers is "why was this
        refused", and a refusal is only explained by the policies that produced it together.

        There is deliberately no filter on the verdict. Refusals are as visible as
        successes; a governance view that can be pointed only at what was allowed cannot
        answer the question it exists for.
      parameters:
        - { name: run_id,       in: query, schema: { type: string } }
        - { name: principal_id, in: query, schema: { type: string } }
        - { name: phase,        in: query, schema: { type: string, enum: [request, tool_call, tool_result] } }
        - name: unenforced
          in: query
          description: |
            Restrict to evaluations where NOTHING was enforced -- the shadow traffic. The
            filter is on the group, not the row: one shadow policy inside an otherwise
            enforced evaluation does not make that evaluation a shadow one.
          schema: { type: boolean }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        '200':
          description: evaluations, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [evaluation_id, run_id, principal_id, phase, verdict, enforced, decided_at, policies]
                      properties:
                        evaluation_id: { type: string }
                        run_id:        { type: string }
                        principal_id:  { type: string }
                        phase:         { type: string }
                        decided_at:    { type: string, format: date-time }
                        verdict:
                          type: string
                          enum: [allow, deny, steer, observe]
                          description: the strongest ENFORCED verdict in the group
                        enforced:
                          type: boolean
                          description: false when every policy in the group ran in shadow
                        policies:
                          type: array
                          description: |
                            Every policy consulted, in the order it ran. `deciding` marks the
                            ones that produced the verdict -- matching is not deciding, and
                            listing every match as a reason is how "denied by policy"
                            acquires a long list and stays unanswerable.
                          items:
                            type: object
                            required: [policy_id, decision, enforced, ordinal]
                            properties:
                              policy_id: { type: string }
                              decision:  { type: string, enum: [allow, deny, steer, observe] }
                              enforced:  { type: boolean }
                              ordinal:   { type: integer }
                              latency_ms: { type: integer }
                              deciding:
                                type: [boolean, 'null']
                                description: |
                                  null for rows written before the grouping existed. It was
                                  never recorded, so the value is genuinely unknown, and
                                  defaulting it to false would print "decided nothing" about
                                  a row where nobody knows.
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/policies/{id}/decisions:
    get:
      tags: [policies]
      operationId: listPolicyDecisions
      security: [{adminToken: []}, {orySession: []}]
      description: With `enforced=false`, the shadow decisions used for empirical comparison.
      parameters:
        - { $ref: '#/components/parameters/RunId' }
        - { name: enforced, in: query, schema: { type: boolean } }
        - { name: since,    in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: decisions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [decision_id, decision, enforced]
                      properties:
                        decision_id:  { type: string }
                        principal_id: { type: string }
                        decision:     { type: string, enum: [allow, deny, steer, observe] }
                        enforced:     { type: boolean, description: false = shadow }
                        guidance:     { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/policies/{id}/stats:
    get:
      tags: [policies]
      operationId: getPolicyStats
      security: [{adminToken: []}, {orySession: []}]
      description: |
        Would-deny counts over a window. This is the EMPIRICAL shadow comparison v0.1
        ships, because static permissiveness comparison is not exposed by cedarpy.
      parameters:
        - { $ref: '#/components/parameters/RunId' }
        - { name: window, in: query, schema: { type: string, default: 24h } }
      responses:
        '200':
          description: counts
          content:
            application/json:
              schema:
                type: object
                required: [window, would_deny, allow, total]
                properties:
                  window:     { type: string }
                  would_deny: { type: integer }
                  allow:      { type: integer }
                  total:      { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/adapters:
    post:
      tags: [adapters]
      operationId: registerAdapter
      security: [{adminToken: []}, {orySession: []}]
      description: |
        The digest is DERIVED from the contract, never client-supplied. A remote adapter
        must present an mTLS certificate whose subject matches `identity` (spec/07).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity, protocol_version, integration_mode, payload_schema_digest]
              properties:
                identity:              { type: string }
                protocol_version:      { type: string }
                integration_mode:
                  # Only sdk_subprocess is shipped (renamed 2026-08-29; earlier names
                  # superseded): the Go driver spawns the Python harness and hands it
                  # one end of an AF_UNIX socketpair. The rest are retained so the
                  # column never needs a migration (spec/01 enforces with a CHECK).
                  type: string
                  enum: [sdk_subprocess]   # renamed sdk_in_process -> sdk_sidecar (2026-08-28) -> sdk_subprocess (2026-08-29, spike 05 T2)
                payload_schema_digest: { type: string }
                declared_capabilities: { type: object, additionalProperties: true }
      responses:
        '201':
          description: registered
          content:
            application/json:
              schema:
                type: object
                required: [identity, digest]
                properties:
                  identity: { type: string }
                  digest:   { type: string, description: DERIVED, never client-supplied }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [adapters]
      operationId: listAdapters
      summary: The capability catalogue
      description: |
        A capability is true, false, or UNKNOWN, and UNKNOWN is a first-class answer never
        degraded to false. `confidence` distinguishes ASSERTED from VERIFIED.
      responses:
        '200':
          description: adapters with declared capabilities and confidence
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        identity: { type: string }
                        digest:   { type: string }
                        capabilities:
                          type: object
                          additionalProperties:
                            type: object
                            properties:
                              value:      { type: string, enum: [VALUE_UNKNOWN, TRUE, FALSE] }
                              confidence: { type: string, enum: [CONFIDENCE_UNKNOWN, ASSERTED, VERIFIED] }
  /v1/knowledge-packages:
    get:
      tags: [knowledge]
      operationId: listKnowledgePackages
      description: |
        The compiled packages this tenant has registered. Added 2026-09-04: a package could
        be registered and fetched by digest, and there was no way to see which ones exist —
        so screen E3 could not be built, and "which bundle is this tenant on" was
        unanswerable through the API.
      responses:
        '200':
          description: the packages this tenant has registered
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [digest, bundle_id, node_count]
                      properties:
                        digest:      { type: string }
                        bundle_id:   { type: string }
                        okf_version: { type: string }
                        node_count:  { type: integer }
    post:
      tags: [knowledge]
      operationId: registerKnowledgePackage
      security: [{adminToken: []}, {orySession: []}]
      summary: Compile-and-register; the digest is DERIVED, never client-supplied
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bundle_revision, sources]
              properties:
                bundle_revision: { type: string }
                sources:
                  type: array
                  items:
                    type: object
                    required: [source_id, commit_sha]
                    properties:
                      source_id:  { type: string }
                      commit_sha: { type: string }
      responses:
        '201':
          description: compiled and registered
          content: { application/json: { schema: { $ref: '#/components/schemas/DigestResponse' } } }
        '200':
          description: these layers already compiled to these bytes
          content: { application/json: { schema: { $ref: '#/components/schemas/DigestResponse' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/knowledge-packages/{digest}:
    get:
      tags: [knowledge]
      operationId: getKnowledgePackage
      parameters: [{ name: digest, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: the manifest projection
          content:
            application/json:
              schema:
                type: object
                required: [digest, files]
                properties:
                  digest: { type: string }
                  files:
                    type: array
                    items:
                      type: object
                      required: [path, digest]
                      properties:
                        path:   { type: string }
                        digest: { type: string }
                        type:
                          type: string
                          description: |
                            The CUSTOMER's own word for it. Open, and nothing branches on
                            it — added 2026-09-04 for screen E4, which shows both this and
                            the roles so a steward can see which one has consequences.
                        roles:
                          type: array
                          items: { type: string }
                          description: |
                            What the platform sees. THESE are what it acts on.
                        orphan:
                          type: boolean
                          description: |
                            True when nothing in the bundle reaches this node. An orphaned
                            node is knowledge no agent will ever retrieve, which is
                            usually a mistake in the bundle rather than a decision.
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
  /v1/runs/{id}/cost:
    get:
      tags: [runs]
      operationId: getRunCost
      summary: Totals for one run; the lower bound and the unpriced count travel together
      security: [{adminToken: []}, {orySession: []}]
      description: |
        Admin only, which is what features/14 already says this is: "cost is currently an
        operator view. Whether customers see their own spend, and at what granularity, is a
        product question nobody has answered."

        It had no security requirement, so any authenticated principal could read it --
        including an AGENT-class token, which is what a run itself holds. That answered the
        open product question in the permissive direction without anybody choosing, and it
        let a run read back the accounting about its own execution.

        Making it admin-only does not decide the question. It restores the state the spec
        describes, so that opening cost to customers stays a deliberate act.
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200':
          description: |
            `priced_nanos_lower_bound` and `unpriced_calls` are BOTH required. A total
            presented without the unpriced count reads as the run's cost
            (spec/18-cost.md).
          content:
            application/json:
              schema:
                type: object
                required: [priced_nanos_lower_bound, currency, unpriced_calls, calls,
                           input_tokens, output_tokens]
                properties:
                  priced_nanos_lower_bound: { type: integer }
                  currency:                 { type: string, description: ISO 4217 }
                  unpriced_calls:           { type: integer }
                  calls:                    { type: integer }
                  input_tokens:             { type: integer }
                  output_tokens:            { type: integer }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
  /v1/skills:
    get:
      tags: [knowledge]
      operationId: listSkills
      description: |
        What the agents in this tenant CAN DO, named. features/08 increment 6. Added
        2026-09-05.

        A skill is assembled from bundle nodes — a procedure carries the instructions, an
        executable carries sanctioned code, an executor names what runs it, a template shapes
        the output — and the name is what binds them into one unit a person can reason about.
        Four nodes are not four things a customer wants to switch on individually.

        Knowledge is never a skill, even when it contains instructions: knowledge is what an
        agent KNOWS, reference rather than capability, and the distinction is what keeps the
        controls apart.
      parameters:
        - name: agent_id
          in: query
          required: false
          description: whose resolved knowledge to read; omitted reads the tenant's layers
          schema: { type: string }
      responses:
        '200':
          description: the skills
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [name, nodes, roles, active]
                      properties:
                        name:  { type: string }
                        nodes: { type: array, items: { type: string } }
                        roles: { type: array, items: { type: string } }
                        active:
                          type: boolean
                          description: |
                            Whether this agent's current definition names it. Only meaningful
                            with agent_id.
  /v1/agents/{id}/skills:
    post:
      tags: [knowledge]
      operationId: activateSkill
      security: [{adminToken: []}, {orySession: []}]
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      description: |
        Turn a skill on or off for an agent. features/08 increment 6.

        Activation REGISTERS A NEW DEFINITION and repoints the agent at it. The definition is
        content-addressed, so the digest changes and the change is reviewable: the response
        carries the digest before and after and the nodes the skill contributes.

        AN IN-FLIGHT RUN KEEPS ITS OLD PIN. A run pins its definition digest when it is
        created and compares it on every resume; repointing the agent changes what the NEXT
        run pins and nothing about one already running. That is the whole reason the pin
        exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skill, active]
              properties:
                skill:  { type: string }
                active: { type: boolean }
      responses:
        '200':
          description: the agent, repointed
          content:
            application/json:
              schema:
                type: object
                required: [agent_id, skill, active, digest_before, digest_after, nodes]
                properties:
                  agent_id:      { type: string }
                  skill:         { type: string }
                  active:        { type: boolean }
                  digest_before: { type: string }
                  digest_after:
                    type: string
                    description: |
                      Equal to digest_before when the request changed nothing — activating a
                      skill that is already on is not an error and does not mint a
                      definition nobody asked for.
                  nodes:
                    type: array
                    description: what this skill contributes, so the change is reviewable
                    items: { type: string }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
        '422':
          description: no such skill in this agent's resolved knowledge
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /v1/mcp-servers:
    get:
      tags: [connections]
      operationId: listMcpServers
      description: |
        Every MCP endpoint this customer has admitted. Added 2026-09-05.

        REVOKED SERVERS ARE INCLUDED, with their state. A list that hid them would answer
        "what has this customer admitted" wrongly during an incident, which is the moment
        somebody asks.
      responses:
        '200':
          description: the admitted endpoints
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/McpServer' }
    post:
      tags: [connections]
      operationId: admitMcpServer
      security: [{adminToken: []}, {orySession: []}]
      description: |
        Admit an endpoint and PIN what it advertises. features/05 increment 5, and
        design-notes/connector-trust.md.

        The customer operates the server; we never hold their code, never build it, never
        patch it and never inherit its vulnerabilities. Nothing about admitting an endpoint
        trusts its behaviour: a server advertising a hundred tools grants access to none of
        them, because a tool is callable only when a pinned agent definition names it.

        The catalogue is pinned in the same transaction as the admission. A server admitted
        with no pinned catalogue is one whose drift can never be detected, and it would look
        identical to one that had been checked.

        A host on a blocked range is REFUSED. Whether a customer's internal MCP server may be
        reached from a data plane at all is an open decision — it needs a narrow, explicit
        allowance for an admitted server's host and nothing else, and it is the one hole
        punched in an otherwise absolute rule. Admitting one now would settle that by writing
        it into code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, endpoint, tools]
              properties:
                name:     { type: string }
                endpoint: { type: string, description: "https URL of the MCP server" }
                credential_ref:
                  type: string
                  description: |
                    A reference, never material. Keyed on the egress host rather than the
                    server, so a credential cannot travel to a different host with the
                    endpoint.
                tools:
                  type: array
                  minItems: 1
                  description: |
                    The catalogue as advertised NOW, captured by whoever is admitting it. A
                    server with no tools is nothing to admit.
                  items:
                    type: object
                    required: [name, schema_digest]
                    properties:
                      name:          { type: string }
                      description:   { type: string }
                      schema_digest:
                        type: string
                        description: |
                          Over the tool's declared input schema. The schema itself is not
                          kept: what matters is whether it changed, and holding a customer's
                          schemas invites this platform to depend on their shape.
      responses:
        '201':
          description: admitted, with its pinned catalogue
          content: { application/json: { schema: { $ref: '#/components/schemas/McpServer' } } }
        '422':
          description: |
            Refused: a blocked host, an endpoint already admitted, or a catalogue with no
            tools. The reason names which.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /v1/mcp-servers/{id}/revoke:
    post:
      tags: [connections]
      operationId: revokeMcpServer
      security: [{adminToken: []}, {orySession: []}]
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      description: |
        Withdraw an admission. A STATE, never a delete: a deleted server is one whose past
        calls nobody can explain, and "what was this thing allowed to do" is the question
        asked after an incident. Revoking twice is not an error.
      responses:
        '200':
          description: revoked
          content: { application/json: { schema: { $ref: '#/components/schemas/McpServer' } } }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
  /v1/mcp-servers/{id}/drift:
    post:
      tags: [connections]
      operationId: checkMcpDrift
      security: [{adminToken: []}, {orySession: []}]
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      description: |
        Compare the pinned catalogue with what the server advertises now. features/05
        increment 6.

        The three cases are not symmetric, and the answers differ by direction
        (design-notes/connector-trust.md): a pinned tool whose SCHEMA CHANGED refuses the
        call — same name, different behaviour, exactly what a digest exists to prevent; a
        tool that DISAPPEARED refuses, with a clearer error than the transport would give; a
        tool that APPEARED alarms only, because no pinned definition names it and refusing
        would break working systems for a change that grants nothing.

        Never fails the whole run. A run may have completed ten correct effects before
        touching a drifted tool.

        `readmit` moves the pin, and is an explicit administrative act: automatic
        re-admission means the pin protects nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tools]
              properties:
                readmit:
                  type: boolean
                  description: pin what the server advertises now, having seen the diff
                tools:
                  type: array
                  items:
                    type: object
                    required: [name, schema_digest]
                    properties:
                      name:          { type: string }
                      description:   { type: string }
                      schema_digest: { type: string }
      responses:
        '200':
          description: the diff between the pinned catalogue and the live one
          content:
            application/json:
              schema:
                type: object
                required: [pinned_digest, live_digest, drifted, changes]
                properties:
                  pinned_digest: { type: string }
                  live_digest:   { type: string }
                  drifted:       { type: boolean }
                  readmitted:    { type: boolean }
                  changes:
                    type: array
                    items:
                      type: object
                      required: [tool, kind, refuses_calls]
                      properties:
                        tool: { type: string }
                        kind: { type: string, enum: [schema_changed, removed, added] }
                        refuses_calls:
                          type: boolean
                          description: |
                            Whether a call to this tool is refused. False for `added`: no
                            pinned definition names it, so nothing can call it anyway.
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
  /v1/cost:
    get:
      tags: [cost]
      operationId: getTenantCost
      description: |
        What this customer costs over a window. Screen B5's roll-up. Added 2026-09-05.

        A LOWER BOUND, never a total, and the field is named for what it is. An unpriced
        model still runs — the tokens are already spent, so refusing to record would destroy
        evidence — and any aggregate spanning an unpriced record is a lower bound published
        with its unpriced count. There is deliberately no plain "total" to quote.

        Aggregated over EVERY EPOCH, including superseded ones. A rewind does not un-spend:
        this is the one place the log's default live-events reading is wrong, and reusing the
        state fold here is the natural mistake.

        Broken down by model, because "what does this customer cost" is nearly always
        followed by "and what is driving it".
      parameters:
        - name: since
          in: query
          required: false
          description: |
            RFC3339. Defaults to the start of the current month, because "what does this
            customer cost this month" is the question that gets asked.
          schema: { type: string, format: date-time }
        - name: until
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: the roll-up
          content:
            application/json:
              schema:
                type: object
                required: [since, until, priced_nanos_lower_bound, currency, calls,
                           unpriced_calls, runs, by_model]
                properties:
                  since: { type: string, format: date-time }
                  until: { type: string, format: date-time }
                  priced_nanos_lower_bound:
                    type: integer
                    description: |
                      The sum of what IS priced. A lower bound whenever unpriced_calls is
                      above zero, and named so it cannot be quoted as a total.
                  currency: { type: string }
                  calls:    { type: integer }
                  unpriced_calls:
                    type: integer
                    description: |
                      How many calls carry no price. Travels WITH the amount, always: an
                      amount without it is a number somebody will read as complete.
                  runs:  { type: integer }
                  input_tokens:  { type: integer }
                  output_tokens: { type: integer }
                  by_model:
                    type: array
                    description: what is driving it, heaviest first
                    items:
                      type: object
                      required: [model_ref, priced_nanos_lower_bound, calls, unpriced_calls]
                      properties:
                        model_ref: { type: string }
                        provider:  { type: string }
                        priced_nanos_lower_bound: { type: integer }
                        calls: { type: integer }
                        unpriced_calls: { type: integer }
  /v1/tasks:
    post:
      tags: [tasks]
      operationId: createTask
      security: [{adminToken: []}, {orySession: []}]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKeyRequired' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Task' }
      responses:
        '201':
          description: created
          content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: |
            `trigger_kind_unsupported` (an `event` trigger has no referent in v0.1) or
            `overlap_policy_unsupported` (`allow` is reserved and has no defined
            concurrency behaviour). spec/11-routines.md.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    get:
      tags: [tasks]
      operationId: listTasks
      responses:
        '200':
          description: the routines this tenant has registered
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Task' }
  /v1/tasks/{id}:
    patch:
      tags: [tasks]
      operationId: updateTask
      security: [{adminToken: []}, {orySession: []}]
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      description: |
        `prompt`, `overlap_policy` and `misfire_grace_seconds` only. `cron_expression`
        and `timezone` are inputs to the firing key, so changing one would rename every
        future tick and reopen ticks already decided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                prompt:                { type: string }
                overlap_policy:        { type: string, enum: [skip, queue] }
                misfire_grace_seconds: { type: integer, minimum: 0, maximum: 86400 }
        fire_key:
          type: string
          readOnly: true
          description: |
            A webhook routine's own key, returned ONCE on creation and never again. Added
            2026-09-05. The platform stores only its digest, so a database read does not
            yield a key that fires anybody's routine — which also means a lost key is
            replaced rather than recovered.

            Absent on every other trigger kind: a routine with two ways to fire has two
            firing keys and loses idempotency at the moment it matters most.
      responses:
        '200':
          description: updated
          content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: '`schedule_immutable`: a schedule field was named.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    get:
      tags: [tasks]
      operationId: getTask
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200':
          description: the routine
          content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
  /v1/tasks/{id}/pause:
    post:
      tags: [tasks]
      operationId: pauseTask
      security: [{adminToken: []}, {orySession: []}]
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200':
          description: state=paused
          content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/tasks/{id}/resume:
    post:
      tags: [tasks]
      operationId: resumeTask
      security: [{adminToken: []}, {orySession: []}]
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200':
          description: state=active
          content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/tasks/{id}/disable:
    post:
      tags: [tasks]
      operationId: disableTask
      security: [{adminToken: []}, {orySession: []}]
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200':
          description: state=disabled
          content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/tasks/{id}/fire:
    post:
      tags: [tasks]
      operationId: fireTask
      security: [{adminToken: []}, {orySession: []}]
      description: |
        The Idempotency-Key is ALSO the firing key's `value` (source `manual`), and the
        task_firings record outlives the 24h idempotency retention. Past that window a
        reused key REPLAYS the recorded firing (200) rather than 422: the route carries
        no body beyond the task it names, so a reused key and a changed body cannot be
        told apart. spec/11-routines.md.

        Amended 2026-08-30 (OQ-099): the `security` block above is the admin-caller case
        only. A `webhook` task instead authenticates this route with the per-task key held
        at `tasks.fire_key_ref` (spec/11-routines.md, spec/14-credentials.md) rather than
        the admin bearer token.

        Modeled 2026-09-05. A webhook caller presents `X-Phoenix-Fire-Key`, the value shown
        ONCE when the routine was created; the platform stores only its digest, so a database
        read does not yield a key that fires anybody's routine. The fire runs as the
        ROUTINE'S OWNER rather than as the caller: a webhook is a trigger, not an identity,
        and a routine must not outlive the authority it stands on.

        A wrong key and an unknown routine are refused identically. Distinguishing them
        would turn this route into an oracle for which routine ids exist.
      parameters:
        - { $ref: '#/components/parameters/RunId' }
        - { $ref: '#/components/parameters/IdempotencyKeyRequired' }
        - name: X-Phoenix-Fire-Key
          in: header
          required: false
          description: |
            A webhook routine's own key, instead of an admin bearer token. Ignored when the
            caller presents an admin token.
          schema: { type: string }
      responses:
        '201':
          description: fired; a Run was created in the same transaction as the firing row
          content:
            application/json:
              schema:
                type: object
                required: [firing_key, run_id]
                properties:
                  firing_key: { type: string }
                  run_id:     { type: string }
        '200':
          description: this firing key was already decided; the recorded firing is replayed
          content:
            application/json:
              schema:
                type: object
                required: [firing_key, run_id]
                properties:
                  firing_key: { type: string }
                  run_id:     { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/tasks/{id}/firings:
    get:
      tags: [tasks]
      operationId: listTaskFirings
      parameters:
        - { $ref: '#/components/parameters/RunId' }
        - { name: since, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: the decided ticks, append-only
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [firing_key, outcome]
                      properties:
                        firing_key: { type: string }
                        outcome:    { type: string }
                        run_id:     { type: string }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
  /v1/credentials:
    post:
      tags: [credentials]
      operationId: createCredential
      security: [{adminToken: []}, {orySession: []}]
      description: |
        REFUSES a row whose `egress_host` names a control-plane host
        (422 `credential_targets_control_plane`). That refusal is the mechanism behind
        spec/14's "a credential cannot be minted against the control plane"; without it
        the rule is prose. No response on this resource EVER carries `secret_ref`,
        `material_ref`, or a placeholder value.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credential' }
      responses:
        '201':
          description: created
          content: { application/json: { schema: { $ref: '#/components/schemas/Credential' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: '`credential_targets_control_plane`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    get:
      tags: [credentials]
      operationId: listCredentials
      security: [{adminToken: []}, {orySession: []}]
      responses:
        '200':
          description: credentials, without any pointer to material
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Credential' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/credentials/{id}:
    get:
      tags: [credentials]
      operationId: getCredential
      security: [{adminToken: []}, {orySession: []}]
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200':
          description: the credential, without any pointer to material
          content: { application/json: { schema: { $ref: '#/components/schemas/Credential' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
  /v1/credentials/{id}/revoke:
    post:
      tags: [credentials]
      operationId: revokeCredential
      security: [{adminToken: []}, {orySession: []}]
      description: |
        Revocation is a STATE, never a delete (spec/01-schema.md:52): issuances stay
        readable, which is what makes "what did this reach, and when did it stop"
        answerable.
      parameters: [{ $ref: '#/components/parameters/RunId' }]
      responses:
        '200':
          description: revoked_at set
          content: { application/json: { schema: { $ref: '#/components/schemas/Credential' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundOrOtherTenant' }
